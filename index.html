&lt;body&gt;
&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.1 Bewegen is gezond!&lt;/h1&gt;&lt;div id=&quot;saveStatus&quot;&gt;💾 Automatisch opslaan&lt;/div&gt;&lt;/header&gt;
&lt;section class=&quot;card&quot;&gt;
&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;
&lt;div class=&quot;goal&quot;&gt;1. Je kunt uitleggen wat er met je &lt;b&gt;hartslag, ademhaling en bloedsomloop&lt;/b&gt; gebeurt als je beweegt.&lt;/div&gt;
&lt;div class=&quot;goal&quot;&gt;2. Je kent de &lt;b&gt;beweegrichtlijnen&lt;/b&gt; voor kinderen/jongeren, volwassenen en ouderen.&lt;/div&gt;
&lt;div class=&quot;goal&quot;&gt;3. Je kunt het verschil uitleggen tussen &lt;b&gt;matig intensief&lt;/b&gt; en &lt;b&gt;zwaar intensief&lt;/b&gt; bewegen en voorbeelden geven van bewegen zonder sporten.&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;
&lt;h2&gt;Gegevens leerling&lt;/h2&gt;
&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;
&lt;div class=&quot;student-grid&quot;&gt;
&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;
&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;
&lt;p style=&quot;margin-top:12px&quot;&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Waarom bewegen gezond is&lt;/h2&gt;&lt;p&gt;Bewegen doe je elke dag: je loopt naar school, fietst, speelt buiten of sport. Zodra je beweegt, gaan je spieren, hart en longen harder werken. Ook kan bewegen ervoor zorgen dat je je fitter en prettiger voelt. In deze paragraaf ontdek je wat er in je lichaam gebeurt, hoeveel beweging gezond is en hoe je zelf meer kunt bewegen.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;chapter-theory card&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;h2&gt;1. Waarom is bewegen gezond?&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Bewegen is belangrijk voor je gezondheid. Je lichaam reageert meteen wanneer je actief wordt.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Bewegen en sporten&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIyOTgiIGN5PSIxMDMiIHI9IjI5IiBmaWxsPSIjZjBjOTZiIi8+PHBhdGggZD0iTTI5OCAxMzdsLTIzIDcxIDU3IDMzTTI3NSAyMDhsLTYwIDY3TTI3NSAyMDhsODAgNzJNMjg3IDE2MGwtNzcgMzlNMzAyIDE2NGw3NS0yNSIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjE3IiBmaWxsPSJub25lIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;
&lt;p class=&quot;lead&quot;&gt;Bewegen is goed voor je &lt;b&gt;lichaam én je hoofd&lt;/b&gt;. Zodra je gaat bewegen, moeten je spieren harder werken. Om samen te trekken hebben je spieren energie nodig. Je spiercellen gebruiken daarbij zuurstof en voedingsstoffen.&lt;/p&gt;
&lt;p&gt;Omdat de spieren meer nodig hebben, past je lichaam zich aan. Je hart gaat harder werken, je ademhaling verandert en er wordt meer bloed naar de actieve spieren vervoerd. Regelmatig bewegen helpt je fitter te blijven en zorgt ervoor dat je lichaam goed kan functioneren.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;1. Waarom hebben je spieren tijdens bewegen extra zuurstof en voedingsstoffen nodig?&lt;/b&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;a&quot;/&gt; Omdat de spieren energie nodig hebben om te werken.&lt;/label&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;b&quot;/&gt; Omdat de spieren tijdens bewegen stoppen met werken.&lt;/label&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;c&quot;/&gt; Alleen om meer te kunnen zweten.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f1&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;2. Noem twee redenen uit de theorie waarom regelmatig bewegen gezond is.&lt;/b&gt;&lt;textarea id=&quot;q2&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; id=&quot;f2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;block-actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;checkBlock(1)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(1)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter-theory card&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;h2&gt;2. Hart, bloedsomloop en spieren&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Tijdens het bewegen hebben je spieren meer zuurstof en energie nodig. Je hart en bloedvaten helpen daarbij.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Hartslag en bloedsomloop&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDI3NUMxMzMgMTcyIDE4NCA3NSAyNjYgMTExYzE4IDkgMjkgMjIgMzQgMzYgNS0xNCAxNi0yNyAzNC0zNiA4Mi0zNiAxMzMgNjEtMzQgMTY0WiIgZmlsbD0iI2U0Nzc3MCIvPjxwYXRoIGQ9Ik0xNzAgMjA4aDc1bDIyLTQwIDM3IDg1IDI4LTUzaDEwMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;
&lt;p&gt;Tijdens bewegen gaat je hart &lt;b&gt;sneller en krachtiger kloppen&lt;/b&gt;. Daardoor stroomt er meer bloed door je lichaam. Het bloed brengt extra zuurstof en voedingsstoffen naar de spieren die aan het werk zijn.&lt;/p&gt;
&lt;p&gt;De &lt;b&gt;bloedsomloop&lt;/b&gt; is het stromen van bloed door het hart en de bloedvaten. &lt;b&gt;Zuurstofrijk bloed&lt;/b&gt; bevat veel zuurstof en wordt vanuit de longen via het hart naar de spieren gepompt.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Belangrijk verband:&lt;/b&gt; spieren werken harder → hebben meer zuurstof en voedingsstoffen nodig → het hart pompt meer bloed → de hartslag gaat omhoog.&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;3. Wat vervoert het bloed naar je spieren als je beweegt?&lt;/b&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;a&quot;/&gt; Lucht en botten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;b&quot;/&gt; Zuurstof en voedingsstoffen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;c&quot;/&gt; Zweet en water&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f3&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;4. Waarom gaat je hart sneller kloppen als je sport?&lt;/b&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;a&quot;/&gt; Om meer bloed naar de spieren te pompen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;b&quot;/&gt; Om de spieren minder energie te laten gebruiken.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;c&quot;/&gt; Alleen om je lichaam warmer te maken.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f4&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;block-actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;checkBlock(2)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(2)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter-theory card&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;h2&gt;3. Je ademhaling versnelt&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Bij bewegen verandert je ademhaling. Zo krijgen je spieren meer zuurstof en raak je koolstofdioxide kwijt.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Ademhaling&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjg5IDEwNXY4NWwtNTEgMzVNMzExIDEwNXY4NWw1MSAzNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjEzIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNMjgzIDE4OWMtNjQtNTQtMTA5LTE2LTEwOSA0NiAwIDY2IDc3IDgyIDEwOSAyOVoiIGZpbGw9IiM3ZWNhZDAiLz48cGF0aCBkPSJNMzE3IDE4OWM2NC01NCAxMDktMTYgMTA5IDQ2IDAgNjYtNzcgODItMTA5IDI5WiIgZmlsbD0iIzdlY2FkMCIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;
&lt;p&gt;Als je beweegt, adem je &lt;b&gt;sneller en dieper&lt;/b&gt;. Je longen nemen extra zuurstof op. Tegelijkertijd adem je meer &lt;b&gt;koolstofdioxide&lt;/b&gt; uit. In deze paragraaf wordt koolstofdioxide uitgelegd als een afvalstof die ontstaat wanneer je lichaam en spieren aan het werk zijn.&lt;/p&gt;
&lt;p&gt;Hart en ademhaling werken hierbij samen. Je longen nemen zuurstof op, het bloed vervoert die zuurstof en je hart zorgt dat het bloed sneller bij de spieren komt.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;De volgorde bij intensiever bewegen:&lt;/b&gt;&lt;br/&gt;
1. Je begint intensiever te bewegen.&lt;br/&gt;
2. Je hartslag en ademhaling gaan omhoog.&lt;br/&gt;
3. Het bloed brengt extra zuurstof naar de spieren.&lt;br/&gt;
4. Je spieren gebruiken de aangevoerde stoffen.&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;5. Vul de zin aan.&lt;/b&gt;&lt;p&gt;Tijdens bewegen adem je sneller en &lt;input id=&quot;q5a&quot; style=&quot;width:150px&quot; type=&quot;text&quot;/&gt;. Je neemt extra &lt;input id=&quot;q5b&quot; style=&quot;width:150px&quot; type=&quot;text&quot;/&gt; op en ademt meer &lt;input id=&quot;q5c&quot; style=&quot;width:180px&quot; type=&quot;text&quot;/&gt; uit.&lt;/p&gt;&lt;div class=&quot;feedback&quot; id=&quot;f5&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;6. Zet de gebeurtenissen in een logische volgorde.&lt;/b&gt;
&lt;div class=&quot;orderzone&quot; id=&quot;order&quot;&gt;&lt;div class=&quot;order-item arrow-step&quot; data-order=&quot;3&quot; draggable=&quot;true&quot;&gt;Het bloed brengt extra zuurstof naar de spieren.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;order-item arrow-step&quot; data-order=&quot;1&quot; draggable=&quot;true&quot;&gt;Je begint intensiever te bewegen.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;order-item arrow-step&quot; data-order=&quot;4&quot; draggable=&quot;true&quot;&gt;Je spieren gebruiken de aangevoerde stoffen.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;order-item arrow-step&quot; data-order=&quot;2&quot; draggable=&quot;true&quot;&gt;Je hartslag en ademhaling gaan omhoog.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f6&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;block-actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;checkBlock(3)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(3)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score3&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter-theory card&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;h2&gt;4. Bewegen is goed voor je hersenen&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Bewegen heeft ook invloed op hoe je je voelt en hoe je denkt.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Bewegen en je hersenen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjQ1IDEyNWMtNjEtMzEtOTkgNDEtNjAgNzctMjAgNDYgMTggODYgNjMgNzUgMjUgMjEgNDkgNyA1Mi0xOCAzIDI1IDI3IDM5IDUyIDE4IDQ1IDExIDgzLTI5IDYzLTc1IDM5LTM2IDEtMTA4LTYwLTc3LTE4LTMxLTQ2LTI1LTU1LTUtOS0yMC0zNy0yNi01NSA1WiIgZmlsbD0iI2YwYjZhMyIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjgiLz48cGF0aCBkPSJNMzAwIDEyOXYxMzBNMjMyIDE3N2wyOCAyMi0xNCAzNU0zNjkgMTc3bC0yOCAyMiAxNCAzNSIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjciIGZpbGw9Im5vbmUiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;
&lt;p&gt;Door bewegen kun je je &lt;b&gt;alerter en scherper&lt;/b&gt; voelen. Je hersenen maken stofjes aan, zoals &lt;b&gt;endorfine&lt;/b&gt; en &lt;b&gt;dopamine&lt;/b&gt;. In de les worden deze stoffen gekoppeld aan een beter humeur, minder stress, motivatie en tevredenheid.&lt;/p&gt;
&lt;p&gt;Na bewegen kun je je vaak beter concentreren. Ook kan regelmatig bewegen helpen om makkelijker in slaap te vallen.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;7. Waarom kun je je na het bewegen beter voelen en concentreren?&lt;/b&gt;
&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;a&quot;/&gt; Je hersenen maken onder andere endorfine en dopamine aan.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;b&quot;/&gt; Je hersenen hebben geen zuurstof meer nodig.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;c&quot;/&gt; Je spieren nemen alle afvalstoffen uit je hersenen op.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f7&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;8. Sleep de begrippen naar de juiste groep.&lt;/b&gt;

&lt;h2&gt;5. Matig en zwaar intensief bewegen&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Niet iedere vorm van bewegen is even zwaar. Je kunt het verschil merken aan je ademhaling en hartslag.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Intensief bewegen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIzMzAiIGN5PSIxMTYiIHI9IjI3IiBmaWxsPSIjZjBjOTZiIi8+PHBhdGggZD0iTTMxMyAxNDZsLTU2IDY2IDgzIDIwTTI1NyAyMTJsLTc1IDQyTTM0MCAyMzJsNjMgNDZNMjkwIDE3MGwtODMtMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxNyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0iTTEzNSAxODZoNzZNMTE5IDIxMWg3MSIgc3Ryb2tlPSIjN2VjYWQwIiBzdHJva2Utd2lkdGg9IjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;
&lt;p&gt;&lt;b&gt;Matig intensief bewegen:&lt;/b&gt; je hartslag gaat iets omhoog en je ademt wat sneller. Je bent niet buiten adem en kunt nog gewoon praten. Voorbeelden: stevig wandelen, rustig fietsen naar school en opruimen in huis.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Zwaar intensief bewegen:&lt;/b&gt; je hartslag gaat flink omhoog. Je ademt zwaar, gaat vaak zweten en praten wordt lastiger. Voorbeelden: hardlopen, voetballen, wielrennen en intensief dansen.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Praattest:&lt;/b&gt; kun je nog gemakkelijk praten? Dan past de activiteit eerder bij matig intensief. Wordt praten lastig? Dan past deze eerder bij zwaar intensief.&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;9. Sem fietst rustig naar school en kan gemakkelijk praten. Welke soort inspanning past het best?&lt;/b&gt;&lt;select id=&quot;q9&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies...&lt;/option&gt;&lt;option value=&quot;matig&quot;&gt;Matig intensief&lt;/option&gt;&lt;option value=&quot;zwaar&quot;&gt;Zwaar intensief&lt;/option&gt;&lt;/select&gt;&lt;div class=&quot;feedback&quot; id=&quot;f9&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;10. Sorteer de activiteiten.&lt;/b&gt;
&lt;div class=&quot;drag-bank&quot; id=&quot;bank&quot;&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;matig&quot; draggable=&quot;true&quot;&gt;Stevig wandelen&lt;/span&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;zwaar&quot; draggable=&quot;true&quot;&gt;Hardlopen&lt;/span&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;matig&quot; draggable=&quot;true&quot;&gt;Rustig fietsen&lt;/span&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;zwaar&quot; draggable=&quot;true&quot;&gt;Voetballen&lt;/span&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;matig&quot; draggable=&quot;true&quot;&gt;Opruimen&lt;/span&gt;&lt;span class=&quot;drag-item&quot; data-cat=&quot;zwaar&quot; draggable=&quot;true&quot;&gt;Intensief dansen&lt;/span&gt;&lt;/div&gt;

&lt;/section&gt;
&lt;section class=&quot;chapter-theory card&quot;&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;h2&gt;6. Hoeveel beweging heb je nodig?&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;De beweegrichtlijnen helpen je om regelmatig en voldoende te bewegen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Beweegrichtlijnen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cmVjdCB4PSIxODAiIHk9IjExMCIgd2lkdGg9IjI0MCIgaGVpZ2h0PSIxNzQiIHJ4PSIxNyIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIi8+PHJlY3QgeD0iMTgwIiB5PSIxMTAiIHdpZHRoPSIyNDAiIGhlaWdodD0iNTAiIHJ4PSIxNCIgZmlsbD0iIzA4N2Y4ZCIvPjxwYXRoIGQ9Ik0yMzUgOTR2MzRNMzY1IDk0djM0IiBzdHJva2U9IiMwNzViNjUiIHN0cm9rZS13aWR0aD0iMTMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0yMjYgMjA3bDI0IDI1IDQ0LTQ5IiBzdHJva2U9IiMwODdmOGQiIHN0cm9rZS13aWR0aD0iMTMiIGZpbGw9Im5vbmUiLz48Y2lyY2xlIGN4PSIzNDciIGN5PSIyMTAiIHI9IjExIiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;
&lt;p&gt;De &lt;b&gt;beweegrichtlijnen&lt;/b&gt; geven aan hoeveel beweging wordt aangeraden om gezond te blijven.&lt;/p&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Leeftijd&lt;/th&gt;&lt;th&gt;Richtlijn uit de les&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Kinderen en jongeren (4–18)&lt;/td&gt;&lt;td&gt;Minimaal 1 uur per dag en 3× per week oefeningen voor spieren en botten.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Volwassenen (18–64)&lt;/td&gt;&lt;td&gt;Minimaal 150 minuten per week en 2× per week oefeningen voor spieren en botten.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ouderen (65+)&lt;/td&gt;&lt;td&gt;Minimaal 150 minuten per week, 2× per week oefeningen voor spieren en botten en balansoefeningen.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p&gt;Je hoeft niet op een sportvereniging te zitten om voldoende te bewegen. Lopen of fietsen naar school, traplopen, de hond uitlaten en helpen in de tuin zijn ook vormen van dagelijkse beweging.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;12. Een leerling van 14 jaar wil de richtlijn uit deze les volgen. Hoeveel moet die minimaal per dag bewegen?&lt;/b&gt;&lt;input id=&quot;q12&quot; type=&quot;text&quot;/&gt;&lt;div class=&quot;feedback&quot; id=&quot;f12&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;13. Mila zegt: “Als ik niet sport, beweeg ik dus niet.” Leg uit waarom dit niet klopt en geef twee voorbeelden.&lt;/b&gt;&lt;textarea id=&quot;q13&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; id=&quot;f13&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;14. Welke extra oefening wordt bij ouderen naast spier- en botoefeningen genoemd?&lt;/b&gt;&lt;input id=&quot;q14&quot; type=&quot;text&quot;/&gt;&lt;div class=&quot;feedback&quot; id=&quot;f14&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;block-actions&quot;&gt;&lt;button class=&quot;primary&quot; onclick=&quot;checkBlock(6)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(6)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score6&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;
&lt;h2&gt;Samenvatting&lt;/h2&gt;
&lt;h3&gt;Waarom is bewegen gezond?&lt;/h3&gt;
&lt;p&gt;Bewegen is goed voor je &lt;b&gt;lichaam én je hoofd&lt;/b&gt;. Wanneer je beweegt, moeten je spieren harder werken. Om te kunnen werken en samentrekken hebben je spieren energie nodig. Je spiercellen gebruiken daarbij onder andere &lt;b&gt;zuurstof en voedingsstoffen&lt;/b&gt;. Regelmatig bewegen helpt je fitter te blijven en zorgt ervoor dat je lichaam goed kan functioneren.&lt;/p&gt;
&lt;h3&gt;Hart, bloedsomloop en spieren&lt;/h3&gt;
&lt;p&gt;Tijdens het bewegen gaat je hart &lt;b&gt;sneller en krachtiger kloppen&lt;/b&gt;. Hierdoor wordt er meer bloed door je lichaam gepompt. Het bloed brengt extra zuurstof en voedingsstoffen naar de spieren die aan het werk zijn.&lt;/p&gt;
&lt;p&gt;De &lt;b&gt;bloedsomloop&lt;/b&gt; is het stromen van bloed door het hart en de bloedvaten. &lt;b&gt;Zuurstofrijk bloed&lt;/b&gt; bevat veel zuurstof en wordt vanuit de longen via het hart naar de spieren gepompt.&lt;/p&gt;
&lt;h3&gt;Ademhaling tijdens bewegen&lt;/h3&gt;
&lt;p&gt;Als je beweegt, ga je &lt;b&gt;sneller en dieper ademhalen&lt;/b&gt;. Je longen nemen extra zuurstof op. Tegelijkertijd adem je meer &lt;b&gt;koolstofdioxide&lt;/b&gt; uit. Hart en ademhaling werken hierbij samen: je longen nemen zuurstof op, het bloed vervoert de zuurstof en het hart zorgt ervoor dat het bloed bij de spieren komt.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;De volgorde:&lt;/b&gt; je begint intensiever te bewegen → je hartslag en ademhaling gaan omhoog → het bloed brengt extra zuurstof naar de spieren → je spieren gebruiken de aangevoerde stoffen.&lt;/div&gt;
&lt;h3&gt;Bewegen en je hersenen&lt;/h3&gt;
&lt;p&gt;Bewegen heeft ook invloed op je hersenen. Je kunt je na het bewegen &lt;b&gt;alerter en scherper&lt;/b&gt; voelen. Je hersenen maken stofjes aan, zoals &lt;b&gt;endorfine en dopamine&lt;/b&gt;. In deze les worden deze stoffen gekoppeld aan een beter humeur, minder stress, motivatie en tevredenheid. Na het bewegen kun je je vaak beter concentreren en makkelijker in slaap vallen.&lt;/p&gt;
&lt;h3&gt;Matig intensief bewegen&lt;/h3&gt;
&lt;p&gt;Bij &lt;b&gt;matig intensief bewegen&lt;/b&gt; gaat je hartslag iets omhoog en adem je wat sneller. Je bent niet buiten adem en kunt nog gewoon praten. Voorbeelden zijn:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;stevig wandelen;&lt;/li&gt;
&lt;li&gt;rustig fietsen naar school;&lt;/li&gt;
&lt;li&gt;opruimen in huis.&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Zwaar intensief bewegen&lt;/h3&gt;
&lt;p&gt;Bij &lt;b&gt;zwaar intensief bewegen&lt;/b&gt; gaat je hartslag flink omhoog. Je ademt zwaar, gaat vaak &lt;b&gt;zweten&lt;/b&gt; en praten wordt lastiger. Je kunt bijvoorbeeld bijna niet meer praten. Voorbeelden zijn:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;hardlopen;&lt;/li&gt;
&lt;li&gt;voetballen;&lt;/li&gt;
&lt;li&gt;wielrennen;&lt;/li&gt;
&lt;li&gt;intensief dansen.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Handige praattest:&lt;/b&gt; kun je nog gemakkelijk praten, dan past de activiteit eerder bij matig intensief bewegen. Wordt praten lastig, dan past de activiteit eerder bij zwaar intensief bewegen.&lt;/div&gt;
&lt;h3&gt;Beweegrichtlijnen&lt;/h3&gt;
&lt;p&gt;De &lt;b&gt;beweegrichtlijnen&lt;/b&gt; geven aan hoeveel beweging per leeftijdsgroep wordt aangeraden om gezond te blijven.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Kinderen en jongeren (4–18 jaar):&lt;/b&gt; minimaal 1 uur bewegen per dag en 3× per week oefeningen voor spieren en botten.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Volwassenen (18–64 jaar):&lt;/b&gt; minimaal 150 minuten bewegen per week en 2× per week oefeningen voor spieren en botten.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ouderen (65+):&lt;/b&gt; minimaal 150 minuten bewegen per week, 2× per week oefeningen voor spieren en botten en daarnaast balansoefeningen.&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Bewegen zonder te sporten&lt;/h3&gt;
&lt;p&gt;Je hoeft niet op een sportvereniging te zitten om voldoende te bewegen. Ook &lt;b&gt;dagelijkse beweging&lt;/b&gt; telt mee. Denk aan lopen of fietsen naar school, traplopen, de hond uitlaten of helpen in de tuin. Probeer daarnaast niet te veel stil te zitten.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Om te onthouden:&lt;/b&gt; alle kleine beetjes beweging tellen mee. Bewegen zorgt ervoor dat je spieren, hart, bloedsomloop, ademhaling én hersenen actief aan het werk zijn.&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;
&lt;details&gt;&lt;summary&gt;&lt;b&gt;Koolstofdioxide&lt;/b&gt;&lt;/summary&gt;Een afvalstof die je via je longen uitademt.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Endorfine&lt;/b&gt;&lt;/summary&gt;Een stofje in de hersenen dat tijdens beweging wordt gekoppeld aan een gelukkig en ontspannen gevoel.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Dopamine&lt;/b&gt;&lt;/summary&gt;Een stofje dat wordt gekoppeld aan beloning, motivatie en tevredenheid.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Voedingsstoffen&lt;/b&gt;&lt;/summary&gt;Stoffen uit eten die je lichaam en spieren energie en bouwstoffen geven.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Bloedsomloop&lt;/b&gt;&lt;/summary&gt;Het stromen van bloed door het hart en de bloedvaten.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Zuurstofrijk bloed&lt;/b&gt;&lt;/summary&gt;Bloed met veel zuurstof dat vanuit de longen via het hart naar de spieren wordt gepompt.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Beweegrichtlijn&lt;/b&gt;&lt;/summary&gt;Het officiële advies over de minimale hoeveelheid beweging per leeftijdsgroep.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Matig intensief bewegen&lt;/b&gt;&lt;/summary&gt;Bewegen waarbij hartslag en ademhaling iets versnellen, maar praten makkelijk blijft.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;&lt;b&gt;Zwaar intensief bewegen&lt;/b&gt;&lt;/summary&gt;Bewegen waarbij je zwaar ademt, vaak zweet en praten moeilijker wordt.&lt;/details&gt;&lt;/section&gt;

let seconds=45*60,running=false,timerId=null;
function renderTime(){let m=Math.floor(seconds/60),x=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function toggleTimer(){running=!running;if(running){timerId=setInterval(()=&gt;{if(seconds&gt;0){seconds--;renderTime()}else{clearInterval(timerId);running=false;alert('De 45 minuten zijn voorbij.')}} ,1000)}else clearInterval(timerId)}
function resetTimer(){clearInterval(timerId);running=false;seconds=2700;renderTime()}
let dragged=null;

 }

  a=radio('q4');ok=a==='a';if(ok)p++;fb('f4',ok,ok?'Het hart pompt meer bloed rond zodat de spieren extra zuurstof en voedingsstoffen krijgen.':'De belangrijkste reden is dat er meer bloed naar de actieve spieren moet.');

 }
 if(n===3){

  let seq=[...document.querySelectorAll('#order .order-item')].map(x=&gt;+x.dataset.order);ok=seq.join(',')==='1,2,3,4';if(ok)p++;fb('f6',ok,ok?'De volgorde is goed. Deze vier stappen staan nu ook duidelijk in het theorieblok erboven.':'Bekijk het stappenplan in de theorie nog eens: bewegen → hartslag en ademhaling omhoog → extra zuurstof via het bloed → spieren gebruiken de stoffen.');

 if(n===4){

  let i8=[...document.querySelectorAll('#bank2 ~ .dropgrid .drag-item')];ok=i8.length===6&amp;&amp;i8.every(i=&gt;i.parentElement.dataset.accept===i.dataset.cat);if(ok)p++;fb('f8',ok,ok?'Alles staat bij de juiste groep.':'Hartslag, ademhaling en bloed naar spieren horen bij het lichaam. Endorfine, dopamine en concentratie bij hersenen/gevoel.');

 if(n===5){

  let i10=[...document.querySelectorAll('#bank ~ .dropgrid .drag-item')];ok=i10.length===6&amp;&amp;i10.every(i=&gt;i.parentElement.dataset.accept===i.dataset.cat);if(ok)p++;fb('f10',ok,ok?'Alle activiteiten zijn goed gesorteerd.':'Stevig wandelen, rustig fietsen en opruimen zijn matig; hardlopen, voetballen en intensief dansen zijn zwaar intensief.');

  if(a.includes('zwaar ademen')||a.includes('ademt zwaar')||a.includes('sneller ademen')||a.includes('ademhaling gaat omhoog')||a.includes('snellere ademhaling')||a.includes('buiten adem')) kenmerken++;
  ok=noemtZwaar&amp;&amp;kenmerken&gt;=2;
  if(ok)p++;
  fb('f11',ok,ok?'Goed. Je noemt &lt;b&gt;zwaar intensief bewegen&lt;/b&gt; en gebruikt minimaal twee passende kenmerken. Mogelijke kenmerken zijn: &lt;b&gt;zweet&lt;/b&gt;, &lt;b&gt;kan bijna niet praten&lt;/b&gt;, een flink hogere hartslag en zwaar ademen.':'Noem eerst &lt;b&gt;zwaar intensief bewegen&lt;/b&gt; en gebruik daarna minimaal twee kenmerken uit de situatie/theorie. Bijvoorbeeld: &lt;b&gt;zweet&lt;/b&gt;, &lt;b&gt;kan bijna niet praten&lt;/b&gt;, een flink hogere hartslag of zwaar ademen.');
  scoreBlock(5,p,3);
 }
 if(n===6){
  a=norm(q12.value);ok=a.includes('1 uur')||a.includes('60');if(ok)p++;fb('f12',ok,ok?'Voor 4–18 jaar noemt de les minimaal 1 uur per dag.':'Een 14-jarige valt onder kinderen en jongeren: minimaal &lt;b&gt;1 uur per dag&lt;/b&gt;.');
  a=norm(q13.value);ok=a.length&gt;40&amp;&amp;(a.includes('fiets')||a.includes('loop')||a.includes('trap')||a.includes('hond')||a.includes('tuin'));if(ok)p++;fb('f13',ok,ok?'Je laat zien dat dagelijkse beweging ook meetelt.':'Je kunt ook zonder sporten bewegen, bijvoorbeeld fietsen/lopen naar school, traplopen, de hond uitlaten of helpen in de tuin.');
  a=norm(q14.value);ok=a.includes('balans');if(ok)p++;fb('f14',ok,ok?'Bij ouderen worden ook balansoefeningen genoemd.':'Het extra onderdeel bij ouderen is &lt;b&gt;balansoefeningen&lt;/b&gt;.');

 }

function resetBlock(n){
 const sections=[null,['q1','q2'],['q3','q4'],['q5a','q5b','q5c'],['q7'],['q9','q11'],['q12','q13','q14']];
 const radios={1:['q1'],2:['q3','q4'],4:['q7']};
 (radios[n]||[]).forEach(name=&gt;document.querySelectorAll('input[name=&quot;'+name+'&quot;]').forEach(x=&gt;x.checked=false));
 (sections[n]||[]).forEach(id=&gt;{let e=document.getElementById(id);if(e){if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''}});
 if(n===3){let order=document.getElementById('order');[3,1,4,2].forEach(v=&gt;{let el=order.querySelector('[data-order=&quot;'+v+'&quot;]');if(el)order.appendChild(el)})}
 if(n===4){let bank=document.getElementById('bank2');document.querySelectorAll('#bank2 ~ .dropgrid .drag-item').forEach(x=&gt;bank.appendChild(x))}
 if(n===5){let bank=document.getElementById('bank');document.querySelectorAll('#bank ~ .dropgrid .drag-item').forEach(x=&gt;bank.appendChild(x))}
 const fbs={1:['f1','f2'],2:['f3','f4'],3:['f5','f6'],4:['f7','f8'],5:['f9','f10','f11'],6:['f12','f13','f14']};
 clearFb(fbs[n]);document.getElementById('score'+n).textContent='';

const SAVE_KEY='verzorging_2_1_bewegen_v9';

function collectState(){
  const values={};
  document.querySelectorAll('input[type=&quot;text&quot;], textarea, select').forEach(el=&gt;{
    if(el.id) values[el.id]=el.value;
  });
  const radios={};
  document.querySelectorAll('input[type=&quot;radio&quot;]').forEach(el=&gt;{
    if(el.name &amp;&amp; el.checked) radios[el.name]=el.value || el.closest('label')?.textContent.trim() || 'checked';
  });
  const order=[...document.querySelectorAll('#order .order-item')].map(el=&gt;el.dataset.order);
  const drops={};
  document.querySelectorAll('.dropzone').forEach((z,i)=&gt;{
    drops[i]=[...z.querySelectorAll('.drag-item')].map(el=&gt;el.textContent.trim());
  });
  const scores={};
  for(let i=1;i&lt;=6;i++) scores[i]=document.getElementById('score'+i)?.textContent||'';
  return {values,radios,order,drops,scores,savedAt:new Date().toISOString()};
}

function saveState(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(collectState()));
    const st=document.getElementById('saveStatus');
    if(st){
      const d=new Date();
      st.textContent='💾 Opgeslagen om '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){
    const st=document.getElementById('saveStatus');
    if(st) st.textContent='⚠️ Opslaan niet beschikbaar in deze browser';
  }
}

function restoreState(){
  let data=null;
  try{ data=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!data) return;

  Object.entries(data.values||{}).forEach(([id,val])=&gt;{
    const el=document.getElementById(id);
    if(el) el.value=val;
  });

  Object.entries(data.radios||{}).forEach(([name,val])=&gt;{
    const candidates=[...document.querySelectorAll('input[type=&quot;radio&quot;][name=&quot;'+name+'&quot;]')];
    let match=candidates.find(el=&gt;el.value===val);
    if(!match) match=candidates.find(el=&gt;(el.closest('label')?.textContent.trim()||'')===val);
    if(match) match.checked=true;
  });

  if(Array.isArray(data.order)){
    const zone=document.getElementById('order');
    data.order.forEach(v=&gt;{
      const el=zone?.querySelector('[data-order=&quot;'+v+'&quot;]');
      if(el) zone.appendChild(el);
    });
  }

  if(data.drops){
    const zones=[...document.querySelectorAll('.dropzone')];
    Object.entries(data.drops).forEach(([idx,texts])=&gt;{
      const z=zones[Number(idx)];
      if(!z) return;
      (texts||[]).forEach(txt=&gt;{
        const el=[...document.querySelectorAll('.drag-item')].find(x=&gt;x.textContent.trim()===txt);
        if(el) z.appendChild(el);
      });
    });
  }

  Object.entries(data.scores||{}).forEach(([i,val])=&gt;{
    const el=document.getElementById('score'+i);
    if(el) el.textContent=val;
  });

  const st=document.getElementById('saveStatus');
  if(st &amp;&amp; data.savedAt){
    const d=new Date(data.savedAt);
    st.textContent='💾 Vorig werk hersteld – laatst opgeslagen '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  }
}

function clearSavedWork(){
  if(confirm('Weet je zeker dat je alle automatisch opgeslagen antwoorden op dit apparaat wilt wissen?')){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
}

// Save on typing, clicking and changing selections.
document.addEventListener('input',()=&gt;saveState());
document.addEventListener('change',()=&gt;saveState());
document.addEventListener('click',e=&gt;{
  if(e.target.closest('.drag-item,.dropzone,.order-item')) setTimeout(saveState,100);
});
document.addEventListener('drop',()=&gt;setTimeout(saveState,150));

// Also save every 10 seconds as an extra safety net.
setInterval(saveState,10000);

// Save before the tab/window closes.
window.addEventListener('beforeunload',saveState);

restoreState();

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.2 Welke sport past bij jou?&lt;/h1&gt;&lt;div id=&quot;saveStatus&quot;&gt;💾 Automatisch opslaan&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;&lt;div class=&quot;goal&quot;&gt;1. Het verschil tussen teamsport en individuele sport en hun voor- en nadelen.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;2. Het verschil tussen gebonden en ongebonden sporten.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;3. Welke manier van sporten past bij jouw leefstijl, karakter en weekplanning.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gegevens leerling&lt;/h2&gt;&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;&lt;div class=&quot;student-grid&quot;&gt;&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:12px&quot;&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot; type=&quot;button&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Welke sport past bij jou?&lt;/h2&gt;&lt;p&gt;Niet iedereen vindt dezelfde sport leuk. De één speelt graag samen in een team, terwijl de ander liever alleen sport. Ook maakt het verschil of je bij een vereniging sport of zelf bepaalt wanneer je gaat bewegen. In deze paragraaf leer je welke soorten sporten er zijn en hoe je een sport kiest die past bij jouw interesses, karakter en vrije tijd.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block0&quot;&gt;&lt;h2&gt;1. Samen of alleen sporten?&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Sommige sporten doe je samen, andere vooral alleen. Beide vormen hebben eigen kenmerken.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Samen of alleen sporten&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIyMzUiIGN5PSIxNDIiIHI9IjI2IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iMzY1IiBjeT0iMTQyIiByPSIyNiIgZmlsbD0iI2YwYzk2YiIvPjxwYXRoIGQ9Ik0xODYgMjQ5cTEyLTczIDQ5LTczdDQ5IDczTTMxNiAyNDlxMTItNzMgNDktNzN0NDkgNzMiIGZpbGw9IiM3ZWNhZDAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSI4Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMjUxIiByPSIyOSIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjkiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Teamsport&lt;/h3&gt;&lt;p&gt;Er zijn veel verschillende manieren om te sporten. Bij een &lt;strong&gt;teamsport&lt;/strong&gt; werk je samen met andere spelers om een doel te bereiken. Voorbeelden zijn voetbal, hockey, volleybal en basketbal.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Individuele sport&lt;/h3&gt;&lt;p&gt;Bij een &lt;strong&gt;individuele sport&lt;/strong&gt; sport en presteer je vooral voor jezelf. Voorbeelden zijn hardlopen, zwemmen, turnen, wielrennen, judo en tennis. Een &lt;strong&gt;individuele sport&lt;/strong&gt; kun je soms wel samen met anderen trainen.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Belangrijk verschil&lt;/h3&gt;&lt;p&gt;Het verschil gaat dus over hoe je de sport beoefent. Het zegt nog niet of je lid bent van een vereniging.&lt;/p&gt;&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;&lt;div class=&quot;question&quot; id=&quot;q1&quot;&gt;&lt;strong&gt;1. Wat is het belangrijkste kenmerk van een teamsport?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a1&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Je bent altijd lid van een vereniging.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a1&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Je werkt samen met andere spelers aan een doel.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a1&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Je bepaalt altijd zelf wanneer je traint.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q2&quot;&gt;&lt;strong&gt;2. Sleep de sporten naar de juiste groep.&lt;/strong&gt;&lt;div class=&quot;dragbank&quot; id=&quot;bank2&quot;&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;0&quot; draggable=&quot;true&quot;&gt;Voetbal&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;1&quot; draggable=&quot;true&quot;&gt;Hardlopen&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;2&quot; draggable=&quot;true&quot;&gt;Volleybal&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;3&quot; draggable=&quot;true&quot;&gt;Wielrennen&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;4&quot; draggable=&quot;true&quot;&gt;Hockey&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;5&quot; draggable=&quot;true&quot;&gt;Tennis&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;6&quot; draggable=&quot;true&quot;&gt;Zwemmen&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;7&quot; draggable=&quot;true&quot;&gt;Basketbal&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Teamsport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;0&quot; data-q=&quot;2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Individuele sport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;1&quot; data-q=&quot;2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q3&quot;&gt;&lt;strong&gt;3. Noor zwemt samen met anderen tijdens een training, maar zwemt haar wedstrijd voor haar eigen tijd. Welke sportvorm is dit?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a3&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Een teamsport, omdat ze samen traint.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a3&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Een individuele sport, omdat haar eigen prestatie telt.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a3&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Geen sport, omdat ze tegen zichzelf zwemt.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(0)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;reset&quot; onclick=&quot;resetBlock(0)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score0&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block1&quot;&gt;&lt;h2&gt;2. Voordelen en nadelen&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Samen sporten en individueel sporten hebben allebei voordelen en nadelen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Voor- en nadelen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDExMXYxNjNNMjAzIDI3NWgxOTRNMjA1IDE1N2gxOTAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0iTTIzNSAxNTdsLTUzIDkxaDEwNlpNMzY1IDE1N2wtNTMgOTFoMTA2WiIgZmlsbD0iIzdlY2FkMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjciLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIxMTEiIHI9IjE2IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Voordelen van teamsport&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Teamsport&lt;/strong&gt; heeft voordelen: je leert &lt;strong&gt;samenwerken&lt;/strong&gt; en communiceren, hebt contact met anderen en teamgenoten kunnen elkaar motiveren. Je werkt samen aan hetzelfde doel.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Nadelen van teamsport&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Teamsport&lt;/strong&gt; heeft ook nadelen: je bent afhankelijk van teamgenoten, trainingen en wedstrijden zijn vaak op vaste tijden en er kunnen meningsverschillen ontstaan.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Voordelen van individuele sport&lt;/h3&gt;&lt;p&gt;Bij een &lt;strong&gt;individuele sport&lt;/strong&gt; kun je je richten op je eigen prestaties en ben je minder afhankelijk van anderen. Bij sommige sporten kun je zelf je sportmoment kiezen.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Nadelen van individuele sport&lt;/h3&gt;&lt;p&gt;Nadelen van individueel sporten zijn dat je minder contact met teamgenoten hebt, jezelf vaak moet motiveren en niet kunt terugvallen op een team. Welke voor- en nadelen belangrijk zijn, verschilt per persoon.&lt;/p&gt;&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;&lt;div class=&quot;question&quot; id=&quot;q4&quot;&gt;&lt;strong&gt;4. Lina wil samenwerken, nieuwe mensen ontmoeten en samen wedstrijden spelen. Wat past het beste?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a4&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Een individuele sport&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a4&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Een teamsport&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a4&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Geen van beide&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f4&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q5&quot;&gt;&lt;strong&gt;5. Sorteer de voor- en nadelen.&lt;/strong&gt;&lt;div class=&quot;dragbank&quot; id=&quot;bank5&quot;&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;0&quot; draggable=&quot;true&quot;&gt;Samen leren werken&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;1&quot; draggable=&quot;true&quot;&gt;Afhankelijk van teamgenoten&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;2&quot; data-item=&quot;2&quot; draggable=&quot;true&quot;&gt;Je eigen prestaties verbeteren&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;3&quot; data-item=&quot;3&quot; draggable=&quot;true&quot;&gt;Jezelf moeten motiveren&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;4&quot; draggable=&quot;true&quot;&gt;Contact met anderen&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;5&quot; draggable=&quot;true&quot;&gt;Vaste trainingstijden&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;2&quot; data-item=&quot;6&quot; draggable=&quot;true&quot;&gt;Minder afhankelijk van anderen&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;3&quot; data-item=&quot;7&quot; draggable=&quot;true&quot;&gt;Niet terugvallen op een team&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Voordeel teamsport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;0&quot; data-q=&quot;5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Nadeel teamsport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;1&quot; data-q=&quot;5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Voordeel individuele sport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;2&quot; data-q=&quot;5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Nadeel individuele sport&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;3&quot; data-q=&quot;5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q6&quot;&gt;&lt;strong&gt;6. Milan zegt: ‘Bij een teamsport zijn er alleen voordelen.’ Leg uit waarom dit niet klopt. Noem één voordeel en één nadeel.&lt;/strong&gt;&lt;textarea id=&quot;open6&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; id=&quot;f6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(1)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;reset&quot; onclick=&quot;resetBlock(1)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block2&quot;&gt;&lt;h2&gt;3. Gebonden en ongebonden sporten&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Bij een vereniging gelden vaak vaste afspraken. Je kunt ook sporten zonder lid te zijn van een club.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Sportvereniging of vrij sporten&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMTc1IDE3MmwxMjUtNzcgMTI1IDc3djEyNEgxNzVaIiBmaWxsPSIjZmZmIiBzdHJva2U9IiMwNzViNjUiIHN0cm9rZS13aWR0aD0iMTAiLz48cGF0aCBkPSJNMTc1IDE3MmgyNTBNMjY5IDI5NnYtNzZoNjJ2NzYiIHN0cm9rZT0iIzA4N2Y4ZCIgc3Ryb2tlLXdpZHRoPSIxMiIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjE2NSIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Gebonden sporten&lt;/h3&gt;&lt;p&gt;Bij &lt;strong&gt;gebonden sporten&lt;/strong&gt; sport je bijvoorbeeld bij een &lt;strong&gt;sportvereniging&lt;/strong&gt;. Je bent lid, betaalt meestal &lt;strong&gt;contributie&lt;/strong&gt; en hebt vaak &lt;strong&gt;vaste trainingen&lt;/strong&gt; of wedstrijden. Er is meestal een trainer en er zijn regels.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Ongebonden sporten&lt;/h3&gt;&lt;p&gt;Bij &lt;strong&gt;ongebonden sporten&lt;/strong&gt; ben je niet gebonden aan een traditionele &lt;strong&gt;sportvereniging&lt;/strong&gt;. Je bepaalt vaak zelf waar en wanneer je beweegt. Voorbeelden zijn hardlopen in het park, thuis sporten, skateboarden en buiten fietsen.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Twee verschillende indelingen&lt;/h3&gt;&lt;p&gt;Gebonden en ongebonden gaat over hoe de sport is georganiseerd. Team of individueel gaat over hoe je de sport uitvoert. Je kunt dus een &lt;strong&gt;individuele sport&lt;/strong&gt; doen bij een vereniging, zoals wedstrijdzwemmen.&lt;/p&gt;&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;&lt;div class=&quot;question&quot; id=&quot;q7&quot;&gt;&lt;strong&gt;7. Youssef traint elke dinsdag en donderdag bij zijn voetbalvereniging en betaalt contributie. Wat is dit?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a7&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Ongebonden sporten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a7&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Gebonden sporten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a7&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Alleen individueel bewegen&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f7&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q8&quot;&gt;&lt;strong&gt;8. Noah doet aan wedstrijdzwemmen bij een zwemvereniging. Hij traint drie keer per week op vaste tijden. Welke combinatie klopt?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a8&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Teamsport en ongebonden&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a8&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Teamsport en gebonden&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a8&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Individuele sport en gebonden&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a8&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt;Individuele sport en ongebonden&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f8&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q9&quot;&gt;&lt;strong&gt;9. Sleep de voorbeelden naar gebonden of ongebonden sporten.&lt;/strong&gt;&lt;div class=&quot;dragbank&quot; id=&quot;bank9&quot;&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;0&quot; draggable=&quot;true&quot;&gt;Hockey bij een club&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;1&quot; draggable=&quot;true&quot;&gt;Hardlopen in het park&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;2&quot; draggable=&quot;true&quot;&gt;Volleybal bij een vereniging&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;3&quot; draggable=&quot;true&quot;&gt;Thuis trainen wanneer je wilt&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;0&quot; data-item=&quot;4&quot; draggable=&quot;true&quot;&gt;Voetbaltraining bij een club&lt;/span&gt;&lt;span class=&quot;chip&quot; data-group=&quot;1&quot; data-item=&quot;5&quot; draggable=&quot;true&quot;&gt;Zelf buiten fietsen&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Gebonden&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;0&quot; data-q=&quot;9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zone&quot;&gt;&lt;h4&gt;Ongebonden&lt;/h4&gt;&lt;div class=&quot;drop&quot; data-group=&quot;1&quot; data-q=&quot;9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q10&quot;&gt;&lt;strong&gt;10. Vul de twee begrippen in: Bij een vereniging betaal je meestal ____. Als je zelf bepaalt waar en wanneer je sport, sport je vaak ____.&lt;/strong&gt;&lt;p&gt;Antwoord 1: &lt;input id=&quot;fill10_0&quot; type=&quot;text&quot;/&gt;&lt;/p&gt;&lt;p&gt;Antwoord 2: &lt;input id=&quot;fill10_1&quot; type=&quot;text&quot;/&gt;&lt;/p&gt;&lt;div class=&quot;feedback&quot; id=&quot;f10&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(2)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;reset&quot; onclick=&quot;resetBlock(2)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block3&quot;&gt;&lt;h2&gt;4. Welke sport past bij jou?&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Een passende sport sluit aan bij je interesses, tijd en mogelijkheden.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Welke sport past bij jou&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMTg1IDE0NWgyMjVNMTg1IDE0NWw0MC0zNU0xODUgMTQ1bDQwIDM1TTQxMCAxNDVsLTQwLTM1TTQxMCAxNDVsLTQwIDM1IiBzdHJva2U9IiMwNzViNjUiIHN0cm9rZS13aWR0aD0iMTIiIGZpbGw9Im5vbmUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjI0MCIgcj0iNDMiIGZpbGw9IiM3ZWNhZDAiLz48cGF0aCBkPSJNMjgyIDI0MGwxNCAxNCAyOS0zMiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjEwIiBmaWxsPSJub25lIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Karakter en interesses&lt;/h3&gt;&lt;p&gt;Niet iedereen vindt dezelfde manier van sporten prettig. Een sport moet passen bij je &lt;strong&gt;karakter&lt;/strong&gt;, je interesses en je leefstijl. De één houdt van &lt;strong&gt;samenwerken&lt;/strong&gt;, de ander sport liever zelfstandig en op eigen tempo.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Tijd, geld en weekplanning&lt;/h3&gt;&lt;p&gt;Ook je &lt;strong&gt;weekplanning&lt;/strong&gt; is belangrijk: hoeveel vrije tijd heb je en wanneer kun je sporten? Denk daarnaast aan de kosten, zoals &lt;strong&gt;contributie&lt;/strong&gt;, en of je liever alleen of samen sport.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Plezier en motivatie&lt;/h3&gt;&lt;p&gt;Er is niet één sport die voor iedereen het beste is. &lt;strong&gt;Plezier&lt;/strong&gt; is belangrijk om sporten langere tijd vol te houden. &lt;strong&gt;Motivatie&lt;/strong&gt; helpt je te beginnen en door te gaan. &lt;strong&gt;Zelfdiscipline&lt;/strong&gt; betekent dat je jezelf toch aanzet om iets te doen als je minder zin hebt.&lt;/p&gt;&lt;h3&gt;Vragen bij deze theorie&lt;/h3&gt;&lt;div class=&quot;question&quot; id=&quot;q11&quot;&gt;&lt;strong&gt;11. Sara heeft op wisselende dagen tijd en wil zelf kunnen bepalen wanneer ze sport. Welke keuze past het best?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a11&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Een teamsport met verplichte training op vaste avonden&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a11&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Zelf hardlopen wanneer het haar uitkomt&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a11&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Een vereniging met vaste wedstrijden&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f11&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q12&quot;&gt;&lt;strong&gt;12. Zet de stappen voor een passende sportkeuze in een logische volgorde.&lt;/strong&gt;&lt;p&gt;Gebruik de pijlen om de stappen onder elkaar in de juiste volgorde te zetten.&lt;/p&gt;&lt;div class=&quot;drop&quot; id=&quot;order12&quot;&gt;&lt;div class=&quot;chip arrow-step&quot; data-item=&quot;2&quot; draggable=&quot;true&quot;&gt;Vergelijk sporten die bij je wensen passen.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;chip arrow-step&quot; data-item=&quot;0&quot; draggable=&quot;true&quot;&gt;Bedenk wat je leuk vindt en of je alleen of samen wilt sporten.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;chip arrow-step&quot; data-item=&quot;3&quot; draggable=&quot;true&quot;&gt;Kies een sport die je wilt proberen.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;chip arrow-step&quot; data-item=&quot;1&quot; draggable=&quot;true&quot;&gt;Kijk hoeveel tijd en geld je beschikbaar hebt.&lt;button aria-label=&quot;Omhoog&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;step-arrow&quot; draggable=&quot;false&quot; onclick=&quot;moveOrderArrow(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f12&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q13&quot;&gt;&lt;strong&gt;13. Kies een sport die bij jou past. Leg uit met minstens drie redenen: karakter, plezier/interesse, tijd, geld of alleen/samen.&lt;/strong&gt;&lt;textarea id=&quot;open13&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; id=&quot;f13&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q14&quot;&gt;&lt;strong&gt;14. Wat is het verschil tussen motivatie en zelfdiscipline? Geef bij beide een voorbeeld.&lt;/strong&gt;&lt;textarea id=&quot;open14&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; id=&quot;f14&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; id=&quot;q15&quot;&gt;&lt;strong&gt;15. Welke uitspraak is het beste?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a15&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Iedereen moet dezelfde sport kiezen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a15&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;De duurste sport is altijd het beste.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;a15&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Een sport moet bij jouw interesses, tijd en mogelijkheden passen.&lt;/label&gt;&lt;div class=&quot;feedback&quot; id=&quot;f15&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(3)&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;reset&quot; onclick=&quot;resetBlock(3)&quot;&gt;Reset&lt;/button&gt;&lt;div class=&quot;score&quot; id=&quot;score3&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Samenvatting&lt;/h2&gt;&lt;h3&gt;Teamsport en individuele sport&lt;/h3&gt;&lt;p&gt;Bij een &lt;strong&gt;teamsport&lt;/strong&gt; werk je samen met teamgenoten. Je leert &lt;strong&gt;samenwerken&lt;/strong&gt; en communiceren, maar bent ook afhankelijk van anderen. Bij een &lt;strong&gt;individuele sport&lt;/strong&gt; telt vooral je eigen prestatie. Je bent zelfstandiger, maar moet jezelf vaak motiveren.&lt;/p&gt;&lt;h3&gt;Voordelen en nadelen&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Teamsport&lt;/strong&gt; kan gezellig zijn en teamgenoten kunnen elkaar helpen. Nadelen zijn vaste tijden, afhankelijkheid en soms meningsverschillen. Individueel sporten geeft meer zelfstandigheid en soms meer vrijheid, maar je mist soms een team om op terug te vallen.&lt;/p&gt;&lt;h3&gt;Gebonden en ongebonden&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Gebonden sporten&lt;/strong&gt; doe je bijvoorbeeld bij een vereniging: vaak &lt;strong&gt;contributie&lt;/strong&gt;, regels en vaste trainingstijden. &lt;strong&gt;Ongebonden sporten&lt;/strong&gt; geeft meer vrijheid om zelf te bepalen waar en wanneer je sport. Een &lt;strong&gt;individuele sport&lt;/strong&gt; kan óók gebonden zijn, zoals wedstrijdzwemmen bij een vereniging.&lt;/p&gt;&lt;h3&gt;Een sport kiezen&lt;/h3&gt;&lt;p&gt;Denk aan je &lt;strong&gt;karakter&lt;/strong&gt;, interesses, &lt;strong&gt;plezier&lt;/strong&gt;, tijd, &lt;strong&gt;weekplanning&lt;/strong&gt;, geld en of je alleen of samen wilt sporten. &lt;strong&gt;Plezier&lt;/strong&gt; helpt om het sporten vol te houden. &lt;strong&gt;Motivatie&lt;/strong&gt; is de reden waarom je sport; &lt;strong&gt;zelfdiscipline&lt;/strong&gt; helpt om door te gaan als je minder zin hebt.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Teamsport&lt;/summary&gt;Een sport waarbij je samen met andere spelers in een team sport.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Individuele sport&lt;/summary&gt;Een sport waarbij je vooral zelf sport en verantwoordelijk bent voor je eigen prestatie.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Gebonden sport&lt;/summary&gt;Sport die bijvoorbeeld via een vereniging wordt georganiseerd, vaak met vaste trainingen en regels.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Ongebonden sport&lt;/summary&gt;Sport zonder binding aan een traditionele vereniging; je bepaalt vaker zelf waar en wanneer.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Contributie&lt;/summary&gt;Het bedrag dat je betaalt om lid te zijn van een vereniging.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Sportvereniging&lt;/summary&gt;Een organisatie waar mensen samen een bepaalde sport beoefenen.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Motivatie&lt;/summary&gt;De reden of wil om iets te doen en ermee door te gaan.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Zelfdiscipline&lt;/summary&gt;Jezelf ertoe zetten iets te doen, ook als je minder zin hebt.&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Exit-ticket&lt;/h2&gt;&lt;p&gt;Wat heb je geleerd over het kiezen van een passende sport?&lt;/p&gt;&lt;textarea id=&quot;exitText&quot;&gt;&lt;/textarea&gt;&lt;p&gt;Ik begrijp deze les:&lt;/p&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exitRating&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt;Nog niet goed&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exitRating&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt;Een beetje&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exitRating&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt;Goed&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exitRating&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt;Ik kan het uitleggen&lt;/label&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
