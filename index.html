&lt;h3&gt;Slapen is herstellen&lt;/h3&gt;&lt;p&gt;Tijdens je slaap krijgt je lichaam de kans om te &lt;strong&gt;herstellen&lt;/strong&gt;. Slaap helpt bij lichamelijk herstel, concentratie, reactiesnelheid en sportprestaties. Vooral tijdens &lt;strong&gt;diepe slaap&lt;/strong&gt; vinden belangrijke herstelprocessen plaats. Tijdens de slaap wordt ook &lt;strong&gt;groeihormoon&lt;/strong&gt; afgegeven, dat helpt bij groei en herstel van weefsel.&lt;/p&gt;
&lt;h3&gt;Hoeveel slaap heb je nodig?&lt;/h3&gt;&lt;p&gt;De aanbevolen slaapduur verschilt per leeftijdsgroep. In de onderstaande tabel staan de slaapuren uit de les.&lt;/p&gt;
&lt;h3&gt;Aanbevolen slaapduur per leeftijdsgroep&lt;/h3&gt;
&lt;div class=&quot;sleep-table-wrap&quot;&gt;&lt;table class=&quot;sleep-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Leeftijdsgroep&lt;/th&gt;&lt;th&gt;Aanbevolen slaapduur per nacht&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Baby's (0–1 jaar)&lt;/td&gt;&lt;td&gt;12–16 uur&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Kinderen (1–3 jaar)&lt;/td&gt;&lt;td&gt;11–14 uur&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Jongeren (4–17 jaar)&lt;/td&gt;&lt;td&gt;8–10 uur&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Volwassenen (18–64 jaar)&lt;/td&gt;&lt;td&gt;7–9 uur&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Ouderen (65+ jaar)&lt;/td&gt;&lt;td&gt;7–8 uur&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;h3&gt;Wat gebeurt er bij te weinig slaap?&lt;/h3&gt;&lt;p&gt;Je kunt sneller moe zijn, je minder goed concentreren, langzamer reageren en minder goed sporten. Ook kan de kans op blessures toenemen.&lt;/p&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q11&quot;&gt;&lt;strong&gt;Opdracht 11. Noah is 14 jaar, gamet tot 01.00 uur en staat om 07.00 uur op. Waarom is dat geen goed idee voor zijn voetbalwedstrijd?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Zijn spieren krijgen te veel eiwitten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Zijn maximale hartslag wordt lager&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Zijn lichaam krijgt te weinig tijd om goed te herstellen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Zijn lichaam krijgt te veel energie&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback11&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q12&quot;&gt;&lt;strong&gt;Opdracht 12. Welke slaapduur staat in de les bij jongeren van 4 tot 17 jaar?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; 4–6 uur&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; 6–7 uur&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; 8–10 uur&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; 12–16 uur&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback12&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q13&quot;&gt;&lt;strong&gt;Opdracht 13. Vul de juiste begrippen in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Tijdens de ________ slaap vinden belangrijke herstelprocessen plaats.&lt;input aria-label=&quot;Antwoord 1&quot; placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Tijdens de slaap wordt ook ________ afgegeven.&lt;input aria-label=&quot;Antwoord 2&quot; placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback13&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q14&quot;&gt;&lt;strong&gt;Opdracht 14. Noem twee gevolgen van regelmatig te weinig slapen voor een sporter.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Bij open vragen vergelijk je jouw antwoord met de voorbeelduitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback14&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(2)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(2)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block3&quot;&gt;&lt;h2&gt;4. Slim omgaan met eten, drinken en rust&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Gezond sporten vraagt om een goede combinatie van voeding, vocht en rust.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Eten, drinken en rust&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDExMXYxNjNNMjAzIDI3NWgxOTRNMjA1IDE1N2gxOTAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0iTTIzNSAxNTdsLTUzIDkxaDEwNlpNMzY1IDE1N2wtNTMgOTFoMTA2WiIgZmlsbD0iIzdlY2FkMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjciLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIxMTEiIHI9IjE2IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;
&lt;h3&gt;Voor, tijdens en na het sporten&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Voor het sporten:&lt;/strong&gt; eet een passende maaltijd met koolhydraten om energie te hebben. Een erg vette maaltijd vlak voor het sporten kan zwaar op je maag liggen.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Tijdens het sporten:&lt;/strong&gt; vul vocht aan, meestal met water.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Na het sporten:&lt;/strong&gt; drink voldoende en eet gezond. Eiwitten ondersteunen het herstel van je spieren. Zorg ook voor voldoende slaap.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;De belangrijkste les:&lt;/strong&gt; goed sporten betekent niet alleen trainen. Voeding, drinken en slaap helpen je lichaam om te presteren en te herstellen.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q15&quot;&gt;&lt;strong&gt;Opdracht 15. Wanneer past deze handeling het beste?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een maaltijd met koolhydraten&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Voor het sporten&lt;/option&gt;&lt;option&gt;Tijdens het sporten&lt;/option&gt;&lt;option&gt;Na het sporten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Verloren vocht aanvullen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Voor het sporten&lt;/option&gt;&lt;option&gt;Tijdens het sporten&lt;/option&gt;&lt;option&gt;Na het sporten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Eiwitten uit gezonde voeding voor spierherstel&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Voor het sporten&lt;/option&gt;&lt;option&gt;Tijdens het sporten&lt;/option&gt;&lt;option&gt;Na het sporten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback15&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q16&quot;&gt;&lt;strong&gt;Opdracht 16. Zet de stappen van een verstandige sportdag in de juiste volgorde.&lt;/strong&gt;&lt;p class=&quot;subtle&quot;&gt;Gebruik de pijltjes om de stappen onder elkaar in de juiste volgorde te zetten.&lt;/p&gt;&lt;div class=&quot;steps&quot;&gt;&lt;div class=&quot;step&quot; data-step=&quot;0&quot;&gt;&lt;span&gt;Zorg voor voldoende nachtrust&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;1&quot;&gt;&lt;span&gt;Eet en drink na afloop voor herstel&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;2&quot;&gt;&lt;span&gt;Sport en drink voldoende water&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;3&quot;&gt;&lt;span&gt;Eet vooraf een passende maaltijd&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback16&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q17&quot;&gt;&lt;strong&gt;Opdracht 17. Welke uitspraak over fit blijven is juist?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q17&quot; type=&quot;radio& /strong&gt; leveren energie en kunnen worden opgeslagen als reserve. Een erg vette maaltijd vlak voor het sporten kan zwaar op de maag liggen.&lt;/p&gt;&lt;h3&gt;Voldoende drinken&lt;/h3&gt;&lt;p&gt;Tijdens sporten verlies je vocht door &lt;strong&gt;zweten&lt;/strong&gt;. Als je te weinig vocht hebt, kun je &lt;strong&gt;uitdrogen&lt;/strong&gt;. Dat kan leiden tot dorst, hoofdpijn, duizeligheid en slechtere prestaties. Voor gewone sportactiviteiten is &lt;strong&gt;water&lt;/strong&gt; meestal een goede keuze. &lt;strong&gt;Energiedrank&lt;/strong&gt; bevat meestal veel cafeïne en vaak veel suiker en is geen goede standaarddrank bij het sporten.&lt;/p&gt;&lt;h3&gt;Slapen en herstellen&lt;/h3&gt;&lt;p&gt;Tijdens de slaap herstelt je lichaam. &lt;strong&gt;Diepe slaap&lt;/strong&gt; en &lt;strong&gt;groeihormoon&lt;/strong&gt; spelen daarbij een rol. De les noemt voor jongeren &lt;strong&gt;8–10 uur&lt;/strong&gt; slaap per nacht. Te weinig slaap kan zorgen voor vermoeidheid, slechtere concentratie, tragere reacties, minder goede sportprestaties en meer kans op blessures.&lt;/p&gt;&lt;h3&gt;Voor, tijdens en na het sporten&lt;/h3&gt;&lt;p&gt;Vooraf helpt een passende maaltijd met koolhydraten. Tijdens het sporten vul je vocht aan. Na afloop helpen gezonde voeding, vocht en slaap je lichaam te herstellen.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Macronutriënten&lt;/summary&gt;Voedingsstoffen die je lichaam in grote hoeveelheden nodig heeft, zoals koolhydraten, eiwitten en vetten.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Koolhydraten&lt;/summary&gt;Voedingsstoffen die vooral energie leveren.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Eiwitten&lt;/summary&gt;Bouwstoffen voor onder andere onderhoud, opbouw en herstel van spieren.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Vetten&lt;/summary&gt;Voedingsstoffen die energie leveren en als reserve kunnen worden opgeslagen.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Hydratatie&lt;/summary&gt;Zorgen dat je lichaam voldoende vocht heeft.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Dehydratatie&lt;/summary&gt;Uitdroging doordat je lichaam te weinig vocht heeft.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Cafeïne&lt;/summary&gt;Een stof die je tijdelijk alerter kan maken en onder andere in energiedrank, koffie en cola zit.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Bloedsuikerspiegel&lt;/summary&gt;De hoeveelheid glucose (suiker) in je bloed.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Diepe slaap&lt;/summary&gt;Een slaapfase waarin belangrijke herstelprocessen plaatsvinden.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Groeihormoon&lt;/summary&gt;Een hormoon dat belangrijk is voor groei en herstel van weefsel.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Brandstoffen&lt;/summary&gt;Voedingsstoffen die je lichaam energie geven.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Bouwstoffen&lt;/summary&gt;Voedingsstoffen voor groei, opbouw en herstel van je lichaam.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Reservestoffen&lt;/summary&gt;Voedingsstoffen die je lichaam opslaat voor later.&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Beschermende stoffen&lt;/summary&gt;Stoffen die helpen je lichaam goed te laten werken, zoals vitamines en mineralen.&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Exit-ticket&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Hoe goed begrijp je deze paragraaf?&lt;/strong&gt;&lt;/p&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Goed&quot;/&gt; Ik begrijp het goed.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Deels&quot;/&gt; Ik begrijp een deel, maar wil nog oefenen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Hulp&quot;/&gt; Ik heb nog uitleg nodig &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.5 Veilig sporten en blessures voorkomen&lt;/h1&gt;&lt;div class=&quot;small&quot; id=&quot;saveStatus&quot;&gt;Antwoorden worden automatisch opgeslagen&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;&lt;div class=&quot;goal&quot;&gt;Je leert waarom een goede warming-up en cooling-down belangrijk zijn voor je lichaam.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert welke beschermingsmiddelen en sportschoenen bij verschillende sporten passen.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert hoe je de RICE-regel kunt gebruiken bij een acute sportblessure.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gegevens leerling&lt;/h2&gt;&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;/div&gt;&lt;p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot; type=&quot;button&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Veilig sporten&lt;/h2&gt;&lt;p&gt;Sporten helpt je om fit te blijven. Toch kan er iets misgaan: je glijdt uit, verzwikt je enkel of botst tegen iemand aan. Niet elke blessure kun je voorkomen, maar je kunt de kans wel kleiner maken. &lt;strong&gt;Veilig sporten begint vóór de training.&lt;/strong&gt; Je bereidt je lichaam voor, kiest goede schoenen en bescherming en controleert of de plek veilig is. Ook leer je wat je moet doen als iemand toch geblesseerd raakt.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block0&quot;&gt;&lt;h2&gt;1. Warming-up en cooling-down&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Een goede voorbereiding en rustige afsluiting horen bij veilig sporten.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Warming-up en cooling-down&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIzMzAiIGN5PSIxMTYiIHI9IjI3IiBmaWxsPSIjZjBjOTZiIi8+PHBhdGggZD0iTTMxMyAxNDZsLTU2IDY2IDgzIDIwTTI1NyAyMTJsLTc1IDQyTTM0MCAyMzJsNjMgNDZNMjkwIDE3MGwtODMtMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxNyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0iTTEzNSAxODZoNzZNMTE5IDIxMWg3MSIgc3Ryb2tlPSIjN2VjYWQwIiBzdHJva2Utd2lkdGg9IjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;&lt;h3&gt;Waarom een warming-up?&lt;/h3&gt;&lt;p&gt;Bij een &lt;strong&gt;warming-up&lt;/strong&gt; bereid je je lichaam stap voor stap voor op bewegen. Je &lt;strong&gt;hartslag en ademhaling&lt;/strong&gt; gaan geleidelijk omhoog. Er stroomt meer bloed naar je spieren en je spieren worden warmer. Daardoor kun je beter overschakelen naar snelle, krachtige bewegingen. Een goede warming-up helpt je om voorbereid en geconcentreerd te beginnen en kan de kans op bepaalde blessures verkleinen.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Voorbeeld voetbal:&lt;/strong&gt; eerst rustig joggen, daarna draaien, versnellen en passen met de bal. Begin niet meteen met volle sprints. Je maakt de oefeningen steeds iets zwaarder.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Volgorde:&lt;/strong&gt; rustig beginnen → lichaam en spieren worden warmer → intensiteit verhogen → klaar voor de training of wedstrijd.&lt;/div&gt;&lt;h3&gt;Waarom een cooling-down?&lt;/h3&gt;&lt;p&gt;Na een zware inspanning zijn je hartslag en ademhaling nog hoog. Met een &lt;strong&gt;cooling-down&lt;/strong&gt; bouw je de inspanning rustig af, bijvoorbeeld door enkele minuten te wandelen of rustig uit te lopen. Je hartslag en ademhaling kunnen dan geleidelijk teruggaan naar het &lt;strong&gt;rustniveau&lt;/strong&gt;. Een cooling-down is niet bewezen als manier om spierpijn helemaal te voorkomen.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Voorbeeld:&lt;/strong&gt; na een voetbalwedstrijd loop je eerst rustig uit in plaats van meteen stil te gaan zitten.&lt;/p&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q1&quot;&gt;&lt;strong&gt;Opdracht 1. Als je jong en fit bent, heb je geen warming-up nodig.&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Eens&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Oneens&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q2&quot;&gt;&lt;strong&gt;Opdracht 2. Hoe bouw je een warming-up goed op?&lt;/strong&gt;&lt;p class=&quot;subtle&quot;&gt;Gebruik de pijltjes om de stappen in de juiste volgorde te zetten.&lt;/p&gt;&lt;div class=&quot;steps&quot;&gt;&lt;div class=&quot;step&quot; data-step=&quot;0&quot;&gt;&lt;span&gt;Klaar voor de training of wedstrijd&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;1&quot;&gt;&lt;span&gt;Intensiteit verhogen&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;2&quot;&gt;&lt;span&gt;Lichaam en spieren worden warmer&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;3&quot;&gt;&lt;span&gt;Rustig beginnen&lt;/span&gt;&lt;span class=&quot;stepbuttons&quot;&gt;&lt;button aria-label=&quot;Omhoog&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q3&quot;&gt;&lt;strong&gt;Opdracht 3. Hoort dit bij de warming-up of cooling-down?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Hartslag geleidelijk laten dalen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Warming-up&lt;/option&gt;&lt;option&gt;Cooling-down&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Voorbereiden op inspanning&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Warming-up&lt;/option&gt;&lt;option&gt;Cooling-down&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Rustig uitlopen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Warming-up&lt;/option&gt;&lt;option&gt;Cooling-down&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Hartslag geleidelijk verhogen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Warming-up&lt;/option&gt;&lt;option&gt;Cooling-down&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q4&quot;&gt;&lt;strong&gt;Opdracht 4. Daan heeft 70 minuten intensief gevoetbald en gaat direct zitten. Wat kan hij beter doen?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Direct opnieuw sprintjes trekken&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Zo snel mogelijk naar huis gaan&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Nog een paar minuten rustig uitlopen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q4&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Meteen helemaal stilzitten&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback4&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q5&quot;&gt;&lt;strong&gt;Opdracht 5. Vul de juiste woorden in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Een ________ doe je vóór de inspanning.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Een ________ doe je na de inspanning.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(0)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(0)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score0&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block1&quot;&gt;&lt;h2&gt;2. Bescherming en geschikte sportschoenen&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Bij verschillende sporten gebruik je passende schoenen en beschermingsmiddelen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Beschermingsmiddelen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMTc3IDI0NXYtMzhhMTIzIDEyMyAwIDAgMSAyNDYgMHYzOFoiIGZpbGw9IiM3ZWNhZDAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMiIvPjxwYXRoIGQ9Ik0xNzUgMjQ0aDI3ME0zMTAgMTIwdjEyMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjEyIi8+PHBhdGggZD0iTTM4MiAyNDZsLTE4IDM3IiBzdHJva2U9IiMwNzViNjUiIHN0cm9rZS13aWR0aD0iMTEiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;h3&gt;Waarom beschermingsmiddelen?&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Beschermingsmiddelen&lt;/strong&gt; beschermen kwetsbare delen van je lichaam bij een botsing, klap of val. Ze verkleinen de kans op letsel, maar maken een sport niet helemaal zonder risico. Gebruik materiaal dat goed past en niet beschadigd is.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Voetbal:&lt;/strong&gt; scheenbeschermers beschermen je schenen tegen trappen.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Hockey:&lt;/strong&gt; een bitje beschermt tanden en mond; scheenbeschermers beschermen je onderbenen.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Wielrennen en skiën:&lt;/strong&gt; een passende helm beschermt je hoofd bij een val.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Skaten:&lt;/strong&gt; een helm en knie-, elleboog- en eventueel polsbeschermers beschermen bij een val.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Boksen:&lt;/strong&gt; bokshandschoenen beschermen onder andere de handen; een bitje beschermt tanden en mond.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Voetbalkeeper:&lt;/strong&gt; keepershandschoenen helpen de handen beschermen en geven grip op de bal.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Welke sportschoenen kies je?&lt;/h3&gt;&lt;p&gt;De juiste schoenen zorgen voor &lt;strong&gt;grip&lt;/strong&gt; en ondersteuning. &lt;strong&gt;Zaalschoenen&lt;/strong&gt; hebben een platte rubberen zool voor grip op een gladde sportvloer. Een &lt;strong&gt;non-marking zool&lt;/strong&gt; laat geen strepen achter. &lt;strong&gt;Veldschoenen&lt;/strong&gt; hebben noppen die passen bij gras of kunstgras. Let ook op een goede pasvorm en voldoende &lt;strong&gt;schokdemping&lt;/strong&gt;, bijvoorbeeld bij rennen en springen. Met verkeerde schoenen kun je sneller uitglijden of verkeerd landen.&lt;/p&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q6&quot;&gt;&lt;strong&gt;Opdracht 6. Welk beschermingsmiddel past bij de sport?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Voetbal&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Hockey&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Wielrennen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Skaten&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Boksen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Skiën&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Keepen bij voetbal&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Scheenbeschermers&lt;/option&gt;&lt;option&gt;Bitje en scheenbeschermers&lt;/option&gt;&lt;option&gt;Helm&lt;/option&gt;&lt;option&gt;Helm, knie- en elleboogbeschermers&lt;/option&gt;&lt;option&gt;Bokshandschoenen en bitje&lt;/option&gt;&lt;option&gt;Skihelm&lt;/option&gt;&lt;option&gt;Keepershandschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q7&quot;&gt;&lt;strong&gt;Opdracht 7. Welke schoenen zijn het meest geschikt voor een gladde sportvloer?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Veldschoenen met noppen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Zaalschoenen met een rubberen zool&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Gewone slippers&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Schoenen met metalen noppen&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback7&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q8&quot;&gt;&lt;strong&gt;Opdracht 8. Koppel de eigenschap aan de juiste schoen.&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Platte rubberen zool&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Zaalschoenen&lt;/option&gt;&lt;option&gt;Veldschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Noppen voor gras of kunstgras&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Zaalschoenen&lt;/option&gt;&lt;option&gt;Veldschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Vaak een non-marking zool&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Zaalschoenen&lt;/option&gt;&lt;option&gt;Veldschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Grip op een voetbalveld&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Zaalschoenen&lt;/option&gt;&lt;option&gt;Veldschoenen&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback8&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q9&quot;&gt;&lt;strong&gt;Opdracht 9. Waar moet je vooral op letten bij het kiezen van sportschoenen?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Alleen het merk&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Alleen de kleur&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Of ze bij de sport en ondergrond passen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Of ze het duurst zijn&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q10&quot;&gt;&lt;strong&gt;Opdracht 10. Leg uit waarom verkeerde schoenen het risico op blessures kunnen vergroten.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback10&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(1)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(1)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block2&quot;&gt;&lt;h2&gt;3. Acute blessures en de RICE-regel&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Een blessure kan plotseling ontstaan. Dan is het belangrijk om verstandig te handelen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Acute blessures en RICE&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cmVjdCB4PSIxODYiIHk9IjE0MCIgd2lkdGg9IjIyOCIgaGVpZ2h0PSIxNjAiIHJ4PSIyMiIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIi8+PHBhdGggZD0iTTI3MCAxMTZoNjB2MjVoLTYwWiIgZmlsbD0iI2YwYzk2YiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjkiLz48cGF0aCBkPSJNMjg3IDE3NGgyNnYzNWgzNXYyNmgtMzV2MzVoLTI2di0zNWgtMzV2LTI2aDM1WiIgZmlsbD0iI2U0Nzc3MCIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;&lt;h3&gt;Wat is een acute blessure?&lt;/h3&gt;&lt;p&gt;Een &lt;strong&gt;acute blessure&lt;/strong&gt; ontstaat plotseling tijdens het sporten. Vaak voel je direct pijn en kun je het lichaamsdeel minder goed gebruiken. Soms ontstaat ook &lt;strong&gt;zwelling&lt;/strong&gt; of een blauwe plek. Een acute blessure is anders dan &lt;strong&gt;overbelasting&lt;/strong&gt;: daarbij ontstaan klachten meestal geleidelijk doordat je te vaak of te zwaar traint.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Voorbeelden:&lt;/strong&gt; je verzwikt je enkel bij een landing; je verrekt een spier tijdens een sprint; je krijgt een harde klap tegen je knie; of je valt op je pols. Bij pijn stop je met sporten en vertel je het aan de trainer of docent.&lt;/p&gt;&lt;h3&gt;De RICE-regel&lt;/h3&gt;&lt;p&gt;Bij bepaalde lichte acute blessures, zoals een verzwikking, kun je de &lt;strong&gt;RICE-regel&lt;/strong&gt; onthouden als eerste stappenplan:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;R – Rust:&lt;/strong&gt; stop met sporten en belast de blessure niet verder.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;I – IJs:&lt;/strong&gt; koel eventueel kort met een coldpack of ijs in een doek. &lt;strong&gt;Leg ijs nooit direct op je huid:&lt;/strong&gt; de extreme kou kan je huid beschadigen en zelfs bevriezingsletsel veroorzaken. Koelen kan pijn verminderen, maar is niet bij elke blessure noodzakelijk.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;C – Compressie:&lt;/strong&gt; een passend drukverband kan steun geven en zwelling helpen beperken. Het mag niet te strak zitten.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;E – Elevatie:&lt;/strong&gt; leg het geblesseerde lichaamsdeel zo mogelijk omhoog om zwelling te helpen beperken.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Let op:&lt;/strong&gt; bij ernstige pijn, een vreemde stand, gevoelloosheid, niet kunnen steunen of twijfel: laat een volwassene hulp regelen en laat de blessure beoordelen. Probeer niet zelf een bot of gewricht recht te zetten.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q11&quot;&gt;&lt;strong&gt;Opdracht 11. Waar staat de C van RICE voor?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Cooling-down&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Conditie&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Compressie&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Coördinatie&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback11&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q12&quot;&gt;&lt;strong&gt;Opdracht 12. Mila verzwikt haar enkel bij basketbal. Haar enkel doet pijn en wordt dik. Wat moet ze als eerste doen?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Stoppen met sporten en haar enkel rust geven&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Doorlopen zodat de enkel warm blijft&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Een sprintje proberen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q12&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; De pijn negeren&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback12&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q13&quot;&gt;&lt;strong&gt;Opdracht 13. Waar staan de letters van de RICE-regel voor?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;R&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Rust&lt;/option&gt;&lt;option&gt;IJs&lt;/option&gt;&lt;option&gt;Compressie&lt;/option&gt;&lt;option&gt;Elevatie&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;I&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Rust&lt;/option&gt;&lt;option&gt;IJs&lt;/option&gt;&lt;option&gt;Compressie&lt;/option&gt;&lt;option&gt;Elevatie&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;C&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Rust&lt;/option&gt;&lt;option&gt;IJs&lt;/option&gt;&lt;option&gt;Compressie&lt;/option&gt;&lt;option&gt;Elevatie&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;E&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Rust&lt;/option&gt;&lt;option&gt;IJs&lt;/option&gt;&lt;option&gt;Compressie&lt;/option&gt;&lt;option&gt;Elevatie&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback13&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q14&quot;&gt;&lt;strong&gt;Opdracht 14. Waarom mag je ijs niet rechtstreeks op de huid leggen?&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback14&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(2)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(2)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block3&quot;&gt;&lt;h2&gt;4. Een veilige sportomgeving&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Ook de sportplek en het materiaal bepalen hoe veilig je kunt sporten.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Een veilige sportomgeving&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cmVjdCB4PSIxNTAiIHk9IjExOSIgd2lkdGg9IjMwMCIgaGVpZ2h0PSIxODEiIHJ4PSIxMiIgZmlsbD0iIzdlY2FkMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIi8+PHBhdGggZD0iTTMwMCAxMTl2MTgxTTE1MCAxNzBoNDB2NzhoLTQwTTQ1MCAxNzBoLTQwdjc4aDQwIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iOSIgZmlsbD0ibm9uZSIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjIxMCIgcj0iNDIiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI5IiBmaWxsPSJub25lIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;h3&gt;Controleer de plek vóór je begint&lt;/h3&gt;&lt;p&gt;Een veilige &lt;strong&gt;sportomgeving&lt;/strong&gt; voorkomt dat je struikelt, uitglijdt of tegen gevaarlijke spullen botst. Kijk daarom niet alleen naar je eigen lichaam, maar ook naar de ondergrond, het materiaal en de mensen om je heen.&lt;/p&gt;&lt;h3&gt;In een sporthal&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Vloer:&lt;/strong&gt; zorg dat de vloer droog en schoon is. Op een natte vloer kun je uitglijden.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Losse spullen:&lt;/strong&gt; ruim tassen, ballen en andere voorwerpen op zodat niemand erover struikelt.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Sportmateriaal:&lt;/strong&gt; controleer of toestellen, banken en doelen stevig en veilig staan. Gebruik geen kapot materiaal.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Ruimte:&lt;/strong&gt; houd voldoende afstand van muren en andere sporters.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Buiten sporten&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Ondergrond:&lt;/strong&gt; let op gaten, stenen, plassen en gladde plekken.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Weer:&lt;/strong&gt; bij regen kan het glad zijn; bij hitte zijn voldoende drinken en rust belangrijk.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Materiaal en kleding:&lt;/strong&gt; draag schoenen die bij het veld passen en gebruik passende bescherming.&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Wat doe je bij gevaar?&lt;/strong&gt; Stop, haal het gevaar weg als dat veilig kan, of meld het aan de docent of trainer. Begin pas als je veilig kunt sporten.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q15&quot;&gt;&lt;strong&gt;Opdracht 15. Welke maatregel hoort bij welke situatie?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Spullen op de sportvloer opruimen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Sporthal&lt;/option&gt;&lt;option&gt;Buiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Gaten in het veld controleren&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Sporthal&lt;/option&gt;&lt;option&gt;Buiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Controleren of toestellen stevig staan&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Sporthal&lt;/option&gt;&lt;option&gt;Buiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Rekening houden met gladheid door regen&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Sporthal&lt;/option&gt;&lt;option&gt;Buiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback15&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q16&quot;&gt;&lt;strong&gt;Opdracht 16. Je ziet een losliggende mat in de sporthal. Wat doe je?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q17&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Gewoon beginnen met sporten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q17&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; De mat negeren&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q17&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; De mat veilig neerleggen of het gevaar melden&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q17&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Wachten tot iemand valt&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback16&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q17&quot;&gt;&lt;strong&gt;Opdracht 17. Sam begint zonder warming-up, draagt geen scheenbeschermers en speelt op een nat veld. Noem twee dingen die hij vóór het sporten veiliger had kunnen doen.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback17&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q18&quot;&gt;&lt;strong&gt;Opdracht 18. Vul de juiste begrippen in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Een blessure die plotseling ontstaat, is een ________ blessure.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Materiaal dat je lichaam beschermt heet een ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback18&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q19&quot;&gt;&lt;strong&gt;Opdracht 19. Bedenk drie maatregelen waarmee jij veilig kunt sporten.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback19&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(3)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(3)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score3&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Samenvatting&lt;/h2&gt;&lt;h3&gt;Warming-up en cooling-down&lt;/h3&gt;&lt;p&gt;Een &lt;strong&gt;warming-up&lt;/strong&gt; doe je vóór het sporten: je begint rustig, je spieren worden warmer en je hartslag en ademhaling stijgen geleidelijk. Daarna verhoog je de intensiteit. Een &lt;strong&gt;cooling-down&lt;/strong&gt; doe je na een zware inspanning: je beweegt rustig door, zodat hartslag en ademhaling geleidelijk terugkeren naar rust.&lt;/p&gt;&lt;h3&gt;Bescherming en schoenen&lt;/h3&gt;&lt;p&gt;Gebruik &lt;strong&gt;beschermingsmiddelen&lt;/strong&gt; die passen bij de sport: scheenbeschermers bij voetbal, bitje en scheenbeschermers bij hockey, helm bij wielrennen en skiën, helm en knie-/elleboogbeschermers bij skaten, en bokshandschoenen en bitje bij boksen. &lt;strong&gt;Zaalschoenen&lt;/strong&gt; hebben een rubberen zool; &lt;strong&gt;veldschoenen&lt;/strong&gt; hebben noppen. Goede grip en passende schoenen verkleinen de kans op uitglijden.&lt;/p&gt;&lt;h3&gt;Acute blessure en RICE&lt;/h3&gt;&lt;p&gt;Een &lt;strong&gt;acute blessure&lt;/strong&gt; ontstaat plotseling, bijvoorbeeld door een verzwikking, val of klap. &lt;strong&gt;Overbelasting&lt;/strong&gt; ontstaat meestal geleidelijk. Bij een blessure stop je met sporten. &lt;strong&gt;RICE&lt;/strong&gt; staat voor Rust, IJs (eventueel koelen met een doek tussen ijs en huid), Compressie (een passend drukverband) en Elevatie (omhoog leggen). IJs direct op de huid kan de huid beschadigen. Bij ernstige klachten of twijfel vraag je hulp.&lt;/p&gt;&lt;h3&gt;Veilige sportomgeving&lt;/h3&gt;&lt;p&gt;Controleer binnen of de vloer droog is, spullen zijn opgeruimd en toestellen stevig staan. Controleer buiten op gaten, gladheid en het weer. Gebruik veilig materiaal en meld gevaarlijke situaties &lt;strong&gt;voordat&lt;/strong&gt; je begint.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Warming-up&lt;/summary&gt;&lt;p&gt;Oefeningen waarmee je je lichaam voorbereidt op inspanning.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Cooling-down&lt;/summary&gt;&lt;p&gt;Rustige beweging na inspanning waarmee je je lichaam geleidelijk naar rust brengt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Reactiesnelheid&lt;/summary&gt;&lt;p&gt;Hoe snel je reageert op iets wat gebeurt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Rustniveau&lt;/summary&gt;&lt;p&gt;De toestand van je lichaam wanneer je niet lichamelijk actief bent.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Beschermingsmiddel&lt;/summary&gt;&lt;p&gt;Materiaal dat je lichaam tijdens het sporten tegen letsel beschermt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Non-marking zool&lt;/summary&gt;&lt;p&gt;Een schoenzool die geschikt is voor een sportvloer en geen strepen achterlaat.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Schokdemping&lt;/summary&gt;&lt;p&gt;Het opvangen van schokken tijdens bijvoorbeeld rennen en springen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Overbelasting&lt;/summary&gt;&lt;p&gt;Klachten of schade doordat een lichaamsdeel te zwaar of te vaak wordt belast.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Acuut letsel&lt;/summary&gt;&lt;p&gt;Een blessure die plotseling ontstaat.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;RICE-regel&lt;/summary&gt;&lt;p&gt;Een stappenplan bij bepaalde acute blessures: Rust, IJs, Compressie en Elevatie.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Compressie&lt;/summary&gt;&lt;p&gt;Druk geven rond een blessure, bijvoorbeeld met een verband.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Elevatie&lt;/summary&gt;&lt;p&gt;Een geblesseerd lichaamsdeel omhoog leggen.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Exit-ticket&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Hoe goed begrijp je deze paragraaf?&lt;/strong&gt;&lt;/p&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Goed&quot;/&gt; Ik begrijp het goed.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Deels&quot;/&gt; Ik begrijp een deel, maar wil nog oefenen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Hulp&quot;/&gt; Ik heb nog uitleg nodig.&lt;/label&gt;&lt;p&gt;&lt;strong&gt;Wat heb je vandaag geleerd?&lt;/strong&gt;&lt;/p&gt;&lt;textarea id=&quot;exitText&quot; placeholder=&quot;Schrijf één belangrijk ding op...&quot;&gt;&lt;/textarea&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
const Q=[{&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Als je jong en fit bent, heb je geen warming-up nodig.&quot;, &quot;options&quot;: [&quot;Eens&quot;, &quot;Oneens&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Ook als je jong en fit bent, is het verstandig je lichaam geleidelijk op de inspanning voor te bereiden.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;order&quot;, &quot;title&quot;: &quot;Hoe bouw je een warming-up goed op?&quot;, &quot;steps&quot;: [&quot;Rustig beginnen&quot;, &quot;Lichaam en spieren worden warmer&quot;, &quot;Intensiteit verhogen&quot;, &quot;Klaar voor de training of wedstrijd&quot;], &quot;explain&quot;: &quot;Je begint rustig, wordt warm, verhoogt daarna de intensiteit en bent vervolgens klaar voor de inspanning.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Hoort dit bij de warming-up of cooling-down?&quot;, &quot;items&quot;: [[&quot;Hartslag geleidelijk laten dalen&quot;, &quot;Cooling-down&quot;], [&quot;Voorbereiden op inspanning&quot;, &quot;Warming-up&quot;], [&quot;Rustig uitlopen&quot;, &quot;Cooling-down&quot;], [&quot;Hartslag geleidelijk verhogen&quot;, &quot;Warming-up&quot;]], &quot;choices&quot;: [&quot;Warming-up&quot;, &quot;Cooling-down&quot;], &quot;explain&quot;: &quot;Een warming-up bereidt je voor op inspanning; een cooling-down helpt je geleidelijk terug te keren naar rust.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Daan heeft 70 minuten intensief gevoetbald en gaat direct zitten. Wat kan hij beter doen?&quot;, &quot;options&quot;: [&quot;Direct opnieuw sprintjes trekken&quot;, &quot;Zo snel mogelijk naar huis gaan&quot;, &quot;Nog een paar minuten rustig uitlopen&quot;, &quot;Meteen helemaal stilzitten&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Rustig uitlopen is een cooling-down. Zo dalen hartslag en ademhaling geleidelijk.&quot;}, {&quot;blo Zaalschoenen met een platte rubberen zool geven grip op een sportvloer.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Koppel de eigenschap aan de juiste schoen.&quot;, &quot;items&quot;: [[&quot;Platte rubberen zool&quot;, &quot;Zaalschoenen&quot;], [&quot;Noppen voor gras of kunstgras&quot;, &quot;Veldschoenen&quot;], [&quot;Vaak een non-marking zool&quot;, &quot;Zaalschoenen&quot;], [&quot;Grip op een voetbalveld&quot;, &quot;Veldschoenen&quot;]], &quot;choices&quot;: [&quot;Zaalschoenen&quot;, &quot;Veldschoenen&quot;], &quot;explain&quot;: &quot;Zaalschoenen hebben meestal een platte rubberen zool; veldschoenen noppen voor grip op gras of kunstgras.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Waar moet je vooral op letten bij het kiezen van sportschoenen?&quot;, &quot;options&quot;: [&quot;Alleen het merk&quot;, &quot;Alleen de kleur&quot;, &quot;Of ze bij de sport en ondergrond passen&quot;, &quot;Of ze het duurst zijn&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Schoenen moeten passen bij de sport en de ondergrond, zodat je voldoende grip hebt.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;open&quot;, &quot;title&quot;: &quot;Leg uit waarom verkeerde schoenen het risico op blessures kunnen vergroten.&quot;, &quot;explain&quot;: &quot;Verkeerde schoenen kunnen minder grip geven. Daardoor kun je makkelijker uitglijden of verkeerd landen.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Waar staat de C van RICE voor?&quot;, &quot;options&quot;: [&quot;Cooling-down&quot;, &quot;Conditie&quot;, &quot;Compressie&quot;, &quot;Coördinatie&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;De C staat voor compressie: druk geven met bijvoorbeeld een verband om te ondersteunen en zwelling te helpen beperken.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Mila verzwikt total++;if(ok)correct++;
let extra='';
if(q.kind==='match')extra='\nJuiste indeling:\n'+q.items.map(([a,c])=&gt;'• '+a+' → '+(a==='Noten'?'Vetten of eiwitten':c)).join('\n');
