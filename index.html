&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.3 Fit worden en fit blijven&lt;/h1&gt;&lt;div class=&quot;small&quot; id=&quot;saveStatus&quot;&gt;💾 Antwoorden worden automatisch opgeslagen&lt;/div&gt;&lt;/header&gt;&lt;main&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;&lt;div class=&quot;goal&quot;&gt;Je leert wat conditie is en welke vijf eigenschappen samen je conditie bepalen.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert wat je rusthartslag en maximale hartslag vertellen over je lichaam en getraindheid.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert hoe je lichaam na een training herstelt en sterker kan worden, en waarom voldoende rust belangrijk is.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gegevens leerling&lt;/h2&gt;&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;/div&gt;&lt;p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot; type=&quot;button&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Fit worden en fit blijven&lt;/h2&gt;&lt;p&gt;Als je regelmatig beweegt, kan je conditie verbeteren. Maar een goede conditie betekent meer dan alleen lang kunnen hardlopen: ook kracht, snelheid, lenigheid en coördinatie spelen een rol. In deze paragraaf leer je wat conditie is, wat je hartslag vertelt en waarom je lichaam na een training voldoende rust nodig heeft om sterker te worden.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block0&quot;&gt;&lt;h2&gt;1. Wat betekent conditie?&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Conditie bestaat uit verschillende eigenschappen. Je gebruikt ze bij bewegen en sporten.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Onderdelen van conditie&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMTczIDI0OGg1NWwyNi05MyA0MSAxMTggMzMtNzkgMjcgNTRoNjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMyIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxwYXRoIGQ9Ik0yMDggMTM2bDQwLTM1IDQwIDM1IiBmaWxsPSJub25lIiBzdHJva2U9IiMwODdmOGQiIHN0cm9rZS13aWR0aD0iMTEiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Fit zijn is meer dan lang kunnen hardlopen&lt;/h3&gt;&lt;p&gt;Als je een goede &lt;strong&gt;conditie&lt;/strong&gt; hebt, kun je lichamelijke activiteiten goed uitvoeren. Conditie is niet alleen lang kunnen sporten. Ook kracht, snelheid, lenigheid en het goed uitvoeren van bewegingen zijn belangrijk.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;De vijf grondmotorische eigenschappen: CLUKS&lt;/h3&gt;&lt;p&gt;Deze vijf eigenschappen bepalen samen hoe lichamelijk fit je bent:&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;CLUKS&lt;/strong&gt;&lt;p&gt;&lt;strong&gt;C&lt;/strong&gt; – Coördinatie&lt;br/&gt;&lt;strong&gt;L&lt;/strong&gt; – Lenigheid&lt;br/&gt;&lt;strong&gt;U&lt;/strong&gt; – Uithoudingsvermogen&lt;br/&gt;&lt;strong&gt;K&lt;/strong&gt; – Kracht&lt;br/&gt;&lt;strong&gt;S&lt;/strong&gt; – Snelheid&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;table class=&quot;table23&quot;&gt;&lt;tr&gt;&lt;th&gt;Eigenschap&lt;/th&gt;&lt;th&gt;Wat betekent het?&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Coördinatie&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Spieren en zenuwen werken samen om bewegingen nauwkeurig uit te voeren.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Lenigheid&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Je spieren en gewrichten kunnen goed bewegen en buigen.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Uithoudingsvermogen&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Je kunt een inspanning langere tijd volhouden.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Kracht&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Je spieren kunnen weerstand overwinnen.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Snelheid&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Je kunt een beweging in korte tijd uitvoeren.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Extra aandacht:&lt;/strong&gt; Bij één sport gebruik je vaak meerdere eigenschappen tegelijk. Bij sprinten heb je bijvoorbeeld snelheid én kracht nodig. Bij een opdracht kies je de eigenschap die het beste past.&lt;/div&gt;&lt;h3&gt;Opdrachten&lt;/h3&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q1&quot;&gt;&lt;h3&gt;Opdracht 1. Wat betekent conditie?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Alleen zo lang mogelijk kunnen hardlopen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Hoe lichamelijk fit je bent door vijf eigenschappen samen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Hoeveel spieren je hebt&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Alleen hoe snel je kunt sprinten&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;match&quot; id=&quot;q2&quot;&gt;&lt;h3&gt;Opdracht 2. Welke eigenschap past het beste bij iedere situatie?&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Kies bij elke situatie de juiste betekenis of eigenschap.&lt;/p&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Een sprint van 50 meter&lt;/span&gt;&lt;select data-match=&quot;0&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Coördinatie&lt;/option&gt;&lt;option&gt;Kracht&lt;/option&gt;&lt;option&gt;Lenigheid&lt;/option&gt;&lt;option&gt;Snelheid&lt;/option&gt;&lt;option&gt;Uithoudingsvermogen&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Je veters strikken zonder je knieën te buigen&lt;/span&gt;&lt;select data-match=&quot;1&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Coördinatie&lt;/option&gt;&lt;option&gt;Kracht&lt;/option&gt;&lt;option&gt;Lenigheid&lt;/option&gt;&lt;option&gt;Snelheid&lt;/option&gt;&lt;option&gt;Uithoudingsvermogen&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Een zware tas optillen&lt;/span&gt;&lt;select data-match=&quot;2&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Coördinatie&lt;/option&gt;&lt;option&gt;Kracht&lt;/option&gt;&lt;option&gt;Lenigheid&lt;/option&gt;&lt;option&gt;Snelheid&lt;/option&gt;&lt;option&gt;Uithoudingsvermogen&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Een bal precies naar een medespeler passen&lt;/span&gt;&lt;select data-match=&quot;3&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Coördinatie&lt;/option&gt;&lt;option&gt;Kracht&lt;/option&gt;&lt;option&gt;Lenigheid&lt;/option&gt;&lt;option&gt;Snelheid&lt;/option&gt;&lt;option&gt;Uithoudingsvermogen&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;30 minuten blijven hardlopen&lt;/span&gt;&lt;select data-match=&quot;4&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Coördinatie&lt;/option&gt;&lt;option&gt;Kracht&lt;/option&gt;&lt;option&gt;Lenigheid&lt;/option&gt;&lt;option&gt;Snelheid&lt;/option&gt;&lt;option&gt;Uithoudingsvermogen&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q3&quot;&gt;&lt;h3&gt;Opdracht 3. Welke eigenschap gebruik je vooral wanneer je een bal precies naar iemand passt?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Lenigheid&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Coördinatie&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Uithoudingsvermogen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Kracht&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;open&quot; id=&quot;q4&quot;&gt;&lt;h3&gt;Opdracht 4. Leg uit waarom een sterke sprinter niet automatisch een goed uithoudingsvermogen heeft.&lt;/h3&gt;&lt;textarea aria-label=&quot;Jouw antwoord&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(0)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(0)&quot; type=&quot;button&quot;&gt;Reset opdrachten&lt;/button&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score0&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block1&quot;&gt;&lt;h2&gt;2. Hartslag en conditie&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Je hartslag verandert wanneer je inspanning levert. Dat zegt iets over hoe hard je lichaam werkt.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Hartslag en conditie&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDI3NUMxMzMgMTcyIDE4NCA3NSAyNjYgMTExYzE4IDkgMjkgMjIgMzQgMzYgNS0xNCAxNi0yNyAzNC0zNiA4Mi0zNiAxMzMgNjEtMzQgMTY0WiIgZmlsbD0iI2U0Nzc3MCIvPjxwYXRoIGQ9Ik0xNzAgMjA4aDc1bDIyLTQwIDM3IDg1IDI4LTUzaDEwMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Je hartslag en rusthartslag&lt;/h3&gt;&lt;p&gt;Je &lt;strong&gt;hartslag&lt;/strong&gt; is het aantal keren dat je hart per minuut klopt. Als je ontspannen bent, noemen we dit je &lt;strong&gt;rusthartslag&lt;/strong&gt;. Tijdens het sporten hebben je spieren meer zuurstof nodig. Je hart gaat daarom sneller kloppen en pompt meer bloed naar je spieren.&lt;/p&gt;&lt;p&gt;Een goed getraind hart kan per hartslag meer bloed rondpompen. Daarom hebben goed getrainde mensen &lt;strong&gt;vaak een lagere rusthartslag&lt;/strong&gt;. Je rusthartslag verschilt ook per persoon en wordt door meer dingen beïnvloed dan conditie.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Rusthartslag en conditieniveau&lt;/h3&gt;&lt;p&gt;In de les gebruiken we deze voorbeelden. Het zijn &lt;strong&gt;globale richtwaarden&lt;/strong&gt;, geen test waarmee je zeker kunt bepalen hoe fit iemand is.&lt;/p&gt;&lt;table class=&quot;table23&quot;&gt;&lt;tr&gt;&lt;th&gt;Conditieniveau (voorbeeld)&lt;/th&gt;&lt;th&gt;Rusthartslag&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ongetraind&lt;/td&gt;&lt;td&gt;Ongeveer 70–90 bpm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Gemiddeld getraind&lt;/td&gt;&lt;td&gt;Ongeveer 60–70 bpm&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Zeer fit / topsporter&lt;/td&gt;&lt;td&gt;Ongeveer 40–50 bpm&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Maximale hartslag berekenen&lt;/h3&gt;&lt;p&gt;De &lt;strong&gt;maximale hartslag&lt;/strong&gt; is het hoogste aantal slagen per minuut dat je hart ongeveer kan bereiken bij zeer zware inspanning. Een eenvoudige schatting is:&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;220 − je leeftijd = geschatte maximale hartslag&lt;/strong&gt;&lt;p&gt;Voorbeeld: 15 jaar → 220 − 15 = &lt;strong&gt;205 slagen per minuut&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;bpm&lt;/strong&gt; betekent &lt;em&gt;beats per minute&lt;/em&gt;: slagen per minuut.&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;De formule geeft een schatting. Je werkelijke maximale hartslag kan hiervan afwijken.&lt;/p&gt;&lt;h3&gt;Opdrachten&lt;/h3&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q5&quot;&gt;&lt;h3&gt;Opdracht 5. Sara is 12 jaar. Wat is haar geschatte maximale hartslag?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q5&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; 198 slagen per minuut&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q5&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; 202 slagen per minuut&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q5&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; 208 slagen per minuut&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q5&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; 220 slagen per minuut&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q6&quot;&gt;&lt;h3&gt;Opdracht 6. Waarom hebben goed getrainde mensen vaak een lagere rusthartslag?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Hun hart hoeft geen bloed meer rond te pompen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Hun hart kan per slag meer bloed rondpompen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Hun spieren hebben geen zuurstof nodig&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Hun hart is kleiner geworden&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;fill&quot; id=&quot;q7&quot;&gt;&lt;h3&gt;Opdracht 7. Vul de twee begrippen in: De hartslag wanneer je ontspannen bent heet de ____. Het aantal hartslagen per minuut wordt ook uitgedrukt in ____.&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Typ de ontbrekende begrippen in de juiste volgorde.&lt;/p&gt;&lt;label&gt;Begrip 1: &lt;input autocomplete=&quot;off&quot; data-fill=&quot;0&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;   &lt;label&gt;Begrip 2: &lt;input autocomplete=&quot;off&quot; data-fill=&quot;1&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;   &lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q8&quot;&gt;&lt;h3&gt;Opdracht 8. Milan heeft na een sprint een hogere hartslag. Wat is daarvoor de belangrijkste reden?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q8&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; De spieren hebben tijdens inspanning meer zuurstof nodig&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q8&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Het hart stopt even met pompen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q8&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; De spieren gebruiken geen voedingsstoffen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q8&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Het bloed stroomt langzamer&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;open&quot; id=&quot;q9&quot;&gt;&lt;h3&gt;Opdracht 9. Bereken de geschatte maximale hartslag van iemand van 14 jaar. Schrijf de berekening op.&lt;/h3&gt;&lt;textarea aria-label=&quot;Jouw antwoord&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(1)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(1)&quot; type=&quot;button&quot;&gt;Reset opdrachten&lt;/button&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block2&quot;&gt;&lt;h2&gt;3. Trainen en herstellen&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Tijdens training belast je je spieren. Herstel en rust zijn nodig om vooruitgang te boeken.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Trainen en herstellen&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjAwIDIxOGExMDUgMTA1IDAgMSAxIDQ0IDY4IiBmaWxsPSJub25lIiBzdHJva2U9IiMwODdmOGQiIHN0cm9rZS13aWR0aD0iMTgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0yMDEgMjc3bC04LTYxIDU5IDEyIiBmaWxsPSJub25lIiBzdHJva2U9IiMwODdmOGQiIHN0cm9rZS13aWR0aD0iMTUiLz48cGF0aCBkPSJNMzAwIDEzOXY3Nmw1MSAyOCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjEyIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Wat gebeurt er tijdens een training?&lt;/h3&gt;&lt;p&gt;Een zware training geeft je lichaam een &lt;strong&gt;trainingsprikkel&lt;/strong&gt;. Door de belasting kunnen kleine beschadigingen in je &lt;strong&gt;spiervezels&lt;/strong&gt; ontstaan. Dit heet &lt;strong&gt;micro-spierschade&lt;/strong&gt;.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Waarom is herstel belangrijk?&lt;/h3&gt;&lt;p&gt;Na de training heeft je lichaam &lt;strong&gt;hersteltijd&lt;/strong&gt; nodig. &lt;strong&gt;Rust, slaap en gezonde voeding&lt;/strong&gt; helpen daarbij. Je lichaam herstelt van de belasting en kan zich aanpassen, zodat het beter voorbereid is op een volgende training.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Supercompensatie&lt;/h3&gt;&lt;p&gt;Na een training ben je tijdelijk vermoeid. Bij voldoende herstel kan je lichaam zich aanpassen en tijdelijk &lt;strong&gt;boven het oude prestatieniveau&lt;/strong&gt; uitkomen. Dit noemen we &lt;strong&gt;supercompensatie&lt;/strong&gt;.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Onthoud de volgorde:&lt;/strong&gt;&lt;p&gt;Trainingsprikkel → vermoeidheid / kleine spierschade → herstel → supercompensatie → beter voorbereid op een volgende training.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Extra aandacht:&lt;/strong&gt; Supercompensatie gebeurt niet automatisch na iedere training. De belasting en de hersteltijd moeten bij elkaar passen.&lt;/p&gt;&lt;h3&gt;Opdrachten&lt;/h3&gt;&lt;div class=&quot;question&quot; data-kind=&quot;order&quot; id=&quot;q10&quot;&gt;&lt;h3&gt;Opdracht 10. Zet de stappen van trainen en herstellen in de juiste volgorde.&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Gebruik de pijlen om de stappen onder elkaar in de juiste volgorde te zetten.&lt;/p&gt;&lt;div class=&quot;steps&quot;&gt;&lt;div class=&quot;step&quot; data-step=&quot;0&quot;&gt;&lt;span&gt;Supercompensatie&lt;/span&gt;&lt;button aria-label=&quot;Omhoog&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;1&quot;&gt;&lt;span&gt;Trainingsprikkel&lt;/span&gt;&lt;button aria-label=&quot;Omhoog&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;2&quot;&gt;&lt;span&gt;Herstel&lt;/span&gt;&lt;button aria-label=&quot;Omhoog&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;3&quot;&gt;&lt;span&gt;Je lichaam kan een volgende training beter aan&lt;/span&gt;&lt;button aria-label=&quot;Omhoog&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-step=&quot;4&quot;&gt;&lt;span&gt;Vermoeidheid / kleine spierschade&lt;/span&gt;&lt;button aria-label=&quot;Omhoog&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,-1)&quot; type=&quot;button&quot;&gt;↑&lt;/button&gt;&lt;button aria-label=&quot;Omlaag&quot; class=&quot;secondary&quot; onclick=&quot;moveStep(this,1)&quot; type=&quot;button&quot;&gt;↓&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q11&quot;&gt;&lt;h3&gt;Opdracht 11. Wat betekent supercompensatie?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Je wordt tijdens de training meteen sterker&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Na voldoende herstel kan je prestatieniveau tijdelijk boven het oude niveau uitkomen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Je hebt na elke training helemaal geen rust meer nodig&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Je hartslag blijft altijd maximaal&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;match&quot; id=&quot;q12&quot;&gt;&lt;h3&gt;Opdracht 12. Wat hoort bij trainen en herstellen?&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Kies bij elke situatie de juiste betekenis of eigenschap.&lt;/p&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Trainingsprikkel&lt;/span&gt;&lt;select data-match=&quot;0&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Belasting tijdens een training&lt;/option&gt;&lt;option&gt;Kleine beschadigingen in spiervezels&lt;/option&gt;&lt;option&gt;Tijd die je lichaam nodig heeft om te herstellen&lt;/option&gt;&lt;option&gt;Tijdelijk beter voorbereid na voldoende herstel&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Micro-spierschade&lt;/span&gt;&lt;select data-match=&quot;1&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Belasting tijdens een training&lt;/option&gt;&lt;option&gt;Kleine beschadigingen in spiervezels&lt;/option&gt;&lt;option&gt;Tijd die je lichaam nodig heeft om te herstellen&lt;/option&gt;&lt;option&gt;Tijdelijk beter voorbereid na voldoende herstel&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Hersteltijd&lt;/span&gt;&lt;select data-match=&quot;2&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Belasting tijdens een training&lt;/option&gt;&lt;option&gt;Kleine beschadigingen in spiervezels&lt;/option&gt;&lt;option&gt;Tijd die je lichaam nodig heeft om te herstellen&lt;/option&gt;&lt;option&gt;Tijdelijk beter voorbereid na voldoende herstel&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Supercompensatie&lt;/span&gt;&lt;select data-match=&quot;3&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Belasting tijdens een training&lt;/option&gt;&lt;option&gt;Kleine beschadigingen in spiervezels&lt;/option&gt;&lt;option&gt;Tijd die je lichaam nodig heeft om te herstellen&lt;/option&gt;&lt;option&gt;Tijdelijk beter voorbereid na voldoende herstel&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;open&quot; id=&quot;q13&quot;&gt;&lt;h3&gt;Opdracht 13. Noem twee dingen die je lichaam helpen herstellen na een zware training.&lt;/h3&gt;&lt;textarea aria-label=&quot;Jouw antwoord&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(2)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(2)&quot; type=&quot;button&quot;&gt;Reset opdrachten&lt;/button&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block3&quot;&gt;&lt;h2&gt;4. De juiste balans vinden&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Een goede balans tussen inspanning en herstel helpt je om fit te blijven.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Balans tussen sport en rust&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDExMXYxNjNNMjAzIDI3NWgxOTRNMjA1IDE1N2gxOTAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0iTTIzNSAxNTdsLTUzIDkxaDEwNlpNMzY1IDE1N2wtNTMgOTFoMTA2WiIgZmlsbD0iIzdlY2FkMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjciLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIxMTEiIHI9IjE2IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Te weinig rust&lt;/h3&gt;&lt;p&gt;Meer trainen betekent niet automatisch dat je fitter wordt. Als je steeds zwaar traint zonder voldoende herstel, kan je lichaam overbelast raken. Dit kan leiden tot &lt;strong&gt;vermoeidheid&lt;/strong&gt;, &lt;strong&gt;slechtere prestaties&lt;/strong&gt;, &lt;strong&gt;meer kans op blessures&lt;/strong&gt; en uiteindelijk &lt;strong&gt;overtraining&lt;/strong&gt;.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Trainen én herstellen&lt;/h3&gt;&lt;p&gt;Voor het opbouwen van conditie heb je zowel &lt;strong&gt;training&lt;/strong&gt; als &lt;strong&gt;herstel&lt;/strong&gt; nodig. Let op signalen zoals aanhoudende vermoeidheid en toenemende spierpijn. Plan voldoende rust tussen zware trainingen en zorg voor slaap en gezonde voeding.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Extra aandacht:&lt;/strong&gt; Je hoeft niet elke dag zwaar te trainen om vooruit te gaan. Een goede balans tussen inspanning en herstel helpt je om fit te worden én fit te blijven.&lt;/div&gt;&lt;h3&gt;Opdrachten&lt;/h3&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q14&quot;&gt;&lt;h3&gt;Opdracht 14. Luca traint zeven dagen per week zwaar. Hij heeft steeds meer spierpijn en presteert slechter. Wat kan hij het beste doen?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Nog zwaarder trainen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Twee keer per dag trainen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Voldoende rust en hersteltijd nemen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Alleen zijn maximale hartslag trainen&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;mc&quot; id=&quot;q15&quot;&gt;&lt;h3&gt;Opdracht 15. Waar word je volgens de theorie fitter van?&lt;/h3&gt;&lt;div class=&quot;qopts&quot;&gt;&lt;label&gt;&lt;input name=&quot;q15&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Vooral veel trainen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q15&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Vooral veel rusten&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q15&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; De juiste balans tussen trainen en herstellen&lt;/label&gt;&lt;label&gt;&lt;input name=&quot;q15&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Alleen gezond eten&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;match&quot; id=&quot;q16&quot;&gt;&lt;h3&gt;Opdracht 16. Welke situatie hoort bij welk begrip?&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Kies bij elke situatie de juiste betekenis of eigenschap.&lt;/p&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Je bent steeds moe en je prestaties worden slechter door langdurig te zwaar trainen&lt;/span&gt;&lt;select data-match=&quot;0&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Herstel&lt;/option&gt;&lt;option&gt;Overbelasting&lt;/option&gt;&lt;option&gt;Overtraining&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Je belast je lichaam zwaarder dan het kan herstellen&lt;/span&gt;&lt;select data-match=&quot;1&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Herstel&lt;/option&gt;&lt;option&gt;Overbelasting&lt;/option&gt;&lt;option&gt;Overtraining&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;qrow&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;Je lichaam is na inspanning weer aan het herstellen&lt;/span&gt;&lt;select data-match=&quot;2&quot;&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Herstel&lt;/option&gt;&lt;option&gt;Overbelasting&lt;/option&gt;&lt;option&gt;Overtraining&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-kind=&quot;open&quot; id=&quot;q17&quot;&gt;&lt;h3&gt;Opdracht 17. Milan wil vijf dagen achter elkaar zwaar sporten. Geef twee adviezen om blessures en overbelasting te voorkomen.&lt;/h3&gt;&lt;textarea aria-label=&quot;Jouw antwoord&quot; placeholder=&quot;Schrijf hier je antwoord...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;feedback&quot; hidden=&quot;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;button onclick=&quot;checkBlock(3)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(3)&quot; type=&quot;button&quot;&gt;Reset opdrachten&lt;/button&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score3&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Samenvatting&lt;/h2&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Conditie en CLUKS&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Conditie&lt;/strong&gt; betekent hoe lichamelijk fit je bent. De vijf &lt;strong&gt;grondmotorische eigenschappen&lt;/strong&gt; zijn &lt;strong&gt;coördinatie&lt;/strong&gt; (nauwkeurig bewegen), &lt;strong&gt;lenigheid&lt;/strong&gt; (soepel bewegen), &lt;strong&gt;uithoudingsvermogen&lt;/strong&gt; (lang volhouden), &lt;strong&gt;kracht&lt;/strong&gt; (weerstand overwinnen) en &lt;strong&gt;snelheid&lt;/strong&gt; (snel bewegen). Samen heten ze &lt;strong&gt;CLUKS&lt;/strong&gt;. Je gebruikt vaak meerdere eigenschappen tijdens één sport.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Hartslag en conditie&lt;/h3&gt;&lt;p&gt;Je &lt;strong&gt;hartslag&lt;/strong&gt; is het aantal hartslagen per minuut. In rust heet dit de &lt;strong&gt;rusthartslag&lt;/strong&gt;. Tijdens inspanning hebben je spieren meer zuurstof nodig en gaat je hart sneller kloppen. Een getraind hart pompt vaak meer bloed per slag. Daardoor hebben getrainde mensen vaak een lagere rusthartslag.&lt;/p&gt;&lt;p&gt;Een eenvoudige schatting van je &lt;strong&gt;maximale hartslag&lt;/strong&gt; is &lt;strong&gt;220 − leeftijd&lt;/strong&gt;. Voor iemand van 12 jaar is dat ongeveer &lt;strong&gt;208 bpm&lt;/strong&gt;. Bpm betekent slagen per minuut. De uitkomst is een schatting, geen exact getal.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Trainen en herstellen&lt;/h3&gt;&lt;p&gt;Een zware training geeft een &lt;strong&gt;trainingsprikkel&lt;/strong&gt;. Er kan &lt;strong&gt;micro-spierschade&lt;/strong&gt; ontstaan: kleine beschadigingen in de spiervezels. Tijdens de &lt;strong&gt;hersteltijd&lt;/strong&gt; helpt rust, slaap en gezonde voeding je lichaam herstellen. Bij voldoende herstel kan &lt;strong&gt;supercompensatie&lt;/strong&gt; optreden: je lichaam is tijdelijk beter voorbereid op een volgende training.&lt;/p&gt;&lt;p&gt;De volgorde is: &lt;strong&gt;trainingsprikkel → vermoeidheid / micro-spierschade → herstel → supercompensatie → beter voorbereid op een volgende training&lt;/strong&gt;.&lt;/p&gt;&lt;h3 class=&quot;theory-subheading&quot;&gt;Te weinig rust&lt;/h3&gt;&lt;p&gt;Als je steeds zwaar traint zonder voldoende herstel, kun je &lt;strong&gt;overbelast&lt;/strong&gt; raken. Je kunt vermoeid worden, slechter presteren en meer kans krijgen op blessures. Bij langdurige problemen kan &lt;strong&gt;overtraining&lt;/strong&gt; ontstaan. Om fitter te worden, heb je dus &lt;strong&gt;een goede balans tussen trainen en herstellen&lt;/strong&gt; nodig.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Conditie&lt;/summary&gt;&lt;p&gt;De mate waarin je lichamelijk fit bent.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Grondmotorische eigenschappen&lt;/summary&gt;&lt;p&gt;De vijf eigenschappen die samen CLUKS vormen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Coördinatie&lt;/summary&gt;&lt;p&gt;Je spieren en zenuwen werken goed samen om nauwkeurig te bewegen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Lenigheid&lt;/summary&gt;&lt;p&gt;Je spieren en gewrichten kunnen soepel bewegen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Uithoudingsvermogen&lt;/summary&gt;&lt;p&gt;Je kunt een inspanning langere tijd volhouden.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Kracht&lt;/summary&gt;&lt;p&gt;Je spieren kunnen weerstand overwinnen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Snelheid&lt;/summary&gt;&lt;p&gt;Je kunt een beweging snel uitvoeren.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Rusthartslag&lt;/summary&gt;&lt;p&gt;Het aantal hartslagen per minuut wanneer je ontspannen bent.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Maximale hartslag&lt;/summary&gt;&lt;p&gt;Het hoogste aantal hartslagen dat je hart ongeveer kan bereiken bij zeer zware inspanning.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Hart- en vaatstelsel&lt;/summary&gt;&lt;p&gt;Het hart en de bloedvaten die voor de bloedsomloop zorgen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Trainingsprikkel&lt;/summary&gt;&lt;p&gt;De belasting van je lichaam tijdens een training.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Micro-spierschade&lt;/summary&gt;&lt;p&gt;Kleine beschadigingen in spiervezels door zware belasting.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Spiervezels&lt;/summary&gt;&lt;p&gt;De cellen waaruit spieren zijn opgebouwd.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Hersteltijd&lt;/summary&gt;&lt;p&gt;De tijd die je lichaam nodig heeft om te herstellen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Supercompensatie&lt;/summary&gt;&lt;p&gt;Het proces waarbij je lichaam na training en voldoende herstel tijdelijk beter voorbereid is op een volgende inspanning.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Overbelasting&lt;/summary&gt;&lt;p&gt;Je lichaam zwaarder belasten dan het voldoende kan herstellen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Overtraining&lt;/summary&gt;&lt;p&gt;Langdurige vermoeidheid en slechtere prestaties door te weinig herstel.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Prestatieniveau&lt;/summary&gt;&lt;p&gt;Het niveau waarop je lichamelijk kunt presteren.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Exit-ticket&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Wat heb je vandaag geleerd?&lt;/strong&gt;&lt;/p&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Ik kan CLUKS uitleggen&quot;/&gt; Ik kan CLUKS uitleggen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Ik begrijp hartslag en conditie&quot;/&gt; Ik begrijp hartslag en conditie.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Ik begrijp trainen en herstellen&quot;/&gt; Ik begrijp trainen en herstellen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Ik wil nog extra oefenen&quot;/&gt; Ik wil nog extra oefenen.&lt;/label&gt;&lt;p&gt;&lt;strong&gt;Wat wil je nog oefenen of vragen?&lt;/strong&gt;&lt;/p&gt;&lt;textarea id=&quot;exitText&quot; placeholder=&quot;Schrijf hier je vraag of leerpunt...&quot;&gt;&lt;/textarea&gt;&lt;/section&gt;&lt;/main&gt;&lt;/div&gt;&lt;script&gt;const Q=[{&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Alleen zo lang mogelijk kunnen hardlopen&quot;, &quot;Hoe lichamelijk fit je bent door vijf eigenschappen samen&quot;, &quot;Hoeveel spieren je hebt&quot;, &quot;Alleen hoe snel je kunt sprinten&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Conditie bestaat uit coördinatie, lenigheid, uithoudingsvermogen, kracht en snelheid.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;match&quot;, &quot;options&quot;: [[&quot;Een sprint van 50 meter&quot;, &quot;Snelheid&quot;], [&quot;Je veters strikken zonder je knieën te buigen&quot;, &quot;Lenigheid&quot;], [&quot;Een zware tas optillen&quot;, &quot;Kracht&quot;], [&quot;Een bal precies naar een medespeler passen&quot;, &quot;Coördinatie&quot;], [&quot;30 minuten blijven hardlopen&quot;, &quot;Uithoudingsvermogen&quot;]], &quot;answer&quot;: null, &quot;explain&quot;: &quot;Een sprint vraagt snelheid; soepel buigen vraagt lenigheid; tillen vraagt kracht; precies passen vraagt coördinatie; lang hardlopen vraagt uithoudingsvermogen.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Lenigheid&quot;, &quot;Coördinatie&quot;, &quot;Uithoudingsvermogen&quot;, &quot;Kracht&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Coördinatie betekent dat spieren en zenuwen goed samenwerken voor een nauwkeurige beweging.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;open&quot;, &quot;options&quot;: null, &quot;answer&quot;: null, &quot;explain&quot;: &quot;Een sprinter kan veel snelheid en kracht hebben, maar misschien geen inspanning lange tijd volhouden. De eigenschappen van CLUKS zijn verschillend.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;198 slagen per minuut&quot;, &quot;202 slagen per minuut&quot;, &quot;208 slagen per minuut&quot;, &quot;220 slagen per minuut&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;220 − 12 = 208 slagen per minuut. Het is een schatting.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Hun hart hoeft geen bloed meer rond te pompen&quot;, &quot;Hun hart kan per slag meer bloed rondpompen&quot;, &quot;Hun spieren hebben geen zuurstof nodig&quot;, &quot;Hun hart is kleiner geworden&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Een getraind hart pompt per slag vaak meer bloed. Daardoor zijn in rust meestal minder hartslagen nodig.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;fill&quot;, &quot;options&quot;: [&quot;rusthartslag&quot;, &quot;bpm&quot;], &quot;answer&quot;: null, &quot;explain&quot;: &quot;Rusthartslag = hartslag in rust. bpm = beats per minute, slagen per minuut.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;De spieren hebben tijdens inspanning meer zuurstof nodig&quot;, &quot;Het hart stopt even met pompen&quot;, &quot;De spieren gebruiken geen voedingsstoffen&quot;, &quot;Het bloed stroomt langzamer&quot;], &quot;answer&quot;: 0, &quot;explain&quot;: &quot;Tijdens het sporten hebben spieren meer zuurstof nodig. Het hart pompt daarom sneller bloed rond.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;open&quot;, &quot;options&quot;: null, &quot;answer&quot;: null, &quot;explain&quot;: &quot;220 − 14 = 206 slagen per minuut.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;order&quot;, &quot;options&quot;: [&quot;Supercompensatie&quot;, &quot;Trainingsprikkel&quot;, &quot;Herstel&quot;, &quot;Je lichaam kan een volgende training beter aan&quot;, &quot;Vermoeidheid / kleine spierschade&quot;], &quot;answer&quot;: [1, 4, 2, 0, 3], &quot;explain&quot;: &quot;Eerst komt de trainingsprikkel, daarna vermoeidheid of kleine spierschade, vervolgens herstel, supercompensatie en een betere voorbereiding op de volgende training.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Je wordt tijdens de training meteen sterker&quot;, &quot;Na voldoende herstel kan je prestatieniveau tijdelijk boven het oude niveau uitkomen&quot;, &quot;Je hebt na elke training helemaal geen rust meer nodig&quot;, &quot;Je hartslag blijft altijd maximaal&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Bij voldoende herstel kan het lichaam zich aanpassen en tijdelijk beter voorbereid zijn op een volgende inspanning.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;match&quot;, &quot;options&quot;: [[&quot;Trainingsprikkel&quot;, &quot;Belasting tijdens een training&quot;], [&quot;Micro-spierschade&quot;, &quot;Kleine beschadigingen in spiervezels&quot;], [&quot;Hersteltijd&quot;, &quot;Tijd die je lichaam nodig heeft om te herstellen&quot;], [&quot;Supercompensatie&quot;, &quot;Tijdelijk beter voorbereid na voldoende herstel&quot;]], &quot;answer&quot;: null, &quot;explain&quot;: &quot;Trainingsprikkel is belasting; micro-spierschade zijn kleine beschadigingen; hersteltijd is tijd voor herstel; supercompensatie is een tijdelijke verbetering na herstel.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;open&quot;, &quot;options&quot;: null, &quot;answer&quot;: null, &quot;explain&quot;: &quot;Bijvoorbeeld voldoende rust, slaap en gezonde voeding. Twee van deze voorbeelden zijn goed.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Nog zwaarder trainen&quot;, &quot;Twee keer per dag trainen&quot;, &quot;Voldoende rust en hersteltijd nemen&quot;, &quot;Alleen zijn maximale hartslag trainen&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Luca heeft signalen van onvoldoende herstel. Rust en hersteltijd zijn nodig om overbelasting te voorkomen.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;mc&quot;, &quot;options&quot;: [&quot;Vooral veel trainen&quot;, &quot;Vooral veel rusten&quot;, &quot;De juiste balans tussen trainen en herstellen&quot;, &quot;Alleen gezond eten&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Training geeft een prikkel, maar je lichaam heeft ook herstel nodig om vooruit te gaan.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;match&quot;, &quot;options&quot;: [[&quot;Je bent steeds moe en je prestaties worden slechter door langdurig te zwaar trainen&quot;, &quot;Overtraining&quot;], [&quot;Je belast je lichaam zwaarder dan het kan herstellen&quot;, &quot;Overbelasting&quot;], [&quot;Je lichaam is na inspanning weer aan het herstellen&quot;, &quot;Herstel&quot;]], &quot;answer&quot;: null, &quot;explain&quot;: &quot;Overbelasting betekent meer belasting dan herstel; overtraining is langdurige vermoeidheid en slechtere prestaties; herstel is het opnieuw opbouwen na inspanning.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;open&quot;, &quot;options&quot;: null, &quot;answer&quot;: null, &quot;explain&quot;: &quot;Bijvoorbeeld rustdagen inplannen, voldoende slapen, gezond eten, afwisselen met lichtere training en luisteren naar signalen van vermoeidheid.&quot;}];

function norm(s){return String(s||'').trim().toLocaleLowerCase('nl').replace(/\s+/g,' ')}
function moveStep(btn,dir){const row=btn.closest('.step'),list=row.parentElement,target=dir&lt;0?row.previousElementSibling:row.nextElementSibling;if(!target)return;if(dir&lt;0)list.insertBefore(row,target);else list.insertBefore(target,row);save()}
function answers(n){const el=document.getElementById('q'+(n+1)),q=Q[n];if(q.kind==='mc')return el.querySelector('input:checked')?.value??'';if(q.kind==='match')return [...el.querySelectorAll('select')].map(x=&gt;x.value);if(q.kind==='fill')return [...el.querySelectorAll('input')].map(x=&gt;x.value);if(q.kind==='order')return [...el.querySelectorAll('.step')].map(x=&gt;Number(x.dataset.step));return el.querySelector('textarea')?.value||''}
function evaluate(q,a){if(q.kind==='mc')return {ok:a!==''&amp;&amp;Number(a)===q.answer,empty:a==='',correct:q.options[q.answer]};if(q.kind==='match'){let ok=a.length===q.options.length&amp;&amp;a.every((v,i)=&gt;norm(v)===norm(q.options[i][1]));return{ok,empty:a.some(x=&gt;!x),correct:q.options.map(x=&gt;x[0]+' → '+x[1]).join('\n')}}if(q.kind==='fill'){let ok=a.length===q.options.length&amp;&amp;a.every((v,i)=&gt;norm(v)===norm(q.options[i]));return{ok,empty:a.some(x=&gt;!x.trim()),correct:q.options.join(' / ')}}if(q.kind==='order'){let ok=JSON.stringify(a)===JSON.stringify(q.answer);return{ok,empty:false,correct:q.answer.map((v,i)=&gt;(i+1)+'. '+q.options[v]).join('\n')}}return {ok:null,empty:!a.trim(),correct:q.explain}}
function checkBlock(b){let total=0,correct=0,open=0;Q.forEach((q,i)=&gt;{if(q.block!==b)return;total++;const a=answers(i),res=evaluate(q,a),f=document.querySelector('#q'+(i+1)+' .feedback');f.hidden=false;if(q.kind==='open'){open++;f.className='feedback info';f.textContent=a.trim()?'Voorbeeld van een goed antwoord: '+q.explain+'\nVergelijk jouw antwoord hiermee. De docent kan je antwoord nakijken.':'Vul eerst je eigen antwoord in. Voorbeeld: '+q.explain;return}if(res.ok){correct++;f.className='feedback good';f.textContent='Goed! '+q.explain}else{f.className='feedback bad';f.textContent=(res.empty?'Nog niet ingevuld. ':'Dit antwoord is niet juist. ')+'Juiste antwoord:\n'+res.correct+'\nUitleg: '+q.explain}});document.getElementById('score'+b).textContent='Automatisch nagekeken: '+correct+' van '+(total-open)+' goed. '+(open?'Open vragen controleer je met het voorbeeldantwoord.':'');save();notifyHeight()}
function resetBlock(b){Q.forEach((q,i)=&gt;{if(q.block!==b)return;const el=document.getElementById('q'+(i+1));el.querySelectorAll('input[type=radio]').forEach(x=&gt;x.checked=false);el.querySelectorAll('input[type=text],textarea').forEach(x=&gt;x.value='');el.querySelectorAll('select').forEach(x=&gt;x.value='');if(q.kind==='order'){const list=el.querySelector('.steps');[...list.children].sort((a,b)=&gt;Number(a.dataset.step)-Number(b.dataset.step)).forEach(x=&gt;list.append(x))}el.querySelector('.feedback').hidden=true});document.getElementById('score'+b).textContent='';save();notifyHeight()}
function save(){let data={name:document.getElementById('studentName').value,klass:document.getElementById('studentClass').value,answers:Q.map((_,i)=&gt;answers(i)),exit:document.querySelector('input[name=exit]:checked')?.value||'',exitText:document.getElementById('exitText').value};try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveStatus').textContent='✓ Antwoorden automatisch opgeslagen'}catch(e){document.getElementById('saveStatus').textContent='Opslaan niet beschikbaar in deze browser'}}
function restore(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;document.getElementById('studentName').value=d.name||'';document.getElementById('studentClass').value=d.klass||'';Q.forEach((q,i)=&gt;{let a=d.answers?.[i],el=document.getElementById('q'+(i+1));if(a==null)return;if(q.kind==='mc'){const r=el.querySelector('input[value=&quot;'+a+'&quot;]');if(r)r.checked=true}else if(q.kind==='match'){el.querySelectorAll('select').forEach((x,j)=&gt;x.value=a[j]||'')}else if(q.kind==='fill'){el.querySelectorAll('input').forEach((x,j)=&gt;x.value=a[j]||'')}else if(q.kind==='order'&amp;&amp;Array.isArray(a)){const list=el.querySelector('.steps');a.forEach(v=&gt;{const x=list.querySelector('[data-step=&quot;'+v+'&quot;]');if(x)list.append(x)})}else if(q.kind==='open')el.querySelector('textarea').value=a});if(d.exit){const r=[...document.querySelectorAll('input[name=exit]')].find(x=&gt;x.value===d.exit);if(r)r.checked=true}document.getElementById('exitText').value=d.exitText||'';document.getElementById('saveStatus').textContent='✓ Opgeslagen antwoorden hersteld'}catch(e){}}
function clearSavedWork(){if(!confirm('Weet je zeker dat je alle opgeslagen antwoorden van paragraaf 2.3 wilt wissen?'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function notifyHeight(){let h=Math.ceil((document.querySelector('main.wrap')||document.body).getBoundingClientRect().bottom+window.scrollY+12);parent.postMessage({kind:'worksheetHeight',height:h},'*')}

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.4 Eten, drinken en slapen voor sport&lt;/h1&gt;&lt;div class=&quot;small&quot; id=&quot;saveStatus&quot;&gt;Antwoorden worden automatisch opgeslagen&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;&lt;div class=&quot;goal&quot;&gt;Je leert welke rol koolhydraten, eiwitten en vetten spelen bij sporten.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert waarom voldoende water belangrijk is en waarom energiedrank geen goede sportdrank is.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert waarom slaap belangrijk is voor spierherstel en sportprestaties.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gegevens leerling&lt;/h2&gt;&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;/div&gt;&lt;p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot; type=&quot;button&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gezond eten, drinken en slapen&lt;/h2&gt;&lt;p&gt;Om goed te kunnen sporten heeft je lichaam meer nodig dan alleen training. Voeding levert energie en helpt je spieren herstellen. Tijdens het bewegen verlies je vocht door te zweten, en tijdens je slaap krijgt je lichaam tijd om te herstellen. In deze paragraaf ontdek je welke voedingsstoffen belangrijk zijn, waarom water drinken nodig is en hoe slaap je sportprestaties beïnvloedt.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block0&quot;&gt;&lt;h2&gt;1. Voeding en sporten&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Wat je eet, levert energie en bouwstoffen voor je lichaam.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Voeding en sporten&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjAwIDE4NXEwIDEwNSAxMDAgMTA1dDEwMC0xMDVaIiBmaWxsPSIjZmZmIiBzdHJva2U9IiMwNzViNjUiIHN0cm9rZS13aWR0aD0iMTEiLz48cGF0aCBkPSJNMTg0IDE4MWgyMzIiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMSIvPjxjaXJjbGUgY3g9IjI1NyIgY3k9IjE2MCIgcj0iMzYiIGZpbGw9IiNlNDc3NzAiLz48Y2lyY2xlIGN4PSIzMzEiIGN5PSIxNDUiIHI9IjM2IiBmaWxsPSIjZjBjOTZiIi8+PHBhdGggZD0iTTI5MCAxMTVxMjUtMjkgNDgtMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzA4N2Y4ZCIgc3Ryb2tlLXdpZHRoPSIxMCIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;
&lt;div class=&quot;note&quot;&gt;&lt;h3&gt;Wat zijn brandstoffen, bouwstoffen en reservestoffen?&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Brandstoffen&lt;/strong&gt; geven je lichaam energie om te bewegen en warm te blijven. &lt;strong&gt;Bouwstoffen&lt;/strong&gt; helpen bij de groei, opbouw en het herstel van je lichaam. &lt;strong&gt;Reservestoffen&lt;/strong&gt; zijn voedingsstoffen die je lichaam opslaat om later te gebruiken. &lt;strong&gt;Beschermende stoffen&lt;/strong&gt; helpen je lichaam goed te blijven werken, bijvoorbeeld vitamines en mineralen.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Koolhydraten&lt;/strong&gt; zijn vooral brandstoffen. &lt;strong&gt;Eiwitten&lt;/strong&gt; zijn vooral bouwstoffen. &lt;strong&gt;Vetten&lt;/strong&gt; leveren energie, kunnen worden opgeslagen als reserve en hebben ook beschermende functies.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Koolhydraten: brandstof&lt;/h3&gt;&lt;p&gt;Je lichaam heeft &lt;strong&gt;koolhydraten&lt;/strong&gt; nodig als belangrijke bron van energie voor je spieren en hersenen. Ze zitten bijvoorbeeld in volkorenbrood, volkoren pasta, zilvervliesrijst, havermout, aardappelen en fruit. Voor het sporten kunnen koolhydraten helpen om genoeg energie te hebben.&lt;/p&gt;
&lt;h3&gt;Eiwitten: bouwstoffen&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Eiwitten&lt;/strong&gt; helpen bij het onderhoud, de opbouw en het herstel van spieren. Je vindt ze bijvoorbeeld in kwark, yoghurt, eieren, kip, vis en peulvruchten.&lt;/p&gt;
&lt;h3&gt;Vetten: energie en reserve&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Vetten&lt;/strong&gt; leveren energie, kunnen als reserve worden opgeslagen en hebben andere belangrijke functies. Vet wordt langzamer verteerd. Een erg vette maaltijd vlak voor het sporten kan zwaar op je maag liggen. Noten bevatten zowel vetten als eiwitten. &lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Onthoud:&lt;/strong&gt; koolhydraten = vooral brandstof · eiwitten = vooral bouwstof · vetten = energie, reserve en bescherming. Deze drie voedingsstoffen heten &lt;strong&gt;macronutriënten&lt;/strong&gt;.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q1&quot;&gt;&lt;strong&gt;Opdracht 1. Welke voedingsstof hoort bij welk product?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Banaan&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Noten&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Volkoren pasta&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Kwark&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Kip&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Olie&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Koolhydraten&lt;/option&gt;&lt;option&gt;Eiwitten&lt;/option&gt;&lt;option&gt;Vetten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q2&quot;&gt;&lt;strong&gt;Opdracht 2. Welke voedingsstof is vooral belangrijk als brandstof tijdens het sporten?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q2&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Koolhydraten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q2&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Eiwitten&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q2&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Vitaminen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q2&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Mineralen&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q3&quot;&gt;&lt;strong&gt;Opdracht 3. Finn heeft over twee uur voetbaltraining. Welke maaltijd past het beste?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Een grote portie friet met snacks&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Volkoren pasta met een lichte saus&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Alleen een zak chips&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Helemaal niets eten&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q4&quot;&gt;&lt;strong&gt;Opdracht 4. Vul de juiste woorden in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Koolhydraten zijn vooral een ________.&lt;input aria-label=&quot;Antwoord 1&quot; placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Eiwitten zijn vooral een ________.&lt;input aria-label=&quot;Antwoord 2&quot; placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Vetten kunnen worden opgeslagen als ________.&lt;input aria-label=&quot;Antwoord 3&quot; placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback4&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q5&quot;&gt;&lt;strong&gt;Opdracht 5. Waarom is een grote, erg vette maaltijd vlak voor een training minder handig?&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Bij open vragen vergelijk je jouw antwoord met de voorbeelduitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(0)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(0)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score0&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block1&quot;&gt;&lt;h2&gt;2. Voldoende drinken&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Tijdens het sporten verlies je vocht door te zweten. Voldoende drinken helpt dit verlies aan te vullen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Voldoende drinken&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMzAwIDkwYy0zMyA2My05OSAxMTgtOTkgMTY5YTk5IDk5IDAgMCAwIDE5OCAwYzAtNTEtNjYtMTA2LTk5LTE2OVoiIGZpbGw9IiM3ZWNhZDAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMCIvPjxwYXRoIGQ9Ik0yNTAgMjU5cTAgNDkgNDggNTIiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxMyIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;
&lt;h3&gt;Waarom verlies je vocht?&lt;/h3&gt;&lt;p&gt;Tijdens het sporten maken je spieren warmte. Om af te koelen gaat je lichaam &lt;strong&gt;zweten&lt;/strong&gt;. Daardoor verlies je vocht. Als je meer vocht verliest dan je binnenkrijgt, kun je &lt;strong&gt;uitdrogen (dehydratatie)&lt;/strong&gt;. Je kunt dorst, hoofdpijn of duizeligheid krijgen en minder goed presteren.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Hydratatie&lt;/strong&gt; betekent dat je lichaam voldoende vocht heeft. Je zorgt voor een goede hydratatie door genoeg te drinken. &lt;strong&gt;Dehydratatie&lt;/strong&gt; betekent juist dat je te weinig vocht hebt: uitdroging.&lt;/p&gt;
&lt;h3&gt;Water of energiedrank?&lt;/h3&gt;&lt;p&gt;Voor de meeste gewone sportactiviteiten is &lt;strong&gt;water&lt;/strong&gt; een goede keuze. &lt;strong&gt;Energiedrank&lt;/strong&gt; is niet hetzelfde als sportdrank. Energiedrank bevat meestal veel cafeïne en vaak veel suiker. Cafeïne kan zorgen voor een hogere hartslag, onrust, trillen en slechter slapen. Veel suiker is ook ongunstig voor je tanden.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Belangrijk:&lt;/strong&gt; vul verloren vocht aan. Voor gewone sportactiviteiten is water meestal voldoende.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q6&quot;&gt;&lt;strong&gt;Opdracht 6. Waarom gaat je lichaam zweten tijdens het sporten?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Om meer energie te maken&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Om je spieren sterker te maken&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Om je lichaam af te koelen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Om je hartslag te verlagen&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q7&quot;&gt;&lt;strong&gt;Opdracht 7. Wat is voor de meeste gewone sportactiviteiten een goede drank?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Energiedrank&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Water&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Cola&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q7&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Sterke koffie&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback7&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q8&quot;&gt;&lt;strong&gt;Opdracht 8. Koppel de situatie aan de juiste uitleg.&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Je verliest vocht door zweten&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Vochtverlies&lt;/option&gt;&lt;option&gt;Dehydratatie&lt;/option&gt;&lt;option&gt;Hydratatie&lt;/option&gt;&lt;option&gt;Mogelijk gevolg van uitdroging&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Je lichaam heeft te weinig vocht&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Vochtverlies&lt;/option&gt;&lt;option&gt;Dehydratatie&lt;/option&gt;&lt;option&gt;Hydratatie&lt;/option&gt;&lt;option&gt;Mogelijk gevolg van uitdroging&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Je drinkt voldoende water&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Vochtverlies&lt;/option&gt;&lt;option&gt;Dehydratatie&lt;/option&gt;&lt;option&gt;Hydratatie&lt;/option&gt;&lt;option&gt;Mogelijk gevolg van uitdroging&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Je wordt duizelig na veel zweten&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Vochtverlies&lt;/option&gt;&lt;option&gt;Dehydratatie&lt;/option&gt;&lt;option&gt;Hydratatie&lt;/option&gt;&lt;option&gt;Mogelijk gevolg van uitdroging&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback8&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q9&quot;&gt;&lt;strong&gt;Opdracht 9. Waarom is energiedrank geen goede standaarddrank bij het sporten?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Er zit nooit suiker in&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Er zitten meestal veel cafeïne en vaak veel suiker in&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Er zit geen water in&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q9&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Je krijgt er altijd spierpijn van&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q10&quot;&gt;&lt;strong&gt;Opdracht 10. Noem twee mogelijke gevolgen van uitdroging tijdens het sporten.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Bij open vragen vergelijk je jouw antwoord met de voorbeelduitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback10&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(1)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(1)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block2&quot;&gt;&lt;h2&gt;3. Slaap en sportprestaties&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Slapen is belangrijk voor je herstel en concentratie.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Slaap en herstel&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3
