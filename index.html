&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;2.6 Sportief met elkaar omgaan&lt;/h1&gt;&lt;div class=&quot;small&quot; id=&quot;saveStatus&quot;&gt;Antwoorden worden automatisch opgeslagen&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Wat ga je leren?&lt;/h2&gt;&lt;div class=&quot;goal&quot;&gt;Je leert wat Fair Play betekent en wat het verschil is tussen geschreven en ongeschreven regels.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert waarom samenwerken en iedereen laten meedoen belangrijk zijn bij sport.&lt;/div&gt;&lt;div class=&quot;goal&quot;&gt;Je leert hoe sport mensen kan verbinden en bijdraagt aan een gezonde samenleving.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Gegevens leerling&lt;/h2&gt;&lt;p&gt;Vul je naam en klas in voordat je begint. Je antwoorden worden automatisch opgeslagen in deze browser.&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;label&gt;Naam&lt;input id=&quot;studentName&quot; placeholder=&quot;Voor- en achternaam&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label&gt;Klas&lt;input id=&quot;studentClass&quot; placeholder=&quot;Bijvoorbeeld 1B&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;/div&gt;&lt;p&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;clearSavedWork()&quot; type=&quot;button&quot;&gt;Begin opnieuw (wis opgeslagen antwoorden)&lt;/button&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Sporten doe je met elkaar&lt;/h2&gt;&lt;p&gt;Bij sporten gaat het niet alleen om winnen of presteren. Je hebt ook te maken met teamgenoten, tegenstanders, trainers en scheidsrechters. Daarom zijn &lt;strong&gt;samenwerken, respect en sportief gedrag&lt;/strong&gt; belangrijk. Sport kan bovendien mensen met verschillende achtergronden bij elkaar brengen. In deze paragraaf leer je hoe je sportief met anderen omgaat en waarom iedereen moet kunnen meedoen.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block0&quot;&gt;&lt;h2&gt;1. Fair Play en regels&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Sportief spelen gaat over eerlijkheid, respect en regels.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Fair Play en regels&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjE1IDIwOGw2NC00NiAzOCAyOCA2NS0zMCAzOSA0NS05NCA4Ny01NS0zMC01NiAxOS00OC00OVoiIGZpbGw9IiNmMGM5NmIiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSIxMCIvPjxwYXRoIGQ9Ik0yNTAgMTk5bDQyIDI3IDQwLTI1IiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iOSIgZmlsbD0ibm9uZSIvPjxjaXJjbGUgY3g9IjQ4NSIgY3k9Ijc4IiByPSIyNCIgZmlsbD0iI2YwYzk2YiIgb3BhY2l0eT0iLjc1Ii8+PGNpcmNsZSBjeD0iMTE3IiBjeT0iMjg4IiByPSIxOCIgZmlsbD0iIzdlY2FkMCIgb3BhY2l0eT0iLjgiLz48L3N2Zz4=&quot;/&gt;&lt;p class=&quot;block-introduction&quot;&gt;Bij sport horen officiële spelregels en afspraken over respectvol gedrag. Samen zorgen die ervoor dat wedstrijden eerlijk en prettig verlopen.&lt;/p&gt;
&lt;h3&gt;Eerlijk en sportief spelen&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Fair Play&lt;/strong&gt; betekent eerlijk en sportief spelen. Je houdt je aan de regels, respecteert je tegenstander, accepteert beslissingen van de scheidsrechter en speelt niet expres vals. Je gaat netjes om met winnen én verliezen. Sportief gedrag is dus meer dan alleen de officiële spelregels volgen.&lt;/p&gt;
&lt;h3&gt;Geschreven regels&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Geschreven regels&lt;/strong&gt; zijn de officiële spelregels van een sport. Bij voetbal mag een veldspeler de bal bijvoorbeeld niet met zijn handen spelen. Bij basketbal moet je dribbelen als je met de bal loopt. Bij tennis moet de bal binnen de lijnen landen. De scheidsrechter ziet erop toe dat spelers zich aan de regels houden.&lt;/p&gt;
&lt;h3&gt;Ongeschreven regels&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Ongeschreven regels&lt;/strong&gt; zijn afspraken over respectvol gedrag die niet altijd in het officiële reglement staan. Denk aan een tegenstander overeind helpen, de scheidsrechter respectvol behandelen en een tegenstander na afloop bedanken.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Onthoud:&lt;/strong&gt; geschreven regels gaan over de officiële spelregels; ongeschreven regels gaan over hoe je sportief met anderen omgaat.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q1&quot;&gt;&lt;strong&gt;Opdracht 1. Welke speler laat Fair Play zien?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Sem maakt expres een overtreding.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Noah scheldt de scheidsrechter uit.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Finn helpt een tegenstander overeind na een botsing.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q1&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Liam probeert expres tijd te rekken.&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q2&quot;&gt;&lt;strong&gt;Opdracht 2. Is dit een geschreven of ongeschreven regel?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een veldspeler mag de bal niet met de hand spelen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een tegenstander na afloop bedanken.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Bij basketbal moet je dribbelen als je loopt met de bal.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een geblesseerde tegenstander helpen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Bij tennis moet de bal binnen de lijnen landen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Respectvol omgaan met de scheidsrechter.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Geschreven regel&lt;/option&gt;&lt;option&gt;Ongeschreven regel&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q3&quot;&gt;&lt;strong&gt;Opdracht 3. Je team kan scoren, maar een tegenstander raakt geblesseerd. Daan schiet de bal uit zodat de tegenstander geholpen kan worden. Wat laat die speler zien?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Een officiële spelregel&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Valsspelen&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Een overtreding&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q3&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Fair Play&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q4&quot;&gt;&lt;strong&gt;Opdracht 4. Vul de begrippen in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Eerlijk en sportief spelen heet ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;De officiële spelregels zijn ________ regels.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Respectvol gedrag dat niet altijd in het reglement staat, hoort bij ________ regels.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback4&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;0&quot; id=&quot;q5&quot;&gt;&lt;strong&gt;Opdracht 5. De scheidsrechter fluit tegen jouw team, maar jij bent het niet eens met de beslissing. Hoe kun je toch Fair Play laten zien?&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(0)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(0)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score0&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block1&quot;&gt;&lt;h2&gt;2. Samenwerken en teambuilding&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Goede samenwerking ontstaat wanneer spelers elkaar vertrouwen en helpen.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Samenwerken en teambuilding&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIyMzUiIGN5PSIxNDIiIHI9IjI2IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iMzY1IiBjeT0iMTQyIiByPSIyNiIgZmlsbD0iI2YwYzk2YiIvPjxwYXRoIGQ9Ik0xODYgMjQ5cTEyLTczIDQ5LTczdDQ5IDczTTMxNiAyNDlxMTItNzMgNDktNzN0NDkgNzMiIGZpbGw9IiM3ZWNhZDAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSI4Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMjUxIiByPSIyOSIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjkiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;p class=&quot;block-introduction&quot;&gt;Een goed team bestaat uit spelers die elkaar vertrouwen, helpen en aanmoedigen. Ook bij fouten en verlies blijven ze samen verantwoordelijk.&lt;/p&gt;
&lt;h3&gt;Een goed team werkt samen&lt;/h3&gt;&lt;p&gt;Bij een teamsport heb je elkaar nodig. &lt;strong&gt;Teambuilding&lt;/strong&gt; betekent dat je werkt aan een team dat goed kan samenwerken. Je leert elkaar vertrouwen, elkaar helpen en duidelijk met elkaar communiceren.&lt;/p&gt;
&lt;h3&gt;Hoe werk je goed samen?&lt;/h3&gt;&lt;p&gt;In een goed team &lt;strong&gt;luister je naar elkaar&lt;/strong&gt;, moedig je teamgenoten aan en kraak je niemand af na een fout. Je bent samen verantwoordelijk voor winst én verlies. Iedereen heeft misschien een andere taak, maar het team werkt aan hetzelfde doel.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Voorbeeld:&lt;/strong&gt; een teamgenoot mist een kans. Je zegt niet dat het zijn schuld is, maar moedigt hem aan om door te gaan.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q6&quot;&gt;&lt;strong&gt;Opdracht 6. Jay mist in de laatste minuut een grote kans. Zijn team verliest. Welke reactie past bij goede samenwerking?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; “Door jou hebben we verloren!”&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; “Jammer, volgende keer lukt het wel. We verliezen samen.”&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; “Jij mag niet meer meedoen.”&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q6&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Jay de rest van de avond negeren.&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback6&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q7&quot;&gt;&lt;strong&gt;Opdracht 7. Welk gedrag helpt of schaadt de samenwerking?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een teamgenoot aanmoedigen na een fout.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Helpt samenwerken&lt;/option&gt;&lt;option&gt;Schaadt samenwerken&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een speler de schuld geven van verlies.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Helpt samenwerken&lt;/option&gt;&lt;option&gt;Schaadt samenwerken&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Duidelijk met elkaar overleggen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Helpt samenwerken&lt;/option&gt;&lt;option&gt;Schaadt samenwerken&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Niet naar een teamgenoot luisteren.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Helpt samenwerken&lt;/option&gt;&lt;option&gt;Schaadt samenwerken&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Elkaar vertrouwen en helpen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Helpt samenwerken&lt;/option&gt;&lt;option&gt;Schaadt samenwerken&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback7&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q8&quot;&gt;&lt;strong&gt;Opdracht 8. Welk begrip past bij de uitleg?&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Werken aan vertrouwen en goede samenwerking binnen een team heet ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Goed met elkaar praten en luisteren heet ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback8&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;1&quot; id=&quot;q9&quot;&gt;&lt;strong&gt;Opdracht 9. Noem twee dingen die een team kan doen om beter samen te werken.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback9&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(1)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(1)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score1&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block2&quot;&gt;&lt;h2&gt;3. Inclusie: iedereen doet mee&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Iedereen moet zich welkom voelen en kunnen deelnemen aan sport.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Iedereen doet mee&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIyMzAiIGN5PSIxNDQiIHI9IjI1IiBmaWxsPSIjZjBjOTZiIi8+PGNpcmNsZSBjeD0iMzcwIiBjeT0iMTQ0IiByPSIyNSIgZmlsbD0iI2YwYzk2YiIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjEyMyIgcj0iMjUiIGZpbGw9IiNlNDc3NzAiLz48cGF0aCBkPSJNMTg1IDI2MXE1LTc1IDQ1LTc1dDQ1IDc1TTMyNSAyNjFxNS03NSA0NS03NXQ0NSA3NU0yNTUgMjYwcTUtODUgNDUtODV0NDUgODUiIGZpbGw9IiM3ZWNhZDAiIHN0cm9rZT0iIzA3NWI2NSIgc3Ryb2tlLXdpZHRoPSI4Ii8+PGNpcmNsZSBjeD0iNDg1IiBjeT0iNzgiIHI9IjI0IiBmaWxsPSIjZjBjOTZiIiBvcGFjaXR5PSIuNzUiLz48Y2lyY2xlIGN4PSIxMTciIGN5PSIyODgiIHI9IjE4IiBmaWxsPSIjN2VjYWQwIiBvcGFjaXR5PSIuOCIvPjwvc3ZnPg==&quot;/&gt;&lt;p class=&quot;block-introduction&quot;&gt;Sporters verschillen in ervaring, mogelijkheden en achtergrond. Een fijne sportomgeving geeft iedereen de kans om mee te doen en zich welkom te voelen.&lt;/p&gt;
&lt;h3&gt;Iedereen hoort erbij&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Inclusie&lt;/strong&gt; betekent dat iedereen mee kan doen en zich welkom voelt. Mensen verschillen in sportniveau, achtergrond, leeftijd, geslacht en lichamelijke mogelijkheden. Dat is geen reden om iemand buiten te sluiten.&lt;/p&gt;
&lt;h3&gt;Een inclusieve sportomgeving&lt;/h3&gt;&lt;p&gt;In een &lt;strong&gt;inclusieve sportomgeving&lt;/strong&gt; voelt iedereen zich veilig en geaccepteerd. Soms pas je een oefening of de spelregels aan, zodat ook iemand met een beperking of minder sportervaring kan deelnemen. Je kunt iemand uitnodigen, helpen of uitleg geven.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Onthoud:&lt;/strong&gt; het doel is dat iedereen kan meedoen. Niet iedereen hoeft precies dezelfde oefening op dezelfde manier te doen.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q10&quot;&gt;&lt;strong&gt;Opdracht 10. Mila kan door een lichamelijke beperking niet dezelfde oefening doen als de andere sporters. Wat past het beste bij inclusie?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q10&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Mila laten toekijken.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q10&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Mila niet laten deelnemen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q10&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; De oefening aanpassen zodat Mila kan meedoen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q10&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; De hele activiteit stoppen.&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback10&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q11&quot;&gt;&lt;strong&gt;Opdracht 11. Daniël sport minder goed dan zijn teamgenoten. Hoort Daniël net zo goed bij het team?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Ja, iedereen hoort erbij.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q11&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Nee, alleen goede sporters horen erbij.&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback11&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q12&quot;&gt;&lt;strong&gt;Opdracht 12. Welk gedrag past bij inclusie?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een oefening aanpassen voor iemand met een beperking.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Inclusief&lt;/option&gt;&lt;option&gt;Buitensluiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Daniël niet kiezen omdat hij minder goed sport.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Inclusief&lt;/option&gt;&lt;option&gt;Buitensluiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Nieuwe spelers welkom heten.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Inclusief&lt;/option&gt;&lt;option&gt;Buitensluiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Iemand uitlachen vanwege een fout.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Inclusief&lt;/option&gt;&lt;option&gt;Buitensluiten&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback12&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;2&quot; id=&quot;q13&quot;&gt;&lt;strong&gt;Opdracht 13. Samira is nieuw bij de sportvereniging. Ze kent niemand en durft niet mee te doen. Wat kun jij doen zodat Samira zich welkom voelt?&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback13&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(2)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(2)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score2&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;block3&quot;&gt;&lt;h2&gt;4. De maatschappelijke waarde van sport&lt;/h2&gt;&lt;p class=&quot;chapter-intro&quot;&gt;Sport brengt mensen samen en heeft betekenis voor de hele samenleving.&lt;/p&gt;&lt;img alt=&quot;Illustratie: Sport in de samenleving&quot; class=&quot;uniform-theory-illustration&quot; src=&quot;data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMzgwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjM4MCIgcng9IjI4IiBmaWxsPSIjZTVmN2Y5Ii8+PGNpcmNsZSBjeD0iMzAwIiBjeT0iMTkwIiByPSIxNDIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIyMDEiIHI9IjExMiIgZmlsbD0iIzdlY2FkMCIgc3Ryb2tlPSIjMDc1YjY1IiBzdHJva2Utd2lkdGg9IjExIi8+PHBhdGggZD0iTTE5MCAyMDFoMjIwTTMwMCA4OXYyMjRNMjI0IDEyMHE2NSA4MCAwIDE2Mk0zNzYgMTIwcS02NSA4MCAwIDE2MiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjkiLz48Y2lyY2xlIGN4PSI0ODUiIGN5PSI3OCIgcj0iMjQiIGZpbGw9IiNmMGM5NmIiIG9wYWNpdHk9Ii43NSIvPjxjaXJjbGUgY3g9IjExNyIgY3k9IjI4OCIgcj0iMTgiIGZpbGw9IiM3ZWNhZDAiIG9wYWNpdHk9Ii44Ii8+PC9zdmc+&quot;/&gt;&lt;p class=&quot;block-introduction&quot;&gt;Sport brengt mensen samen, ook buiten wedstrijden en trainingen. Sportverenigingen kunnen ontmoetingsplekken zijn en bijdragen aan een gezonde samenleving.&lt;/p&gt;
&lt;h3&gt;Sport is meer dan bewegen&lt;/h3&gt;&lt;p&gt;Sport is niet alleen goed voor je eigen lichaam. Sport heeft ook een &lt;strong&gt;maatschappelijke waarde&lt;/strong&gt;: sport kan iets positiefs betekenen voor mensen en de samenleving. Een sportvereniging kan een ontmoetingsplek in de wijk zijn.&lt;/p&gt;
&lt;h3&gt;Verbinding&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Verbinding&lt;/strong&gt; betekent dat sport mensen bij elkaar brengt. Mensen ontmoeten elkaar, maken vrienden en voelen zich onderdeel van een groep.&lt;/p&gt;
&lt;h3&gt;Integratie&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Integratie&lt;/strong&gt; betekent dat mensen met verschillende achtergronden elkaar leren kennen en samen deelnemen. Sport kan helpen om elkaar beter te begrijpen.&lt;/p&gt;
&lt;h3&gt;Gezondheid&lt;/h3&gt;&lt;p&gt;Sport stimuleert mensen om te bewegen en kan bijdragen aan een &lt;strong&gt;gezonde leefstijl&lt;/strong&gt;. Je leert tijdens sport ook omgaan met regels, winst en verlies.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Onthoud:&lt;/strong&gt; de maatschappelijke waarde van sport zie je terug in &lt;strong&gt;verbinding, integratie en gezondheid&lt;/strong&gt;.&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q14&quot;&gt;&lt;strong&gt;Opdracht 14. Amir is net verhuisd en leert bij zijn nieuwe voetbalvereniging veel mensen kennen. Welke maatschappelijke functie zie je vooral?&lt;/strong&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;0&quot;/&gt; Verbinding&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;1&quot;/&gt; Gezondheid&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;2&quot;/&gt; Inclusie&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;q14&quot; type=&quot;radio&quot; value=&quot;3&quot;/&gt; Teambuilding&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback14&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q15&quot;&gt;&lt;strong&gt;Opdracht 15. Welke maatschappelijke waarde van sport past bij de situatie?&lt;/strong&gt;&lt;div class=&quot;matchrows&quot;&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Mensen leren nieuwe vrienden kennen bij een sportclub.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Verbinding&lt;/option&gt;&lt;option&gt;Integratie&lt;/option&gt;&lt;option&gt;Gezondheid&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Mensen met verschillende achtergronden sporten samen.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Verbinding&lt;/option&gt;&lt;option&gt;Integratie&lt;/option&gt;&lt;option&gt;Gezondheid&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Mensen bewegen vaker en werken aan hun conditie.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Verbinding&lt;/option&gt;&lt;option&gt;Integratie&lt;/option&gt;&lt;option&gt;Gezondheid&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;matchrow&quot;&gt;&lt;span&gt;Een sportclub is een ontmoetingsplek in de wijk.&lt;/span&gt;&lt;select&gt;&lt;option value=&quot;&quot;&gt;Kies een antwoord&lt;/option&gt;&lt;option&gt;Verbinding&lt;/option&gt;&lt;option&gt;Integratie&lt;/option&gt;&lt;option&gt;Gezondheid&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback15&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q16&quot;&gt;&lt;strong&gt;Opdracht 16. Maak de zinnen af. Vul de ontbrekende woorden in.&lt;/strong&gt;&lt;label class=&quot;fillrow&quot;&gt;Wanneer sport mensen bij elkaar brengt, noemen we dat ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Als mensen met verschillende achtergronden samen sporten en elkaar leren kennen, heet dat ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;label class=&quot;fillrow&quot;&gt;Sport kan bijdragen aan een gezonde ________.&lt;input placeholder=&quot;Vul in&quot; type=&quot;text&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback16&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;question&quot; data-block=&quot;3&quot; id=&quot;q17&quot;&gt;&lt;strong&gt;Opdracht 17. Leg uit hoe sport kan zorgen voor verbinding én integratie. Geef bij beide een voorbeeld.&lt;/strong&gt;&lt;textarea placeholder=&quot;Schrijf je antwoord op...&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;subtle&quot;&gt;Vergelijk je antwoord na het controleren met de uitleg.&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;feedback17&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;button onclick=&quot;checkBlock(3)&quot; type=&quot;button&quot;&gt;Controleer mijn antwoorden&lt;/button&gt; &lt;button class=&quot;secondary&quot; onclick=&quot;resetBlock(3)&quot; type=&quot;button&quot;&gt;Reset dit onderdeel&lt;/button&gt;&lt;/p&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;score&quot; id=&quot;score3&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Samenvatting&lt;/h2&gt;&lt;h3&gt;Fair Play en regels&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Fair Play&lt;/strong&gt; betekent eerlijk en sportief spelen. Je respecteert tegenstanders en scheidsrechters en gaat netjes om met winst en verlies. &lt;strong&gt;Geschreven regels&lt;/strong&gt; zijn de officiële spelregels. &lt;strong&gt;Ongeschreven regels&lt;/strong&gt; gaan over sportief en respectvol gedrag, zoals een tegenstander helpen.&lt;/p&gt;&lt;h3&gt;Samenwerken en teambuilding&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Teambuilding&lt;/strong&gt; betekent werken aan een goede samenwerking. In een goed team vertrouw je elkaar, communiceer je, help je elkaar en moedig je elkaar aan. Je gaat samen om met winst en verlies.&lt;/p&gt;&lt;h3&gt;Inclusie&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Inclusie&lt;/strong&gt; betekent dat iedereen kan meedoen en zich welkom voelt. In een &lt;strong&gt;inclusieve sportomgeving&lt;/strong&gt; wordt niemand buitengesloten. Soms pas je een activiteit aan zodat iemand kan deelnemen.&lt;/p&gt;&lt;h3&gt;De maatschappelijke waarde van sport&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Verbinding:&lt;/strong&gt; sport brengt mensen bij elkaar. &lt;strong&gt;Integratie:&lt;/strong&gt; mensen met verschillende achtergronden leren elkaar kennen. &lt;strong&gt;Gezondheid:&lt;/strong&gt; sport stimuleert bewegen en een gezonde leefstijl. Sport is dus meer dan wedstrijden winnen.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Begrippenlijst&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Fair Play&lt;/summary&gt;&lt;p&gt;Eerlijk en sportief spelen en respect hebben voor anderen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Geschreven regels&lt;/summary&gt;&lt;p&gt;De officiële spelregels van een sport.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Ongeschreven regels&lt;/summary&gt;&lt;p&gt;Afspraken over sportief en respectvol gedrag die niet altijd in de officiële spelregels staan.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Teambuilding&lt;/summary&gt;&lt;p&gt;Werken aan vertrouwen en een goede samenwerking binnen een team.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Inclusie&lt;/summary&gt;&lt;p&gt;Ervoor zorgen dat iedereen mee kan doen en zich welkom voelt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Inclusieve sportomgeving&lt;/summary&gt;&lt;p&gt;Een sportomgeving waarin iedereen kan deelnemen en zich veilig en geaccepteerd voelt.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Verbinding&lt;/summary&gt;&lt;p&gt;Mensen door sport met elkaar in contact brengen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Integratie&lt;/summary&gt;&lt;p&gt;Mensen met verschillende achtergronden samen laten deelnemen en elkaar laten leren kennen.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Maatschappelijke waarde&lt;/summary&gt;&lt;p&gt;De positieve betekenis die sport kan hebben voor mensen en de samenleving.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Exit-ticket&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Hoe goed begrijp je deze paragraaf?&lt;/strong&gt;&lt;/p&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Goed&quot;/&gt; Ik begrijp het goed.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Deels&quot;/&gt; Ik begrijp een deel, maar wil nog oefenen.&lt;/label&gt;&lt;label class=&quot;option&quot;&gt;&lt;input name=&quot;exit&quot; type=&quot;radio&quot; value=&quot;Hulp&quot;/&gt; Ik heb nog uitleg nodig.&lt;/label&gt;&lt;p&gt;&lt;strong&gt;Wat heb je vandaag geleerd?&lt;/strong&gt;&lt;/p&gt;&lt;textarea id=&quot;exitText&quot; placeholder=&quot;Schrijf één belangrijk ding op...&quot;&gt;&lt;/textarea&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;
const Q=[{&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Welke speler laat Fair Play zien?&quot;, &quot;options&quot;: [&quot;Sem maakt expres een overtreding.&quot;, &quot;Noah scheldt de scheidsrechter uit.&quot;, &quot;Finn helpt een tegenstander overeind na een botsing.&quot;, &quot;Liam probeert expres tijd te rekken.&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Finn helpt zijn tegenstander. Dat is respectvol en sportief gedrag.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Is dit een geschreven of ongeschreven regel?&quot;, &quot;items&quot;: [[&quot;Een veldspeler mag de bal niet met de hand spelen.&quot;, &quot;Geschreven regel&quot;], [&quot;Een tegenstander na afloop bedanken.&quot;, &quot;Ongeschreven regel&quot;], [&quot;Bij basketbal moet je dribbelen als je loopt met de bal.&quot;, &quot;Geschreven regel&quot;], [&quot;Een geblesseerde tegenstander helpen.&quot;, &quot;Ongeschreven regel&quot;], [&quot;Bij tennis moet de bal binnen de lijnen landen.&quot;, &quot;Geschreven regel&quot;], [&quot;Respectvol omgaan met de scheidsrechter.&quot;, &quot;Ongeschreven regel&quot;]], &quot;choices&quot;: [&quot;Geschreven regel&quot;, &quot;Ongeschreven regel&quot;], &quot;explain&quot;: &quot;Geschreven regels zijn officiële spelregels. Ongeschreven regels gaan over respect en sportief gedrag.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Je team kan scoren, maar een tegenstander raakt geblesseerd. Een speler schiet de bal uit zodat de tegenstander geholpen kan worden. Wat laat die speler zien?&quot;, &quot;options&quot;: [&quot;Een officiële spelregel&quot;, &quot;Valsspelen&quot;, &quot;Een overtreding&quot;, &quot;Fair Play&quot;], &quot;answer&quot;: 3, &quot;explain&quot;: &quot;De speler kiest ervoor iemand te helpen. Dat is Fair Play.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;fill&quot;, &quot;title&quot;: &quot;Vul de begrippen in.&quot;, &quot;prompts&quot;: [&quot;Eerlijk en sportief spelen heet ________.&quot;, &quot;De officiële spelregels zijn ________ regels.&quot;, &quot;Respectvol gedrag dat niet altijd in het reglement staat, hoort bij ________ regels.&quot;], &quot;answers&quot;: [[&quot;fair play&quot;, &quot;fairplay&quot;], [&quot;geschreven&quot;], [&quot;ongeschreven&quot;]], &quot;explain&quot;: &quot;Fair Play = sportief spelen. Geschreven regels zijn officieel; ongeschreven regels gaan over hoe je met anderen omgaat.&quot;}, {&quot;block&quot;: 0, &quot;kind&quot;: &quot;open&quot;, &quot;title&quot;: &quot;De scheidsrechter fluit tegen jouw team, maar jij bent het niet eens met de beslissing. Hoe kun je toch Fair Play laten zien?&quot;, &quot;explain&quot;: &quot;Bijvoorbeeld rustig blijven, de beslissing accepteren, niet schelden en gewoon verder spelen.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Jay mist in de laatste minuut een grote kans. Zijn team verliest. Welke reactie past bij goede samenwerking?&quot;, &quot;options&quot;: [&quot;“Door jou hebben we verloren!”&quot;, &quot;“Jammer, volgende keer lukt het wel. We verliezen samen.”&quot;, &quot;“Jij mag niet meer meedoen.”&quot;, &quot;Jay de rest van de avond negeren.&quot;], &quot;answer&quot;: 1, &quot;explain&quot;: &quot;Een goed team moedigt elkaar aan en is samen verantwoordelijk voor winst en verlies.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Welk gedrag helpt of schaadt de samenwerking?&quot;, &quot;items&quot;: [[&quot;Een teamgenoot aanmoedigen na een fout.&quot;, &quot;Helpt samenwerken&quot;], [&quot;Een speler de schuld geven van verlies.&quot;, &quot;Schaadt samenwerken&quot;], [&quot;Duidelijk met elkaar overleggen.&quot;, &quot;Helpt samenwerken&quot;], [&quot;Niet naar een teamgenoot luisteren.&quot;, &quot;Schaadt samenwerken&quot;], [&quot;Elkaar vertrouwen en helpen.&quot;, &quot;Helpt samenwerken&quot;]], &quot;choices&quot;: [&quot;Helpt samenwerken&quot;, &quot;Schaadt samenwerken&quot;], &quot;explain&quot;: &quot;Vertrouwen, communiceren, helpen en aanmoedigen maken een team sterker. Beschuldigen en niet luisteren werken tegen.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;fill&quot;, &quot;title&quot;: &quot;Welk begrip past bij de uitleg?&quot;, &quot;prompts&quot;: [&quot;Werken aan vertrouwen en goede samenwerking binnen een team heet ________.&quot;, &quot;Goed met elkaar praten en luisteren heet ________.&quot;], &quot;answers&quot;: [[&quot;teambuilding&quot;], [&quot;communiceren&quot;, &quot;communicatie&quot;]], &quot;explain&quot;: &quot;Teambuilding versterkt de samenwerking. Communiceren betekent duidelijk praten én luisteren.&quot;}, {&quot;block&quot;: 1, &quot;kind&quot;: &quot;open&quot;, &quot;title&quot;: &quot;Noem twee dingen die een team kan doen om beter samen te werken.&quot;, &quot;explain&quot;: &quot;Bijvoorbeeld elkaar helpen, vertrouwen, overleggen, aanmoedigen en samen omgaan met winst en verlies.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Mila kan door een lichamelijke beperking niet dezelfde oefening doen als de andere sporters. Wat past het beste bij inclusie?&quot;, &quot;options&quot;: [&quot;Mila laten toekijken.&quot;, &quot;Mila niet laten deelnemen.&quot;, &quot;De oefening aanpassen zodat Mila kan meedoen.&quot;, &quot;De hele activiteit stoppen.&quot;], &quot;answer&quot;: 2, &quot;explain&quot;: &quot;Bij inclusie probeer je de activiteit zo aan te passen dat iedereen kan meedoen.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Daniël sport minder goed dan zijn teamgenoten. Hoort Daniël net zo goed bij het team?&quot;, &quot;options&quot;: [&quot;Ja, iedereen hoort erbij.&quot;, &quot;Nee, alleen goede sporters horen erbij.&quot;], &quot;answer&quot;: 0, &quot;explain&quot;: &quot;Iedereen moet zich welkom en geaccepteerd kunnen voelen, ongeacht het sportniveau.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Welk gedrag past bij inclusie?&quot;, &quot;items&quot;: [[&quot;Een oefening aanpassen voor iemand met een beperking.&quot;, &quot;Inclusief&quot;], [&quot;Daniël niet kiezen omdat hij minder goed sport.&quot;, &quot;Buitensluiten&quot;], [&quot;Nieuwe spelers welkom heten.&quot;, &quot;Inclusief&quot;], [&quot;Iemand uitlachen vanwege een fout.&quot;, &quot;Buitensluiten&quot;]], &quot;choices&quot;: [&quot;Inclusief&quot;, &quot;Buitensluiten&quot;], &quot;explain&quot;: &quot;Inclusie betekent dat iedereen mee kan doen en zich welkom voelt. Uitsluiten of uitlachen past daar niet bij.&quot;}, {&quot;block&quot;: 2, &quot;kind&quot;: &quot;open&quot;, &quot;title&quot;: &quot;Samira is nieuw bij de sportvereniging. Ze kent niemand en durft niet mee te doen. Wat kun jij doen zodat Samira zich welkom voelt?&quot;, &quot;explain&quot;: &quot;Bijvoorbeeld de leerling uitnodigen, uitleg geven, samen oefenen of een plek in het team aanbieden.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;mc&quot;, &quot;title&quot;: &quot;Amir is net verhuisd en leert bij zijn nieuwe voetbalvereniging veel mensen kennen. Welke maatschappelijke functie zie je vooral?&quot;, &quot;options&quot;: [&quot;Verbinding&quot;, &quot;Gezondheid&quot;, &quot;Inclusie&quot;, &quot;Teambuilding&quot;], &quot;answer&quot;: 0, &quot;explain&quot;: &quot;Sport brengt Amir in contact met nieuwe mensen. Dat noemen we verbinding.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;match&quot;, &quot;title&quot;: &quot;Welke maatschappelijke waarde van sport past bij de situatie?&quot;, &quot;items&quot;: [[&quot;Mensen leren nieuwe vrienden kennen bij een sportclub.&quot;, &quot;Verbinding&quot;], [&quot;Mensen met verschillende achtergronden sporten samen.&quot;, &quot;Integratie&quot;], [&quot;Mensen bewegen vaker en werken aan hun conditie.&quot;, &quot;Gezondheid&quot;], [&quot;Een sportclub is een ontmoetingsplek in de wijk.&quot;, &quot;Verbinding&quot;]], &quot;choices&quot;: [&quot;Verbinding&quot;, &quot;Integratie&quot;, &quot;Gezondheid&quot;], &quot;explain&quot;: &quot;Verbinding = mensen samenbrengen. Integratie = verschillende achtergronden ontmoeten elkaar. Gezondheid = bewegen en een gezonde leefstijl.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;fill&quot;, &quot;title&quot;: &quot;Maak de zinnen af. Vul de ontbrekende woorden in.&quot;, &quot;prompts&quot;: [&quot;Wanneer sport mensen bij elkaar brengt, noemen we dat ________.&quot;, &quot;Als mensen met verschillende achtergronden samen sporten en elkaar leren kennen, heet dat ________.&quot;, &quot;Sport kan bijdragen aan een gezonde ________.&quot;], &quot;answers&quot;: [[&quot;verbinding&quot;], [&quot;integratie&quot;], [&quot;leefstijl&quot;, &quot;samenleving&quot;]], &quot;explain&quot;: &quot;Verbinding, integratie en gezondheid zijn belangrijke maatschappelijke waarden van sport.&quot;}, {&quot;block&quot;: 3, &quot;kind&quot;: &quot;open&quot;, &quot;title&quot;: &quot;Leg uit hoe sport kan zorgen voor verbinding én integratie. Geef bij beide een voorbeeld.&quot;, &quot;explain&quot;: &quot;Verbinding: sport brengt mensen bij elkaar, bijvoorbeeld op een vereniging. Integratie: mensen met verschillende achtergronden leren elkaar kennen door samen te sporten.&quot;}];
const KEY='verzorging_h2_paragraaf_26_v1';
function norm(v){return String(v||'').trim().toLocaleLowerCase('nl').replace(/\s+/g,' ')}
function getAnswer(q,n){let el=document.getElementById('q'+n);
if(q.kind==='mc'){let r=el.querySelector('input:checked');return r?Number(r.value):null}
if(q.kind==='match')return [...el.querySelectorAll('select')].map(x=&gt;x.value);
if(q.kind==='fill')return [...el.querySelectorAll('input[type=text]')].map(x=&gt;x.value);
if(q.kind==='order')return [...el.querySelectorAll('.step')].map(x=&gt;x.querySelector('span').textContent);
return el.querySelector('textarea').value}
function moveStep(button,delta){let item=button.closest('.step'),list=item.parentElement,other=delta&lt;0?item.previousElementSibling:item.nextElementSibling;if(!other)return;if(delta&lt;0)list.insertBefore(item,other);else list.insertBefore(other,item);save()}
function checkBlock(b){let correct=0,total=0;
Q.forEach((q,i)=&gt;{if(q.block!==b)return;let n=i+1,answer=getAnswer(q,n),feedback=document.getElementById('feedback'+n),ok=false,answered=false;
if(q.kind==='mc'){answered=answer!==null;ok=answer===q.answer}
if(q.kind==='match'){answered=answer.some(Boolean);ok=answer.every((v,j)=&gt;(norm(v)===norm(q.items[j][1])||(q.items[j][0]==='Noten'&amp;&amp;norm(v)==='eiwitten')))}
if(q.kind==='fill'){answered=answer.some(x=&gt;x.trim());ok=answer.every((v,j)=&gt;q.answers[j].some(x=&gt;norm(v)===norm(x)))}
if(q.kind==='order'){answered=true;ok=answer.every((v,j)=&gt;v===q.steps[j])}
if(q.kind==='open'){answered=answer.trim().length&gt;0;ok=answered}
total++;if(ok)correct++;
let extra='';
if(q.kind==='match')extra='\nJuiste indeling:\n'+q.items.map(([a,c])=&gt;'• '+a+' → '+(a==='Noten'?'Vetten of eiwitten':c)).join('\n');
if(q.kind==='order')extra='\nJuiste volgorde:\n'+q.steps.map((x,j)=&gt;(j+1)+'. '+x).join('\n');
if(q.kind==='fill')extra='\nJuiste antwoorden: '+q.answers.map(x=&gt;x[0]).join(' · ');
if(q.kind==='mc')extra='\nJuiste antwoord: '+q.options[q.answer];
if(q.kind==='open'){feedback.className='feedback';feedback.textContent=(answered?'Vergelijk je antwoord met deze uitleg: ':'Vul eerst een antwoord in. Voorbeelduitleg: ')+q.explain;return}
feedback.className='feedback '+(ok?'good':'bad');
feedback.textContent=(ok?'✓ Goed!':answered?'✕ Nog niet goed.':'✕ Nog niet ingevuld.')+'\n'+q.explain+extra;
});
document.getElementById('score'+b).textContent='Je hebt '+correct+' van de '+total+' opdrachten goed ingevuld. Open vragen controleer je zelf met de uitleg.';save();notifyHeight()}
function resetBlock(b){Q.forEach((q,i)=&gt;{if(q.block!==b)return;let n=i+1,el=document.getElementById('q'+n);el.querySelectorAll('input[type=radio]').forEach(x=&gt;x.checked=false);el.querySelectorAll('input[type=text],textarea').forEach(x=&gt;x.value='');el.querySelectorAll('select').forEach(x=&gt;x.value='');if(q.kind==='order'){let list=el.querySelector('.steps');[...list.children].sort((a,b)=&gt;Number(b.dataset.step)-Number(a.dataset.step)).forEach(x=&gt;list.append(x))}document.getElementById('feedback'+n).textContent='';document.getElementById('feedback'+n).className='feedback'});document.getElementById('score'+b).textContent='';save();notifyHeight()}
function save(){let data={name:document.getElementById('studentName').value,klass:document.getElementById('studentClass').value,answers:Q.map((q,i)=&gt;getAnswer(q,i+1)),exit:document.querySelector('input[name=exit]:checked')?.value||'',exitText:document.getElementById('exitText').value};try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveStatus').textContent='✓ Antwoorden automatisch opgeslagen'}catch(e){document.getElementById('saveStatus').textContent='Opslaan niet beschikbaar'}}
function restore(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;document.getElementById('studentName').value=d.name||'';document.getElementById('studentClass').value=d.klass||'';Q.forEach((q,i)=&gt;{let a=d.answers?.[i],el=document.getElementById('q'+(i+1));if(a==null)return;if(q.kind==='mc'){let x=el.querySelector('input[value=&quot;'+a+'&quot;]');if(x)x.checked=true}else if(q.kind==='match'){el.querySelectorAll('select').forEach((x,j)=&gt;x.value=a[j]||'')}else if(q.kind==='fill'){el.querySelectorAll('input[type=text]').forEach((x,j)=&gt;x.value=a[j]||'')}else if(q.kind==='order'&amp;&amp;Array.isArray(a)){let list=el.querySelector('.steps');a.forEach(t=&gt;{let x=[...list.children].find(x=&gt;x.querySelector('span').textContent===t);if(x)list.append(x)})}else if(q.kind==='open')el.querySelector('textarea').value=a});let r=[...document.querySelectorAll('input[name=exit]')].find(x=&gt;x.value===d.exit);if(r)r.checked=true;document.getElementById('exitText').value=d.exitText||'';document.getElementById('saveStatus').textContent='✓ Opgeslagen antwoorden hersteld'}catch(e){}}
function clearSavedWork(){if(!confirm('Weet je zeker dat je alle opgeslagen antwoorden van paragraaf 2.6 wilt wissen?'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function notifyHeight(){let h=Math.ceil((document.querySelector('main.wrap')||document.body).getBoundingClientRect().bottom+window.scrollY+12);if(window.parent!==window)parent.postMessage({kind:'worksheetHeight',height:h},'*')}

&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;small&quot;&gt;Hoofdstuk 2 Verzorging: Sporten&lt;/div&gt;&lt;h1&gt;Om te onthouden&lt;/h1&gt;&lt;div class=&quot;small&quot;&gt;Leren voor het proefwerk · paragraaf 2.1 t/m 2.6&lt;/div&gt;&lt;/header&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Zo leer je voor het proefwerk&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;Op deze pagina staat de &lt;strong&gt;belangrijkste theorie&lt;/strong&gt; van het hele hoofdstuk. Lees eerst de samenvattingen. Oefen daarna met de begrippenkaartjes en de korte zelftest. Vink af welke paragrafen je al goed begrijpt. Zo ontdek je wat je nog moet herhalen.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Leertip:&lt;/strong&gt; lees een stukje, dek de uitleg af en vertel in je eigen woorden wat het betekent. Controleer daarna of je antwoord klopt.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.1 Waarom bewegen gezond is&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Je lichaam tijdens het bewegen&lt;/h3&gt;&lt;p&gt;Spieren hebben energie, zuurstof en voedingsstoffen nodig. Bij inspanning gaat je hart sneller kloppen, stroomt er meer bloed naar de spieren en adem je sneller en dieper. Zo neem je meer zuurstof op en voer je meer koolstofdioxide af.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Bewegen en je hersenen&lt;/h3&gt;&lt;p&gt;Bewegen kan je fitter en prettiger laten voelen. In je hersenen spelen stoffen zoals endorfine en dopamine een rol bij je stemming.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Matig of zwaar intensief&lt;/h3&gt;&lt;p&gt;Bij matig intensief bewegen adem je sneller, maar kun je nog praten. Bij zwaar intensief bewegen adem je veel sneller en kun je nauwelijks praten. Denk aan rustig doorfietsen tegenover sprinten.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Beweegrichtlijnen&lt;/h3&gt;&lt;p&gt;Kinderen en jongeren van 4 t/m 17 jaar bewegen volgens de Nederlandse richtlijn elke dag minstens één uur matig intensief en doen minstens drie keer per week spier- en botversterkende activiteiten. Volwassenen en ouderen bewegen minstens 150 minuten per week matig intensief, verspreid over meerdere dagen, en doen minstens twee keer per week spier- en botversterkende activiteiten. Ouderen doen daarnaast balansoefeningen. Minder zitten is voor iedereen belangrijk.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.2 Verschillende sporten&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Teamsport en individuele sport&lt;/h3&gt;&lt;p&gt;Bij een teamsport, zoals voetbal of volleybal, werk je samen aan één resultaat. Bij een individuele sport, zoals hardlopen of zwemmen, draait de prestatie vooral om jezelf. Ook een individuele sport kun je samen trainen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Voor- en nadelen&lt;/h3&gt;&lt;p&gt;Teamsport geeft contact, samenwerking en aanmoediging, maar je bent afhankelijk van teamgenoten en vaste tijden. Individueel sporten geeft vaak meer vrijheid en ruimte voor eigen doelen, maar vraagt zelfmotivatie en kan minder sociaal zijn.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Gebonden en ongebonden sport&lt;/h3&gt;&lt;p&gt;Gebonden sporten doe je via bijvoorbeeld een sportvereniging, vaak met contributie, vaste trainingstijden en afspraken. Ongebonden sporten kun je meestal zelf plannen, zoals zelfstandig hardlopen of thuis trainen. Een individuele sport kan óók gebonden zijn.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Een passende sport kiezen&lt;/h3&gt;&lt;p&gt;Let op wat je leuk vindt, of je liever samen of alleen sport, je vrije tijd, je budget en je motivatie. Zelfdiscipline betekent dat je ook blijft oefenen wanneer je even minder zin hebt.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.3 Fit blijven en conditie&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Wat is conditie?&lt;/h3&gt;&lt;p&gt;Conditie bestaat uit vijf grondmotorische eigenschappen: CLUKS. Dat staat voor coördinatie (bewegingen goed afstemmen), lenigheid (soepel bewegen), uithoudingsvermogen (lang doorgaan), kracht (kracht leveren) en snelheid (snel reageren of bewegen).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Hartslag en inspanning&lt;/h3&gt;&lt;p&gt;Je rusthartslag is het aantal hartslagen per minuut wanneer je rustig bent. Bij inspanning stijgt je hartslag. De formule 220 min je leeftijd wordt soms gebruikt als een grove schatting van je maximale hartslag; het is geen precieze persoonlijke grens.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Trainen, herstellen en sterker worden&lt;/h3&gt;&lt;p&gt;Training belast je spieren. Na inspanning heeft je lichaam rust, voeding en slaap nodig om te herstellen. Bij voldoende herstel kan je lichaam zich aanpassen en sterker worden: supercompensatie. Te weinig herstel kan juist vermoeidheid en overbelasting geven.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.4 Eten, drinken en slapen&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Voedingsstoffen en hun functies&lt;/h3&gt;&lt;p&gt;Bouwstoffen zijn nodig voor groei, onderhoud en herstel, zoals eiwitten voor spieren. Brandstoffen leveren energie, vooral koolhydraten en vetten. Reservestoffen zijn stoffen die het lichaam opslaat voor later gebruik, zoals vet. Vitamines en mineralen helpen lichaamsprocessen goed verlopen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Voeding rondom het sporten&lt;/h3&gt;&lt;p&gt;Koolhydraten leveren energie tijdens bewegen. Vetten zijn ook een energiebron en kunnen als reserve worden opgeslagen. Eiwitten helpen bij opbouw en herstel van spieren. Noten bevatten zowel vetten als eiwitten.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Hydratatie: voldoende drinken&lt;/h3&gt;&lt;p&gt;Hydratatie betekent dat je lichaam voldoende vocht heeft. Door zweten verlies je water en zouten. Drink daarom voldoende, zeker bij warmte en langdurige inspanning. Dorst, donkere urine en duizeligheid kunnen wijzen op vochttekort.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Slaap en herstel&lt;/h3&gt;&lt;p&gt;Tijdens de slaap herstelt je lichaam. Vooral tijdens de diepe slaap speelt groeihormoon een rol bij groei en herstel. Te weinig slaap kan je concentratie, stemming en sportprestaties verminderen.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.5 Veilig sporten&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Warming-up en cooling-down&lt;/h3&gt;&lt;p&gt;Met een warming-up verhoog je geleidelijk je hartslag en lichaamstemperatuur. Je bereidt spieren en gewrichten voor op inspanning. Met een cooling-down bouw je de inspanning rustig af, bijvoorbeeld door uit te lopen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Beschermingsmiddelen en materiaal&lt;/h3&gt;&lt;p&gt;Gebruik passende sportschoenen en beschermingsmiddelen. Denk aan een helm, scheenbeschermers, gebitsbeschermer, handschoenen of kniebeschermers. Welk middel je gebruikt, hangt af van het risico bij de sport.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Acute blessures en overbelasting&lt;/h3&gt;&lt;p&gt;Een acute blessure ontstaat plotseling, bijvoorbeeld een verstuikte enkel na een verkeerde landing of een kneuzing door een botsing. Overbelasting ontstaat meestal geleidelijk door te veel of te vaak trainen zonder voldoende herstel.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Eerste hulp en koelen&lt;/h3&gt;&lt;p&gt;Stop bij een blessure met sporten en beoordeel de situatie. Bij een verstuiking of kneuzing kun je tijdelijk koelen om pijn te verminderen. Leg ijs of een coldpack nooit rechtstreeks op de huid: gebruik een doek om koudeschade te voorkomen. Bij ernstige pijn, een afwijkende stand of niet kunnen steunen is medische beoordeling nodig.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Veilige sportomgeving&lt;/h3&gt;&lt;p&gt;Controleer of de vloer of het veld veilig is, materialen heel zijn en er voldoende ruimte is. Let op gladheid, weersomstandigheden, kleding, schoenen en duidelijke afspraken. Meld gevaarlijke situaties aan een trainer of docent.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2 class=&quot;chapter-heading&quot;&gt;2.6 Sportief met elkaar omgaan&lt;/h2&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Fair Play en regels&lt;/h3&gt;&lt;p&gt;Fair Play betekent eerlijk en sportief spelen. Geschreven regels zijn officiële spelregels, zoals niet met de hand spelen bij voetbal. Ongeschreven regels gaan over respect, bijvoorbeeld een tegenstander overeind helpen of de scheidsrechter netjes behandelen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Samenwerken en teambuilding&lt;/h3&gt;&lt;p&gt;Teambuilding betekent werken aan vertrouwen en samenwerking. Goed communiceren, elkaar helpen en aanmoedigen maken een team sterker. Je bent samen verantwoordelijk voor winnen én verliezen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;Inclusie: iedereen doet mee&lt;/h3&gt;&lt;p&gt;Inclusie betekent dat iedereen welkom is en kan meedoen, ongeacht sportniveau of achtergrond. Soms pas je een oefening aan voor iemand met een beperking of minder ervaring.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;topic&quot;&gt;&lt;h3&gt;De maatschappelijke waarde van sport&lt;/h3&gt;&lt;p&gt;Verbinding: mensen ontmoeten elkaar en maken contact. Integratie: mensen met verschillende achtergronden leren elkaar kennen. Gezondheid: sporten stimuleert bewegen en een gezonde leefstijl.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot; id=&quot;flashcards&quot;&gt;&lt;h2&gt;Oefenen met begrippenkaartjes&lt;/h2&gt;&lt;p&gt;Probeer de vraag eerst zelf te beantwoorden. Klik op het kaartje om het antwoord te zien.&lt;/p&gt;&lt;div class=&quot;progress&quot; id=&quot;cardProgress&quot;&gt;&lt;/div&gt;&lt;div aria-label=&quot;Draai begrippenkaartje om&quot; class=&quot;flashcard&quot; id=&quot;flashcard&quot; role=&quot;button&quot; tabindex=&quot;0&quot;&gt;&lt;div class=&quot;face&quot; id=&quot;cardFace&quot;&gt;&lt;/div&gt;&lt;div class=&quot;hint&quot; id=&quot;cardHint&quot;&gt;Klik om het antwoord te zien&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tool-buttons&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;prevCard&quot; type=&quot;button&quot;&gt;← Vorige&lt;/button&gt;&lt;button id=&quot;flipCard&quot; type=&quot;button&quot;&gt;Toon antwoord&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;nextCard&quot; type=&quot;button&quot;&gt;Volgende →&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;shuffleCards&quot; type=&quot;button&quot;&gt;Schud kaartjes&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot; id=&quot;selfquiz&quot;&gt;&lt;h2&gt;Snelle zelftest&lt;/h2&gt;&lt;p&gt;Beantwoord telkens één vraag. Je ziet meteen of je het begrip goed kent.&lt;/p&gt;&lt;div class=&quot;progress&quot; id=&quot;quizProgress&quot;&gt;&lt;/div&gt;&lt;h3 id=&quot;quizQuestion&quot;&gt;&lt;/h3&gt;&lt;div id=&quot;quizOptions&quot;&gt;&lt;/div&gt;&lt;button id=&quot;checkQuiz&quot; type=&quot;button&quot;&gt;Controleer antwoord&lt;/button&gt; &lt;button class=&quot;secondary&quot; id=&quot;nextQuiz&quot; type=&quot;button&quot;&gt;Volgende vraag →&lt;/button&gt;&lt;div aria-live=&quot;polite&quot; id=&quot;quizFeedback&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Mijn leerchecklist&lt;/h2&gt;&lt;p&gt;Vink aan wat je al goed kunt uitleggen. Je keuzes blijven bewaard op dit apparaat.&lt;/p&gt;&lt;div id=&quot;checklist&quot;&gt;&lt;/div&gt;&lt;p class=&quot;progress&quot; id=&quot;checkProgress&quot;&gt;&lt;/p&gt;&lt;button class=&quot;secondary&quot; id=&quot;clearChecks&quot; type=&quot;button&quot;&gt;Checklist opnieuw beginnen&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Klaar voor het proefwerk?&lt;/h2&gt;&lt;p&gt;Kun je de belangrijke begrippen uitleggen zonder te spieken? Maak dan de &lt;strong&gt;diagnostische toets&lt;/strong&gt; via de navigatie links. Bekijk vooral de uitleg bij de vragen die je fout hebt. Ga daarna terug naar de theorie van de bijbehorende paragraaf.&lt;/p&gt;&lt;/section&gt;&lt;/main&gt;&lt;script&gt;

const KEY='verzorging_h2_om_te_onthouden_checklist_v1';
let order=CARDS.map((_,i)=&gt;i),cardIndex=0,flipped=false,quizIndex=0,quizChecked=false;
function showCard(){const [q,a]=CARDS[order[cardIndex]];document.getElementById('cardFace').textContent=flipped?a:q;document.getElementById('cardHint').textContent=flipped?'Klik om de vraag terug te zien':'Klik om het antwoord te zien';document.getElementById('cardProgress').textContent='Kaartje '+(cardIndex+1)+' van '+CARDS.length;document.getElementById('flipCard').textContent=flipped?'Toon vraag':'Toon antwoord';}
function flip(){flipped=!flipped;showCard()}
document.getElementById('flashcard').onclick=flip;
document.getElementById('flashcard').onkeydown=e=&gt;{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
document.getElementById('flipCard').onclick=flip;
document.getElementById('prevCard').onclick=()=&gt;{cardIndex=(cardIndex-1+order.length)%order.length;flipped=false;showCard()};
document.getElementById('nextCard').onclick=()=&gt;{cardIndex=(cardIndex+1)%order.length;flipped=false;showCard()};
document.getElementById('shuffleCards').onclick=()=&gt;{for(let i=order.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}cardIndex=0;flipped=false;showCard()};
function showQuiz(){const q=QUIZ[quizIndex];quizChecked=false;document.getElementById('quizProgress').textContent='Vraag '+(quizIndex+1)+' van '+QUIZ.length;document.getElementById('quizQuestion').textContent=q.q;const box=document.getElementById('quizOptions');box.replaceChildren();q.o.forEach((option,i)=&gt;{const l=document.createElement('label');l.className='quiz-option';const r=document.createElement('input');r.type='radio';r.name='quickquiz';r.value=i;l.append(r,document.createTextNode(' '+option));box.append(l)});document.getElementById('quizFeedback').replaceChildren();}
document.getElementById('checkQuiz').onclick=()=&gt;{const selected=document.querySelector('input[name=quickquiz]:checked');const q=QUIZ[quizIndex];const feedback=document.getElementById('quizFeedback');feedback.replaceChildren();const p=document.createElement('div');p.className='quiz-feedback'+(!selected||Number(selected.value)!==q.a?' bad':'');const h=document.createElement('strong');h.textContent=selected&amp;&amp;Number(selected.value)===q.a?'✓ Goed!':'✗ Nog even oefenen.';const t=document.createElement('p');t.textContent='Juiste antwoord: '+q.o[q.a]+'. '+q.why;p.append(h,t);feedback.append(p);quizChecked=true;};
document.getElementById('nextQuiz').onclick=()=&gt;{quizIndex=(quizIndex+1)%QUIZ.length;showQuiz()};
const list=document.getElementById('checklist');
CHECKS.forEach((name,i)=&gt;{const label=document.createElement('label');label.className='checkrow';const cb=document.createElement('input');cb.type='checkbox';cb.dataset.index=i;const span=document.createElement('span');span.textContent=name;label.append(cb,span);list.append(label);cb.onchange=saveChecks;});
function saveChecks(){const checks=[...list.querySelectorAll('input')].map(x=&gt;x.checked);try{localStorage.setItem(KEY,JSON.stringify(checks))}catch(e){}document.getElementById('checkProgress').textContent=checks.filter(Boolean).length+' van '+checks.length+' onderdelen afgevinkt';}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');list.querySelectorAll('input').forEach((x,i)=&gt;x.checked=!!saved[i]);}catch(e){}
document.getElementById('clearChecks').onclick=()=&gt;{list.querySelectorAll('input').forEach(x=&gt;x.checked=false);saveChecks()};
showCard();showQuiz();saveChecks();

const QUESTIONS=[{&quot;section&quot;:&quot;2.1 Bewegen en gezondheid&quot;,&quot;prompt&quot;:&quot;Wat gebeurt er met je hartslag als je intensief gaat bewegen?&quot;,&quot;options&quot;:[&quot;Je hartslag daalt.&quot;,&quot;Je hartslag blijft altijd gelijk.&quot;,&quot;Je hartslag stijgt.&quot;,&quot;Je hart stopt kort.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Je spieren hebben meer zuurstof en voedingsstoffen nodig. Daarom pompt je hart sneller bloed rond.&quot;},{&quot;section&quot;:&quot;2.1 Bewegen en gezondheid&quot;,&quot;prompt&quot;:&quot;Waarom ga je tijdens het sporten sneller en dieper ademhalen?&quot;,&quot;options&quot;:[&quot;Om meer zuurstof op te nemen en koolstofdioxide af te voeren.&quot;,&quot;Om minder bloed naar je spieren te sturen.&quot;,&quot;Omdat je lichaam minder energie nodig heeft.&quot;,&quot;Om je hartslag te verlagen.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Bij inspanning hebben je spieren meer zuurstof nodig en ontstaat meer koolstofdioxide dat je uitademt.&quot;},{&quot;section&quot;:&quot;2.1 Bewegen en gezondheid&quot;,&quot;prompt&quot;:&quot;Welke activiteit is meestal zwaar intensief?&quot;,&quot;options&quot;:[&quot;Rustig wandelen.&quot;,&quot;Op een bank zitten.&quot;,&quot;Langzaam fietsen zonder moeite.&quot;,&quot;Snel sprinten.&quot;],&quot;correct&quot;:3,&quot;explanation&quot;:&quot;Bij sprinten adem je snel en kun je meestal nauwelijks nog praten.&quot;},{&quot;section&quot;:&quot;2.1 Bewegen en gezondheid&quot;,&quot;prompt&quot;:&quot;Welke combinatie past bij matig intensief bewegen?&quot;,&quot;options&quot;:[&quot;Je ademt sneller maar kunt nog praten.&quot;,&quot;Je kunt helemaal niet meer praten.&quot;,&quot;Je hartslag wordt lager dan in rust.&quot;,&quot;Je hoeft niet meer te ademen.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Bij matig intensief bewegen gaat je ademhaling omhoog, maar praten lukt nog.&quot;},{&quot;section&quot;:&quot;2.1 Bewegen en gezondheid&quot;,&quot;prompt&quot;:&quot;Welke stof in je hersenen kan bijdragen aan een prettig gevoel na bewegen?&quot;,&quot;options&quot;:[&quot;Zout.&quot;,&quot;Endorfine.&quot;,&quot;Koolstofdioxide.&quot;,&quot;Maagzuur.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Bij bewegen kunnen onder meer endorfine en dopamine vrijkomen, die invloed hebben op je stemming.&quot;},{&quot;section&quot;:&quot;2.2 Verschillende sporten&quot;,&quot;prompt&quot;:&quot;Welke sport is een teamsport?&quot;,&quot;options&quot;:[&quot;Hardlopen.&quot;,&quot;Voetbal.&quot;,&quot;Individueel zwemmen.&quot;,&quot;Wielrennen in je eentje.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Bij voetbal werk je met teamgenoten samen aan een gezamenlijk resultaat.&quot;},{&quot;section&quot;:&quot;2.2 Verschillende sporten&quot;,&quot;prompt&quot;:&quot;Wat is een mogelijk nadeel van teamsport?&quot;,&quot;options&quot;:[&quot;Je hebt nooit contact met anderen.&quot;,&quot;Je kunt nooit samenwerken.&quot;,&quot;Je bent soms afhankelijk van teamgenoten.&quot;,&quot;Je hoeft nooit rekening te houden met tijden.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;In een teamsport hangt het resultaat mede af van je teamgenoten en zijn er vaak vaste trainingstijden.&quot;},{&quot;section&quot;:&quot;2.2 Verschillende sporten&quot;,&quot;prompt&quot;:&quot;Noah zwemt wedstrijden bij een zwemvereniging. Wat klopt?&quot;,&quot;options&quot;:[&quot;Alleen teamsport.&quot;,&quot;Individuele én gebonden sport.&quot;,&quot;Alleen ongebonden sport.&quot;,&quot;Teamsport én ongebonden sport.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Noah levert een eigen wedstrijdprestatie, maar is lid van een vereniging: individueel én gebonden.&quot;},{&quot;section&quot;:&quot;2.2 Verschillende sporten&quot;,&quot;prompt&quot;:&quot;Wat betekent contributie?&quot;,&quot;options&quot;:[&quot;Een prijs die je wint.&quot;,&quot;Geld dat je betaalt voor een lidmaatschap.&quot;,&quot;Het aantal trainingen per week.&quot;,&quot;Een sportblessure.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Contributie is het bedrag dat je betaalt om lid te zijn van bijvoorbeeld een sportvereniging.&quot;},{&quot;section&quot;:&quot;2.2 Verschillende sporten&quot;,&quot;prompt&quot;:&quot;Sara wil zelf kiezen wanneer ze sport. Welke keuze past het beste?&quot;,&quot;options&quot;:[&quot;Verplichte teamtraining op vaste tijden.&quot;,&quot;Een wedstrijdcompetitie met vaste speeldagen.&quot;,&quot;Zelfstandig hardlopen wanneer ze tijd heeft.&quot;,&quot;Een sport die ze niet leuk vindt.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Bij zelfstandig hardlopen kan Sara meestal zelf haar tijd en tempo bepalen.&quot;},{&quot;section&quot;:&quot;2.3 Conditie en herstel&quot;,&quot;prompt&quot;:&quot;Welke eigenschap hoort bij CLUKS?&quot;,&quot;options&quot;:[&quot;Concentratie.&quot;,&quot;Lenigheid.&quot;,&quot;Lezen.&quot;,&quot;Slapen.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;CLUKS staat voor coördinatie, lenigheid, uithoudingsvermogen, kracht en snelheid.&quot;},{&quot;section&quot;:&quot;2.3 Conditie en herstel&quot;,&quot;prompt&quot;:&quot;Welke eigenschap gebruik je vooral als je lang blijft hardlopen?&quot;,&quot;options&quot;:[&quot;Uithoudingsvermogen.&quot;,&quot;Alleen lenigheid.&quot;,&quot;Alleen reactiesnelheid.&quot;,&quot;Geen enkele conditie-eigenschap.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Uithoudingsvermogen helpt je om een inspanning langere tijd vol te houden.&quot;},{&quot;section&quot;:&quot;2.3 Conditie en herstel&quot;,&quot;prompt&quot;:&quot;Wat betekent rusthartslag?&quot;,&quot;options&quot;:[&quot;De hartslag tijdens sprinten.&quot;,&quot;De hartslag wanneer je lichaam in rust is.&quot;,&quot;Je hoogste mogelijke hartslag.&quot;,&quot;De hartslag na een botsing.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;De rusthartslag meet je wanneer je rustig zit of ligt en niet actief bezig bent.&quot;},{&quot;section&quot;:&quot;2.3 Conditie en herstel&quot;,&quot;prompt&quot;:&quot;Wat gebeurt er meestal met je spieren na een zware training?&quot;,&quot;options&quot;:[&quot;Ze hebben nooit rust nodig.&quot;,&quot;Ze kunnen belast zijn en hebben herstel nodig.&quot;,&quot;Ze worden meteen zonder herstel sterker.&quot;,&quot;Ze verdwijnen tijdelijk.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Training belast je spieren. Tijdens herstel past je lichaam zich aan de inspanning aan.&quot;},{&quot;section&quot;:&quot;2.3 Conditie en herstel&quot;,&quot;prompt&quot;:&quot;Wat betekent supercompensatie?&quot;,&quot;options&quot;:[&quot;Dat je conditie altijd achteruitgaat.&quot;,&quot;Dat je direct na iedere training op je sterkst bent.&quot;,&quot;Dat je lichaam na voldoende herstel beter voorbereid kan zijn op een volgende inspanning.&quot;,&quot;Dat je nooit rust neemt.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Na de belasting en voldoende herstel kan het lichaam tijdelijk beter presteren dan ervoor.&quot;},{&quot;section&quot;:&quot;2.4 Eten, drinken en slapen&quot;,&quot;prompt&quot;:&quot;Welke voedingsstof gebruikt je lichaam vooral als bouwstof voor spieren?&quot;,&quot;options&quot;:[&quot;Eiwitten.&quot;,&quot;Waterdamp.&quot;,&quot;Zuurstof uit voedsel.&quot;,&quot;Koolstofdioxide.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Eiwitten zijn belangrijke bouwstoffen voor de opbouw en het herstel van lichaamsweefsel, waaronder spieren.&quot;},{&quot;section&quot;:&quot;2.4 Eten, drinken en slapen&quot;,&quot;prompt&quot;:&quot;Welke voedingsstoffen leveren vooral energie als brandstof?&quot;,&quot;options&quot;:[&quot;Vitamines en mineralen.&quot;,&quot;Koolhydraten en vetten.&quot;,&quot;Alleen water.&quot;,&quot;Alleen voedingsvezels.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Koolhydraten en vetten leveren energie. Ook eiwitten kunnen energie leveren, maar hebben vooral een bouwfunctie.&quot;},{&quot;section&quot;:&quot;2.4 Eten, drinken en slapen&quot;,&quot;prompt&quot;:&quot;Waarom moet je na veel zweten voldoende drinken?&quot;,&quot;options&quot;:[&quot;Om het vochtverlies aan te vullen.&quot;,&quot;Om meer zweet te maken dan nodig.&quot;,&quot;Om je spieren zonder voeding te laten groeien.&quot;,&quot;Om minder bloed in je lichaam te krijgen.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Door zweten verlies je vocht. Drinken helpt de vochtbalans op peil te houden.&quot;},{&quot;section&quot;:&quot;2.4 Eten, drinken en slapen&quot;,&quot;prompt&quot;:&quot;Wat betekent hydratatie?&quot;,&quot;options&quot;:[&quot;De hoeveelheid vet in voeding.&quot;,&quot;Voldoende vocht in je lichaam hebben.&quot;,&quot;De snelheid van je hartslag.&quot;,&quot;Vocht dat je verliest tijdens het sporten.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Hydratatie gaat over de vochtbalans van je lichaam en het voldoende binnenkrijgen van vocht.&quot;},{&quot;section&quot;:&quot;2.4 Eten, drinken en slapen&quot;,&quot;prompt&quot;:&quot;Waarom is voldoende slaap belangrijk voor sporters?&quot;,&quot;options&quot;:[&quot;Tijdens slaap kan je lichaam herstellen.&quot;,&quot;Je spieren hebben nooit herstel nodig.&quot;,&quot;Slapen vervangt alle trainingen.&quot;,&quot;Je hebt dan geen voeding meer nodig.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Slaap helpt bij lichamelijk herstel, concentratie en het aanvullen van energie.&quot;},{&quot;section&quot;:&quot;2.5 Veilig sporten&quot;,&quot;prompt&quot;:&quot;Wat is het doel van een warming-up?&quot;,&quot;options&quot;:[&quot;Je spieren voorbereiden op inspanning.&quot;,&quot;Zo snel mogelijk afkoelen.&quot;,&quot;Voorkomen dat je hartslag stijgt.&quot;,&quot;Direct stoppen met bewegen.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Met een warming-up warm je je lichaam geleidelijk op en bereid je spieren en gewrichten voor op de activiteit.&quot;},{&quot;section&quot;:&quot;2.5 Veilig sporten&quot;,&quot;prompt&quot;:&quot;Wat past bij een cooling-down?&quot;,&quot;options&quot;:[&quot;Plotseling gaan zitten na maximaal sprinten.&quot;,&quot;Rustig uitlopen en de inspanning afbouwen.&quot;,&quot;Een blessure koelen met ijs.&quot;,&quot;Geen beweging meer mogen maken.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Met een cooling-down bouw je de inspanning geleidelijk af, bijvoorbeeld door rustig uit te lopen.&quot;},{&quot;section&quot;:&quot;2.5 Veilig sporten&quot;,&quot;prompt&quot;:&quot;Welk beschermingsmiddel beschermt je hoofd bij een val?&quot;,&quot;options&quot;:[&quot;Handschoenen.&quot;,&quot;Een helm.&quot;,&quot;Scheenbeschermers.&quot;,&quot;Een gebitsbeschermer.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Een fietshelm kan helpen om hoofdletsel bij een val te beperken.&quot;},{&quot;section&quot;:&quot;2.5 Veilig sporten&quot;,&quot;prompt&quot;:&quot;Waarom mag je ijs niet rechtstreeks op de huid leggen bij een blessure?&quot;,&quot;options&quot;:[&quot;Omdat ijs de zwelling altijd groter maakt.&quot;,&quot;Omdat het de blessure direct geneest.&quot;,&quot;Omdat het huid- of koudeschade kan veroorzaken.&quot;,&quot;Omdat koelen nooit mag.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Leg altijd een doek tussen de huid en een coldpack of ijs om koudeschade te voorkomen.&quot;},{&quot;section&quot;:&quot;2.5 Veilig sporten&quot;,&quot;prompt&quot;:&quot;Wat is een acute blessure?&quot;,&quot;options&quot;:[&quot;Een blessure die plotseling ontstaat, bijvoorbeeld bij een val.&quot;,&quot;Een blessure die altijd pas na jaren ontstaat.&quot;,&quot;Een blessure die langzaam ontstaat door herhaalde overbelasting.&quot;,&quot;Een blessure waarbij de klachten geleidelijk erger worden.&quot;],&quot;correct&quot;:0,&quot;explanation&quot;:&quot;Een acute blessure ontstaat ineens, bijvoorbeeld door een verzwikking, botsing of val.&quot;},{&quot;section&quot;:&quot;2.6 Sportief met elkaar omgaan&quot;,&quot;prompt&quot;:&quot;Welke situatie laat Fair Play zien?&quot;,&quot;options&quot;:[&quot;Liam scheldt de scheidsrechter uit.&quot;,&quot;Finn helpt een gevallen tegenstander overeind.&quot;,&quot;Sem speelt expres vals.&quot;,&quot;Noah lacht een geblesseerde speler uit.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Fair Play betekent eerlijk en respectvol sporten, ook tegenover tegenstanders.&quot;},{&quot;section&quot;:&quot;2.6 Sportief met elkaar omgaan&quot;,&quot;prompt&quot;:&quot;Welke regel is een geschreven regel?&quot;,&quot;options&quot;:[&quot;Een tegenstander bedanken na afloop.&quot;,&quot;Iemand helpen na een botsing.&quot;,&quot;Bij voetbal mag een veldspeler de bal niet met zijn handen spelen.&quot;,&quot;Je teamgenoot aanmoedigen.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Geschreven regels zijn de officiële spelregels van een sport.&quot;},{&quot;section&quot;:&quot;2.6 Sportief met elkaar omgaan&quot;,&quot;prompt&quot;:&quot;Wat betekent teambuilding?&quot;,&quot;options&quot;:[&quot;Alleen de beste speler laten meedoen.&quot;,&quot;Werken aan vertrouwen en samenwerking binnen een team.&quot;,&quot;Nooit met elkaar praten.&quot;,&quot;Altijd de scheidsrechter de schuld geven.&quot;],&quot;correct&quot;:1,&quot;explanation&quot;:&quot;Teambuilding draait om vertrouwen, communiceren, helpen en samen doelen bereiken.&quot;},{&quot;section&quot;:&quot;2.6 Sportief met elkaar omgaan&quot;,&quot;prompt&quot;:&quot;Wat past het beste bij inclusie?&quot;,&quot;options&quot;:[&quot;Mila buitensluiten omdat ze minder snel rent.&quot;,&quot;Iedereen dezelfde oefening laten doen, ook als dat niet kan.&quot;,&quot;De oefening aanpassen zodat Mila kan meedoen.&quot;,&quot;Alleen ervaren spelers toelaten.&quot;],&quot;correct&quot;:2,&quot;explanation&quot;:&quot;Inclusie betekent dat iedereen kan meedoen en zich welkom voelt. Soms vraagt dat om een aanpassing.&quot;},{&quot;sect
