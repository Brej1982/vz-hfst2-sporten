<script id="submission-script">
(function(){
'use strict';
const labels={'21':'2.1 Waarom bewegen en sporten?','22':'2.2 Verschillende sporten','23':'2.3 Fit blijven en conditie','24':'2.4 Eten, drinken en slapen','25':'2.5 Veilig sporten','26':'2.6 Sportief met elkaar omgaan','27':'Diagnostische toets'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const txt=e=>clean(e?.innerText||e?.textContent||'');
function answerLabel(el){return txt(el.closest('label'))||txt(el.parentElement)||clean(el.value)}
function readQuestion(block,index){
 const title=txt(block.querySelector(':scope > b,:scope > strong,:scope > h3,:scope > h4,:scope > h2'))||'Opdracht '+index;
 const parts=[];const radios=new Set();
 block.querySelectorAll('input,textarea,select').forEach(el=>{
  if(el.type==='hidden'||['button','submit','reset'].includes(el.type))return;
  if(el.type==='radio'){
   if(radios.has(el.name))return;radios.add(el.name);
   const group=[...block.querySelectorAll('input[type="radio"]')].filter(x=>x.name===el.name);
   const chosen=group.find(x=>x.checked);if(chosen)parts.push(answerLabel(chosen));
  }else if(el.type==='checkbox'){
   if(el.checked)parts.push(answerLabel(el));
  }else if(el.tagName==='SELECT'){
   if(el.value==='')return;
   const row=el.closest('.matchrow,.qrow,.row,.match-row,label,li');
   const context=txt(row?.querySelector('span,p,strong'));
   parts.push((context?context+': ':'')+txt(el.selectedOptions[0]));
  }else if(clean(el.value)){
   const row=el.closest('.qrow,.row,.matchrow,.match-row');const context=txt(row?.querySelector('span,strong'));
   parts.push((context?context+': ':'')+clean(el.value));
  }
 });
 // Lees sleepopdrachten rechtstreeks uit de werkelijke posities van de kaartjes.
 const zones=[...block.querySelectorAll('.drop,.zone,.dropzone,.drop-zone,.bucket,.target')];
 zones.forEach((zone,i)=>{
  const chips=[...zone.querySelectorAll('.chip,[draggable="true"]')].filter(x=>x.closest('.drop,.zone,.dropzone,.drop-zone,.bucket,.target')===zone);
  if(chips.length){const heading=txt(zone.querySelector('h3,h4,strong,.label'))||zone.dataset.group||zone.dataset.label||'Groep '+(i+1);parts.push(heading+': '+chips.map(txt).join(', '))}
 });
 // Lees volgordeoefeningen, ook als ze uitsluitend pijltjes hebben en geen invoervelden.
 const lists=[...block.querySelectorAll('.steps,.orderzone,.order-list,.arrow-order,.arrow-list,.sort-list,[id^="order"]')];
 const used=new Set();
 lists.forEach(list=>{
  if(lists.some(other=>other!==list&&other.contains(list)))return;
  const items=[...list.children].filter(x=>x.matches('.step,.arrow-step,.chip,.order-item,[draggable="true"]'));
  if(items.length){used.add(list);parts.push('Volgorde: '+items.map((x,i)=>(i+1)+'. '+txt(x.querySelector(':scope > span:first-child,.step-text,.item-text')||x).replace(/[↑↓⇧⇩]/g,'').trim()).join(' | '))}
 });
 if(!used.size){
  const items=[...block.querySelectorAll('.arrow-step')];
  if(items.length)parts.push('Volgorde: '+items.map((x,i)=>(i+1)+'. '+txt(x.querySelector('span')||x).replace(/[↑↓⇧⇩]/g,'')).join(' | '));
 }
 // Ook andere interactieve kaartjes die naar een antwoordvak zijn gesleept.
 block.querySelectorAll('[data-item][draggable="true"]').forEach(chip=>{
  const parent=chip.parentElement;
  if(!parent||parent.matches('.dragbank,.bank,.chipbank,.source,.items'))return;
  if(zones.some(z=>z.contains(chip))||lists.some(z=>z.contains(chip)))return;
  const name=txt(parent.querySelector('h3,h4,strong'))||parent.id||'Antwoordvak';
  const entry=name+': '+txt(chip);if(!parts.includes(entry))parts.push(entry);
 });
 return {question:title,answer:[...new Set(parts)].join(' | ')||'Niet ingevuld'};
}
function collect(doc,id){
 const blocks=[...doc.querySelectorAll('.question,.q')].filter(x=>!x.parentElement?.closest('.question,.q'));
 let answers=blocks.map((b,i)=>readQuestion(b,i+1));
 if(id==='27'){
  // De diagnostische toets bouwt vragen dynamisch op. Lees elke antwoordgroep apart.
  const radios=[...doc.querySelectorAll('input[type="radio"][name^="answer"]')];
  const groups=[...new Set(radios.map(x=>x.name))];
  answers=groups.map((name,i)=>{
   const choices=radios.filter(x=>x.name===name),chosen=choices.find(x=>x.checked);
   const container=choices[0]?.closest('.question,.q,.question-card,.quiz-question,fieldset,.question-item')||choices[0]?.parentElement?.parentElement;
   const question=txt(container?.querySelector('h3,h4,strong,.question-text,legend,p'))||'Vraag '+(i+1);
   return {question,answer:chosen?answerLabel(chosen):'Niet ingevuld'};
  });
 }
 const feedback=[...doc.querySelectorAll('.score,.result,.feedback,[id^="score"]')].filter(x=>!x.hidden&&getComputedStyle(x).display!=='none').map(txt).filter(x=>x&&x.length<180);
 return {answers,feedback:[...new Set(feedback)].slice(0,70)};
}
function exportSubmission(){
 const id=typeof currentLesson==='function'?currentLesson():'Home';
 if(!labels[id]){alert('Open eerst een paragraaf of de diagnostische toets om die afzonderlijk in te leveren.');return}
 const frame=document.getElementById('lesson'+id);let doc;
 try{doc=frame.contentDocument}catch(e){}
 if(!doc){alert('De paragraaf is nog niet geladen. Probeer het opnieuw.');return}
 let name=doc.getElementById('studentName')?.value?.trim()||'';
 let klass=doc.getElementById('studentClass')?.value?.trim()||'';
 // Leerlinggegevens worden voor volgende paragrafen bewaard, niet de antwoorden.
 try{const saved=JSON.parse(localStorage.getItem('sporten_inlevergegevens')||'{}');name=name||saved.name||'';klass=klass||saved.klass||''}catch(e){}
 if(!name){const n=prompt('Voor- en achternaam:',name);if(n===null)return;name=n.trim()}
 if(!klass){const k=prompt('Klas:',klass);if(k===null)return;klass=k.trim()}
 if(!name||!klass){alert('Vul je naam en klas in.');return}
 try{localStorage.setItem('sporten_inlevergegevens',JSON.stringify({name,klass}))}catch(e){}
 const data=collect(doc,id);
 if(!data.answers.length){alert('Er zijn in deze paragraaf geen in te leveren vragen gevonden.');return}
 const now=new Date().toLocaleString('nl-NL');
 const report='<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>'+esc(labels[id])+' - '+esc(name)+'</title><style>body{font:14px/1.5 Arial,sans-serif;color:#18383e;max-width:850px;margin:35px auto;padding:0 20px}h1,h2{color:#006c74}h2{border-bottom:2px solid #a8dadd;padding-bottom:5px;margin-top:25px}header{border-bottom:3px solid #006c74;margin-bottom:25px}.meta{background:#edf8f8;padding:14px;border-radius:8px}.qa{padding:9px 0;border-bottom:1px solid #ddd;break-inside:avoid}.q{font-weight:bold}.a{white-space:pre-wrap;margin-top:4px}.muted{color:#5a7377}.actions{position:sticky;top:0;background:white;padding:12px 0;border-bottom:1px solid #ccc}button{background:#006c74;color:white;border:0;border-radius:7px;padding:11px 16px;font-size:15px;cursor:pointer}@media print{.actions{display:none}body{margin:0;max-width:none;padding:0}h2{break-after:avoid}@page{size:A4;margin:16mm}}</style></head><body><div class="actions"><button onclick="window.print()">Opslaan als PDF / Afdrukken</button> <span class="muted">Kies bij afdrukken: Opslaan als PDF. </span></div><header><h1>Verzorging | Hoofdstuk 2 Sporten</h1><h2>'+esc(labels[id])+'</h2></header><div class="meta"><strong>Naam:</strong> '+esc(name)+'<br><strong>Klas:</strong> '+esc(klass)+'<br><strong>Datum:</strong> '+esc(now)+'</div>'+data.answers.map((x,i)=>'<div class="qa"><div class="q">'+esc(x.question)+'</div><div class="a">'+esc(x.answer)+'</div></div>').join('')+(data.feedback.length?'<h3>Getoonde controle en resultaten</h3>'+data.feedback.map(x=>'<p>'+esc(x)+'</p>').join(''):'')+'<p class="muted">Dit bestand bevat alleen de antwoorden van '+esc(labels[id])+'.</p></body></html>';
 const w=window.open('','_blank');if(!w){alert('Sta pop-ups toe in je browser en probeer opnieuw.');return}
 w.document.open();w.document.write(report);w.document.close();w.focus();
}
function install(){
 const footer=document.querySelector('.chapter-footer');if(!footer)return;
 const btn=document.createElement('button');btn.type='button';btn.className='submission-button';btn.textContent='Antwoorden van deze paragraaf inleveren';btn.title='Maak een PDF-inleverblad van alleen deze paragraaf';btn.addEventListener('click',exportSubmission);footer.appendChild(btn);
 const update=()=>{const id=typeof currentLesson==='function'?currentLesson():'Home';btn.hidden=!labels[id];btn.textContent=id==='27'?'Diagnostische toets inleveren':'Antwoorden van paragraaf '+id[0]+'.'+id[1]+' inleveren'};
 document.querySelectorAll('.menu .tab,.chapter-footer button,.overview').forEach(x=>x.addEventListener('click',()=>setTimeout(update,0)));
 window.addEventListener('hashchange',update);update();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script>
</body></html>
